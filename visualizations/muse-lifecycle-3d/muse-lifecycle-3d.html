<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>MUSE · Workflow Lifecycle — 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05070f; --panel:rgba(16,24,44,0.66); --panel2:rgba(12,18,36,0.82);
    --stroke:rgba(90,120,180,0.28); --txt:#e8eeff; --mut:#9fb0d6; --cy:#37d0d6; --gd:#f4c95d;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;overflow:hidden}
  #scene{position:fixed;inset:0;display:block}
  .glass{background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid var(--stroke);border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
  /* left menu */
  #menu{position:fixed;top:16px;left:16px;width:270px;max-height:calc(100vh - 32px);
    overflow:auto;padding:14px 12px;z-index:10}
  #menu h1{font-family:Orbitron,sans-serif;font-size:15px;letter-spacing:.14em;margin:2px 4px 2px;
    background:linear-gradient(90deg,#7cf6ff,#b48bff 60%,#f4c95d);-webkit-background-clip:text;background-clip:text;color:transparent}
  #menu .sub{font-size:10.5px;color:var(--mut);margin:0 4px 12px;letter-spacing:.03em}
  .fam{margin:10px 2px 3px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    display:flex;align-items:center;gap:7px;color:var(--mut)}
  .fam .dot{width:9px;height:9px;border-radius:50%}
  .flowbtn{display:flex;gap:8px;align-items:center;width:100%;text-align:left;cursor:pointer;
    background:transparent;border:1px solid transparent;border-radius:9px;color:var(--txt);
    padding:6px 8px;font-size:12px;font-family:inherit;transition:.15s;line-height:1.15}
  .flowbtn:hover{background:rgba(120,150,220,.10);border-color:var(--stroke)}
  .flowbtn.active{background:rgba(124,246,255,.12);border-color:rgba(124,246,255,.5)}
  .flowbtn .code{font-family:Orbitron,monospace;font-size:10px;min-width:26px;color:var(--mut)}
  .flowbtn.active .code{color:var(--cy)}
  /* header */
  #hdr{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:9;
    padding:12px 20px;max-width:min(640px,58vw);text-align:center}
  #hdr .code{font-family:Orbitron,monospace;font-size:11px;letter-spacing:.2em;color:var(--gd)}
  #hdr h2{margin:3px 0 5px;font-size:20px;font-weight:700;letter-spacing:.01em}
  #hdr .prompt{font-size:12px;color:var(--mut);font-style:italic}
  #hdr .metrics{font-size:11px;color:var(--cy);margin-top:5px;font-family:Orbitron,monospace;letter-spacing:.04em}
  /* controls */
  #ctrls{position:fixed;top:16px;right:16px;z-index:10;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
  .row{display:flex;gap:8px}
  .btn{cursor:pointer;font-family:inherit;font-size:11.5px;color:var(--txt);padding:8px 12px;border-radius:10px;
    background:var(--panel2);border:1px solid var(--stroke);backdrop-filter:blur(10px);transition:.15s;white-space:nowrap}
  .btn:hover{border-color:var(--cy);color:#fff}
  .btn.on{border-color:var(--cy);color:var(--cy)}
  /* legend */
  #legend{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:9;
    padding:9px 14px;display:flex;gap:14px;flex-wrap:wrap;justify-content:center;max-width:92vw}
  #legend .item{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--mut)}
  #legend .sw{width:11px;height:11px;border-radius:3px}
  #legend .ln{width:16px;height:0;border-top:2px solid}
  /* tooltip */
  #tip{position:fixed;z-index:20;pointer-events:none;padding:8px 11px;max-width:250px;font-size:12px;
    opacity:0;transition:opacity .12s;transform:translate(-50%,-120%)}
  #tip .t{font-weight:600}
  #tip .a{color:var(--cy);font-size:11px;margin-top:2px;font-family:Orbitron,monospace}
  #tip .ty{color:var(--mut);font-size:10px;text-transform:uppercase;letter-spacing:.1em;margin-top:3px}
  #hint{position:fixed;bottom:14px;right:16px;z-index:9;font-size:10.5px;color:var(--mut);
    padding:7px 11px}
  #err{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:40px;z-index:50}
  #err div{max-width:520px}
  a{color:var(--cy)}
  ::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:rgba(120,150,220,.3);border-radius:8px}
</style>
</head>

<canvas id="scene"></canvas>

  <div class="row">

  <div class="row">

/* ---------- textures ---------- */
function radialTex(inner,outer){
  const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');
  const g=x.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,inner);g.addColorStop(0.4,outer);g.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=g;x.fillRect(0,0,128,128);return new THREE.CanvasTexture(c);
}
const DOT=radialTex('rgba(255,255,255,1)','rgba(255,255,255,0.25)');
const GLOW=radialTex('rgba(255,255,255,0.9)','rgba(255,255,255,0.12)');

function roundRect(x,rx,ry,w,h,r){x.beginPath();x.moveTo(rx+r,ry);
  x.arcTo(rx+w,ry,rx+w,ry+h,r);x.arcTo(rx+w,ry+h,rx,ry+h,r);
  x.arcTo(rx,ry+h,rx,ry,r);x.arcTo(rx,ry,rx+w,ry,r);x.closePath();}
function wrap(x,txt,maxw){const words=(txt||'').split(' ');let line='',out=[];
  for(const w of words){const t=line?line+' '+w:w;if(x.measureText(t).width>maxw&&line){out.push(line);line=w;}else line=t;}
  if(line)out.push(line);return out;}

function cardTexture(node,fam){
  const W=560,H=260,c=document.createElement('canvas');c.width=W;c.height=H;
  const x=c.getContext('2d');const col=TYPECOL[node.type]||'#8ab4ff';
  // panel
  x.fillStyle='rgba(11,17,33,0.94)';roundRect(x,8,8,W-16,H-16,26);x.fill();
  // family border glow
  x.lineWidth=4;x.strokeStyle=fam;x.shadowColor=fam;x.shadowBlur=22;roundRect(x,8,8,W-16,H-16,26);x.stroke();x.shadowBlur=0;
  // type accent bar (left)
  x.fillStyle=col;roundRect(x,8,8,10,H-16,6);x.fill();
  // glyph chip
  x.fillStyle=col;x.font='700 44px system-ui,Segoe UI,Arial';x.textBaseline='top';
  x.fillText(TYPEGLYPH[node.type]||'●',40,34);
  // type label
  x.fillStyle='rgba(159,176,214,0.9)';x.font='600 20px Segoe UI,system-ui,Arial';
  x.fillText((node.type||'').toUpperCase(),102,40);
  // flags
  let fx=102+x.measureText((node.type||'').toUpperCase()).width+16;
  (node.flags||[]).forEach(fl=>{const t=fl.toUpperCase();x.fillStyle='rgba(244,201,93,0.9)';
    x.font='600 15px Segoe UI';roundRect(x,fx,42,x.measureText(t).width+16,20,10);x.strokeStyle='rgba(244,201,93,.6)';x.lineWidth=1.5;x.stroke();
    x.fillText(t,fx+8,44);fx+=x.measureText(t).width+24;});
  // title
  x.fillStyle='#eef3ff';x.font='700 40px Segoe UI,system-ui,Arial';
  const tl=wrap(x,node.label,W-90);let ty=96;
  tl.slice(0,2).forEach(l=>{x.fillText(l,40,ty);ty+=46;});
  // subtitle
  if(node.sub){x.fillStyle='rgba(159,176,214,0.95)';x.font='400 24px Segoe UI,system-ui,Arial';
    const sl=wrap(x,node.sub,W-80);sl.slice(0,2).forEach(l=>{x.fillText(l,40,ty+4);ty+=30;});}
  const tex=new THREE.CanvasTexture(c);tex.anisotropy=4;return tex;
}

function makeStars(){
  const n=1600,g=new THREE.BufferGeometry(),p=new Float32Array(n*3);
  for(let i=0;i<n;i++){const r=380+Math.random()*520,th=Math.random()*6.28,ph=Math.acos(2*Math.random()-1);
    p[i*3]=r*Math.sin(ph)*Math.cos(th);p[i*3+1]=r*Math.sin(ph)*Math.sin(th);p[i*3+2]=r*Math.cos(ph);}
  g.setAttribute('position',new THREE.BufferAttribute(p,3));
  stars=new THREE.Points(g,new THREE.PointsMaterial({color:0x9fc0ff,size:1.5,sizeAttenuation:true,
    transparent:true,opacity:0.75,map:DOT,blending:THREE.AdditiveBlending,depthWrite:false}));
  scene.add(stars);
}
function makeNebula(){
  const n=90,g=new THREE.Group();
  for(let i=0;i<n;i++){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:GLOW,
    color:[0x1a2b5a,0x22406b,0x3a2a5e][i%3],transparent:true,opacity:0.10,blending:THREE.AdditiveBlending,depthWrite:false}));
    const r=120+Math.random()*260;s.position.set((Math.random()-.5)*r,(Math.random()-.5)*r*0.6,(Math.random()-.5)*r-60);
    const sc=40+Math.random()*90;s.scale.set(sc,sc,1);g.add(s);}
  nebula=g;scene.add(g);
}

/* ---------- build a flow ---------- */
function disposeGroup(gp){gp.traverse(o=>{if(o.material){if(o.material.map&&o.material.map!==DOT&&o.material.map!==GLOW)o.material.map.dispose();o.material.dispose();}if(o.geometry)o.geometry.dispose();});}
function pos(node){return new THREE.Vector3(node.col*COLGAP, -node.row*ROWGAP, Math.sin(node.row*0.7)*5.2 + (node.col*1.6));}

function edgeCurve(a,b,kind){
  const mid=a.clone().add(b).multiplyScalar(0.5);
  if(kind==='loop'){const off=new THREE.Vector3(Math.max(9,Math.abs(a.x-b.x)+7),0,10);
    return new THREE.CubicBezierCurve3(a,a.clone().add(off),b.clone().add(off),b);}
  if(kind==='compensate'){const off=new THREE.Vector3(-8,0,9);
    return new THREE.CubicBezierCurve3(a,a.clone().add(off),b.clone().add(off),b);}
  mid.z+=3.2; return new THREE.QuadraticBezierCurve3(a,mid,b);
}

function selectFlow(id){
  curId=id; curIndex=DATA.order.indexOf(id);
  if(flowGroup){scene.remove(flowGroup);disposeGroup(flowGroup);}
  flowGroup=new THREE.Group();scene.add(flowGroup);
  nodeSprites=[];edges=[];
  const flow=DATA.flows[id];const fam=DATA.families[flow.family].color;
  const P={}; flow.nodes.forEach(n=>P[n.id]=pos(n));
  // edges first
  flow.edges.forEach(e=>{
    if(!P[e.from]||!P[e.to])return;
    const curve=edgeCurve(P[e.from],P[e.to],e.kind);const col=EDGECOL[e.kind]||'#37d0d6';
    const tube=new THREE.Mesh(new THREE.TubeGeometry(curve,44,e.kind==='flow'?0.09:0.075,8,false),
      new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:e.kind==='flow'?0.5:0.62,
      blending:THREE.AdditiveBlending,depthWrite:false}));
    flowGroup.add(tube);
    const dots=[];const N=e.kind==='flow'?7:5;
    for(let i=0;i<N;i++){const d=new THREE.Sprite(new THREE.SpriteMaterial({map:DOT,color:col,
      transparent:true,opacity:0.95,blending:THREE.AdditiveBlending,depthWrite:false}));
      d.scale.set(0.95,0.95,1);flowGroup.add(d);dots.push(d);}
    edges.push({curve,dots,N,kind:e.kind});
  });
  // nodes
  flow.nodes.forEach((n,i)=>{
    const grp=new THREE.Group();grp.position.copy(P[n.id]);
    const col=TYPECOL[n.type]||'#8ab4ff';
    const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:GLOW,color:col,transparent:true,
      opacity:0.5,blending:THREE.AdditiveBlending,depthWrite:false}));
    halo.scale.set(12,9,1);halo.position.z=-0.2;grp.add(halo);
    const card=new THREE.Sprite(new THREE.SpriteMaterial({map:cardTexture(n,fam),transparent:true,depthWrite:false}));
    card.scale.set(7.8,3.62,1);grp.add(card);
    grp.userData={node:n,card,halo,base:7.8,baseh:3.62,t:i*0.05,col};
    grp.scale.setScalar(0.01);
    flowGroup.add(grp);nodeSprites.push(grp);
  });
  frame(P);
  // header + menu state
  const f=flow;
  document.getElementById('h-code').textContent=f.code+' · '+f.id;
  document.getElementById('h-title').textContent=f.title;
  document.getElementById('h-prompt').textContent=f.prompt?('“'+f.prompt+'”'):'';
  document.getElementById('h-metrics').textContent=f.metrics||'';
  document.querySelectorAll('.flowbtn').forEach(b=>b.classList.toggle('active',b.dataset.id===id));
  const active=document.querySelector('.flowbtn.active');if(active)active.scrollIntoView({block:'nearest'});
}

function frame(P){
  const c=new THREE.Vector3();const keys=Object.keys(P);keys.forEach(k=>c.add(P[k]));c.multiplyScalar(1/keys.length);
  let maxd=0;keys.forEach(k=>maxd=Math.max(maxd,P[k].distanceTo(c)));
  ctr.dTarget.copy(c);ctr.dRadius=maxd*1.7+26;ctr.dTheta=0.82;ctr.dPhi=1.12;ctr.idle=0;
}

/* ---------- controls ---------- */
function addControls(){
  const el=renderer.domElement;
  el.addEventListener('pointerdown',e=>{ctr.dragging=true;ctr.px=e.clientX;ctr.py=e.clientY;
    ctr.mode=(e.shiftKey||e.button===2||e.button===1)?'pan':'rotate';ctr.idle=-999;el.setPointerCapture(e.pointerId);});
  el.addEventListener('pointerup',e=>{ctr.dragging=false;ctr.idle=0;});
  el.addEventListener('pointermove',e=>{
    pointer.x=(e.clientX/innerWidth)*2-1;pointer.y=-(e.clientY/innerHeight)*2+1;
    if(!ctr.dragging)return;const dx=e.clientX-ctr.px,dy=e.clientY-ctr.py;ctr.px=e.clientX;ctr.py=e.clientY;
    if(ctr.mode==='rotate'){ctr.dTheta-=dx*0.006;ctr.dPhi-=dy*0.006;ctr.dPhi=Math.max(0.2,Math.min(2.9,ctr.dPhi));}
    else{const s=ctr.radius*0.0016;const right=new THREE.Vector3().setFromMatrixColumn(camera.matrix,0);
      const up=new THREE.Vector3().setFromMatrixColumn(camera.matrix,1);
      ctr.dTarget.addScaledVector(right,-dx*s);ctr.dTarget.addScaledVector(up,dy*s);}
  });
  el.addEventListener('wheel',e=>{e.preventDefault();ctr.dRadius*=(1+Math.sign(e.deltaY)*0.08);
    ctr.dRadius=Math.max(10,Math.min(260,ctr.dRadius));ctr.idle=-999;},{passive:false});
  el.addEventListener('contextmenu',e=>e.preventDefault());
}
function updateControls(dt){
  if(autoRotate){ctr.idle+=dt;if(ctr.idle>1.6&&!ctr.dragging)ctr.dTheta+=dt*0.12;}
  ctr.theta+=(ctr.dTheta-ctr.theta)*0.09;ctr.phi+=(ctr.dPhi-ctr.phi)*0.09;
  ctr.radius+=(ctr.dRadius-ctr.radius)*0.08;ctr.target.lerp(ctr.dTarget,0.09);
  const r=ctr.radius,sp=Math.sin(ctr.phi);
  camera.position.set(ctr.target.x+r*sp*Math.sin(ctr.theta),ctr.target.y+r*Math.cos(ctr.phi),
    ctr.target.z+r*sp*Math.cos(ctr.theta));
  camera.lookAt(ctr.target);
}

/* ---------- loop ---------- */
function animate(){
  requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),0.05);
  updateControls(dt);
  particleT=(particleT+dt*0.16)%1;
  if(showFlow)edges.forEach(ed=>{ed.dots.forEach((d,i)=>{let u=(particleT+i/ed.N)%1;
    if(ed.kind==='loop'||ed.kind==='compensate')u=(1-u);const p=ed.curve.getPoint(u);d.position.copy(p);d.visible=true;});});
  else edges.forEach(ed=>ed.dots.forEach(d=>d.visible=false));
  // node grow-in + hover pulse
  nodeSprites.forEach(g=>{const tgt=(g===hovered)?1.16:1.0;
    const s=g.scale.x + ((tgt)-g.scale.x)*0.12;g.scale.setScalar(s);
    g.userData.halo.material.opacity=0.42+0.14*Math.sin(clock.elapsedTime*2+g.userData.t*30)+(g===hovered?0.25:0);});
  if(stars)stars.rotation.y+=dt*0.006;
  if(nebula)nebula.rotation.z+=dt*0.004;
  hover();
  renderer.render(scene,camera);
}
function hover(){
  raycaster.setFromCamera(pointer,camera);
  const cards=nodeSprites.map(g=>g.userData.card);
  const hit=raycaster.intersectObjects(cards,false)[0];
  const tip=document.getElementById('tip');
  if(hit){const g=nodeSprites.find(n=>n.userData.card===hit.object);hovered=g;
    const n=g.userData.node;tip.innerHTML='<div class="t">'+n.label+'</div>'+
      (n.sub?'<div class="a">'+n.sub+'</div>':'')+'<div class="ty">'+n.type+(n.flags&&n.flags.length?' · '+n.flags.join(' · '):'')+'</div>';
    tip.style.opacity=1;const v=g.position.clone().project(camera);
    tip.style.left=((v.x*0.5+0.5)*innerWidth)+'px';tip.style.top=((-v.y*0.5+0.5)*innerHeight)+'px';
    document.body.style.cursor='pointer';
  }else{hovered=null;tip.style.opacity=0;document.body.style.cursor='default';}
}

/* ---------- UI ---------- */
function buildMenu(){
  const list=document.getElementById('flowlist');const byFam={};
  DATA.order.forEach(id=>{const f=DATA.flows[id];(byFam[f.family]=byFam[f.family]||[]).push(f);});
  Object.keys(DATA.families).forEach(fk=>{if(!byFam[fk])return;const fam=DATA.families[fk];
    const h=document.createElement('div');h.className='fam';
    h.innerHTML='<span class="dot" style="background:'+fam.color+';box-shadow:0 0 8px '+fam.color+'"></span>'+fam.name;
    list.appendChild(h);
    byFam[fk].forEach(f=>{const b=document.createElement('button');b.className='flowbtn';b.dataset.id=f.id;
      b.innerHTML='<span class="code" style="color:'+fam.color+'">'+f.code+'</span><span>'+f.title+'</span>';
      b.onclick=()=>selectFlow(f.id);list.appendChild(b);});
  });
}
function buildLegend(){
  const L=document.getElementById('legend');
  const types=[['entry','Entry'],['classify','Classify'],['plan','Plan'],['agent','Agent'],['research','Research'],
    ['review','Review'],['gate','Human gate'],['tool','Tool'],['output','Output'],['done','Complete'],['fail','Fail'],['compensate','Compensate']];
  types.forEach(([t,l])=>{const d=document.createElement('div');d.className='item';
    d.innerHTML='<span class="sw" style="background:'+TYPECOL[t]+';box-shadow:0 0 7px '+TYPECOL[t]+'"></span>'+l;L.appendChild(d);});
  [['flow','flow'],['branch','branch'],['loop','loop'],['compensate','rollback']].forEach(([k,l])=>{
    const d=document.createElement('div');d.className='item';
    d.innerHTML='<span class="ln" style="border-color:'+EDGECOL[k]+'"></span>'+l;L.appendChild(d);});
}
function onResize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);}

document.getElementById('b-rotate').onclick=e=>{autoRotate=!autoRotate;e.target.classList.toggle('on',autoRotate);};
document.getElementById('b-flow').onclick=e=>{showFlow=!showFlow;e.target.classList.toggle('on',showFlow);};
document.getElementById('b-fit').onclick=()=>{const P={};DATA.flows[curId].nodes.forEach(n=>P[n.id]=pos(n));frame(P);};
document.getElementById('b-prev').onclick=()=>selectFlow(DATA.order[(curIndex-1+DATA.order.length)%DATA.order.length]);
document.getElementById('b-next').onclick=()=>selectFlow(DATA.order[(curIndex+1)%DATA.order.length]);
addEventListener('keydown',e=>{if(e.key==='ArrowRight')document.getElementById('b-next').click();
  if(e.key==='ArrowLeft')document.getElementById('b-prev').click();});
</script>
</body>
