; SYNAPSE — UE 5.6 local-native default with explicit optional delivery modes.
; Default maps point at the engine's built-in Entry map until the BP test
; map is authored in-editor (docs/testmap-setup.md). Replace both lines with
; /Game/Maps/L_GatewaySmoke after step 1 of that doc.

[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Engine/Maps/Entry.Entry
EditorStartupMap=/Engine/Maps/Templates/OpenWorld

[/Script/Engine.RendererSettings]
; PC flagship: Lumen + Nanite (master plan Decision 5). DX12 + SM6.
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.HardwareRayTracing=True
r.SkinCache.CompileShaders=True
r.RayTracing=True
r.GenerateMeshDistanceFields=True
r.Nanite=1
; Identity-preserving source defaults. Runtime/scalability tiers lower cost.
r.VirtualTextures=True
r.SupportSkyAtmosphereAffectsHeightFog=True
r.VolumetricFog=1
r.Shadow.Virtual.Enable=1
r.PathTracing=1
; Context loss and unsupported ray features fail visibly to the configured
; balanced/accessible path; no remote stream is auto-started from config.
r.GPUCrashDebugging=True

[/Script/Engine.Engine]
bUseFixedFrameRate=False

[/Script/Engine.StreamingSettings]
s.AsyncLoadingThreadEnabled=True
s.EventDrivenLoaderEnabled=True
s.UseBackgroundLevelStreaming=True

[/Script/OpenXRHMD.OpenXRHMDSettings]
; The platform-selected OpenXR runtime remains authoritative. Device-specific
; vendor runtimes are not hardcoded and XR is opt-in in DefaultGame.ini.
bIsFBFoveationEnabled=False

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6
