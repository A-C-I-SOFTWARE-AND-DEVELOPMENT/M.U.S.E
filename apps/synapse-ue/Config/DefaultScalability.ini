; Atlas Crown fidelity lowers cost, never identity. Standard Unreal groups are
; paired with explicit M.U.S.E. diagnostics consumed by runtime UI/tooling.

[Muse.AtlasFidelity.Cinema]
Tier=Cinema
StationSilhouette=1
SourceLod=source
TargetFrameRate=offline
PathTracing=1
NativeStereo=1
VolumetricLayers=4

[Muse.AtlasFidelity.Ultra]
Tier=Ultra
StationSilhouette=1
SourceLod=interactive
TargetFrameRate=60
Nanite=1
Lumen=1
RayFeatures=when-supported
VolumetricLayers=3

[Muse.AtlasFidelity.High]
Tier=High
StationSilhouette=1
SourceLod=interactive
TargetFrameRate=60
ReflectionSamples=reduced
ShadowSamples=reduced
VolumetricLayers=2

[Muse.AtlasFidelity.Balanced]
Tier=Balanced
StationSilhouette=1
SourceLod=interactive-hlod
TargetFrameRate=30-60
ReflectionMode=probes
VolumetricLayers=0
RendererFallback=Accessible2D

[Muse.AtlasFidelity.Accessible2D]
Tier=Accessible2D
StationSilhouette=1
Mount3D=0
ContinuousMotion=0
CachedImagery=1
AllOperationalControls=1

