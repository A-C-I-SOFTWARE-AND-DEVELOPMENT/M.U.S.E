<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="muse">
  <!-- Maskable variant: the same Singularity glyph, but the ring is pulled into
       the maskable safe zone (~62% of the canvas) and the background is a full
       void square — the platform applies the mask (circle / squircle / rounded),
       so we must NOT pre-round it. See docs/brand/muse-design-language.md §7. -->
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ae0ff"/>
      <stop offset="1" stop-color="#b388ff"/>
    </linearGradient>
    <radialGradient id="halo2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d4f2ff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#7ae0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="0.55" stop-color="#e6f7ff" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#e0f8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreHot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.62" stop-color="#f2fbff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#eafaff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="#050507"/>
  <circle cx="256" cy="256" r="94" fill="none" stroke="url(#ring)" stroke-width="15"
          stroke-dasharray="489 102" stroke-linecap="round" transform="rotate(-32 256 256)"/>
  <circle cx="256" cy="256" r="65" fill="url(#halo2)"/>
  <circle cx="256" cy="256" r="46" fill="url(#halo1)"/>
  <circle cx="256" cy="256" r="36" fill="url(#coreHot)"/>
  <circle cx="256" cy="256" r="29" fill="#ffffff"/>
</svg>
