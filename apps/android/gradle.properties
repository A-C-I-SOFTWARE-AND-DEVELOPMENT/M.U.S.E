org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache intentionally off: clean CI runs (no daemon, no warm
# cache) hit edge cases where the first-time store fails, and the local
# build doesn't benefit from it enough to justify the breakage.

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# ---------------------------------------------------------------------------
# Hermes gateway URL baked into the APK as BuildConfig.DEFAULT_GATEWAY_URL.
# This is the URL the app dials on first launch, before the user changes it
# in Settings → Edit connection. The app then persists whatever the user
# enters and ignores this value on subsequent launches.
#
# Resolution order (highest priority first):
#   1. -PhermesGatewayUrl=...   (gradle CLI / this property)
#   2. $HERMES_GATEWAY_URL      (env var)
#   3. $ANDROID_API_BASE_URL    (env var, alias)
#   4. debug fallback: http://10.0.2.2:8080 (Android emulator → host)
#   5. release fallback: "" — user must enter on the setup screen.
#
# Examples:
#   hermesGatewayUrl=https://hermes.example.com          # public HTTPS
#   hermesGatewayUrl=http://192.168.1.42:8080            # LAN IP (real phone)
#   hermesGatewayUrl=https://abc123.ngrok-free.app       # tunnel
#
# NEVER put gateway tokens or GitHub tokens in this file. Tokens stay
# server-side in ~/.hermes/.env or the gateway environment.
# hermesGatewayUrl=
