org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache intentionally off: clean CI runs (no daemon, no warm
# cache) hit edge cases where the first-time store fails, and the local
# build doesn't benefit from it enough to justify the breakage.

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# The orchestrator is local-only — no gateway URL, no API key, no
# bearer token to inject at build time. See apps/android/README.md
# "What the app explicitly does not do".
