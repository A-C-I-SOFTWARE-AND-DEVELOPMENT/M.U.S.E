<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="M.U.S.E.">
  <!-- M.U.S.E. "Singularity" mark: one white core in the void, a single spectral ring. -->
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ae0ff"/>
      <stop offset="1" stop-color="#b388ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#050507"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ring)" stroke-width="24"
          stroke-dasharray="780 162" stroke-linecap="round" transform="rotate(-32 256 256)"/>
  <circle cx="256" cy="256" r="118" fill="url(#glow)"/>
  <circle cx="256" cy="256" r="46" fill="#ffffff"/>
</svg>
