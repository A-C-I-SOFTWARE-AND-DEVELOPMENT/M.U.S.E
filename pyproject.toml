[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-agent"
version = "0.20.0"
description = "The self-improving AI agent — creates skills from experience, improves them during use, and runs anywhere"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Nous Research" }]
license = { text = "MIT" }
dependencies = [
  # Core — every direct dep is exact-pinned to ==X.Y.Z (no ranges).
  # Rationale: ranges allow PyPI to ship a fresh version of a transitive
  # at any time without a code review on our side. Exact pins mean the
  # only way a new package version reaches a user is via an intentional
  # update on our end (bump the pin in this file, regenerate uv.lock).
  # This was tightened on 2026-05-12 in response to the Mini Shai-Hulud
  # worm hitting mistralai 2.4.6 on PyPI; if that release had been
  # captured by `mistralai>=2.3.0,<3` rather than an exact pin, every
  # install in the hours before the quarantine would have pulled it.
  #
  # When updating: bump the version below AND regenerate uv.lock with
  # `uv lock` so the transitive resolution stays consistent. Don't
  # introduce ranges back without a written justification.
  #
  # Scope rule: only packages used by EVERY hermes session belong here.
  # Anything that's provider-specific (`anthropic`, `firecrawl-py`,
  # `exa-py`, `fal-client`, `edge-tts`, `parallel-web`) belongs in an
  # extra and gets lazy-installed via `tools/lazy_deps.py` when the
  # user picks that backend. Smaller `dependencies` = smaller blast
  # radius for the next supply-chain attack.
  "openai==2.24.0",
  "python-dotenv==1.2.2",
  "fire==0.7.1",
  "httpx[socks]==0.28.1",
  "rich==14.3.3",
  "tenacity==9.1.4",
  "pyyaml==6.0.3",
  "ruamel.yaml==0.18.17",
  "requests==2.33.0",  # CVE-2026-25645
  "jinja2==3.1.6",
  "pydantic==2.12.5",
  # Interactive CLI (prompt_toolkit is used directly by cli.py)
  "prompt_toolkit==3.0.52",
  # Cron scheduler (built-in feature — scheduled cron/interval jobs use croniter).
  "croniter==6.0.0",
  # Skills Hub (GitHub App JWT auth — optional, only needed for bot identity)
  "PyJWT[crypto]==2.13.0",  # security: PYSEC-2026-175/177/178/179 (was 2.12.1)
  # Windows has no IANA tzdata shipped with the OS, so Python's ``zoneinfo``
  # (PEP 615) raises ``ZoneInfoNotFoundError`` for every non-UTC timezone
  # out of the box.  ``tzdata`` ships the Olson database as a data package
  # Python resolves automatically.  No-op on Linux/macOS (which have
  # /usr/share/zoneinfo).  Credits: PR #13182 (@sprmn24).
  "tzdata==2025.3; sys_platform == 'win32'",
  # ``hermes_logging`` imports ConcurrentRotatingFileHandler unconditionally on
  # win32 (stdlib RotatingFileHandler cannot handle concurrent writers there,
  # so the gateway, TUI and CLI would corrupt each other's log rotation).
  # It was previously undeclared, so any dependency reinstall silently dropped
  # it and every entry point died with ModuleNotFoundError before reaching
  # main().  Keep this pinned alongside the other win32-only requirement.
  "concurrent-log-handler==0.9.29; sys_platform == 'win32'",
  # Cross-platform process / PID management.  `psutil` is the canonical
  # answer for "is this PID alive" and process-tree walking across Linux,
  # macOS and Windows.  It replaces POSIX-only idioms like `os.kill(pid, 0)`
  # (which is a silent killer on Windows — see CONTRIBUTING.md) and
  # `os.killpg` (which doesn't exist on Windows).  It is intentionally kept
  # OUT of base deps because psutil currently fails to build on Android/Termux;
  # desktop/server installs restore it via the `dev` extra (android-guarded).
]

[project.optional-dependencies]
# Native Anthropic provider — only needed when provider=anthropic (not via
# OpenRouter or other aggregators).
anthropic = ["anthropic==0.87.0"]
# Web search backends — each only loaded when the user picks it as their
# search provider (configured via `muse tools` or config.yaml).
exa = ["exa-py==2.10.2"]
firecrawl = ["firecrawl-py==4.17.0"]
parallel-web = ["parallel-web==0.4.2"]
# Image generation backends
fal = ["fal-client==0.13.1"]
# Edge TTS — default TTS provider but still optional (users can pick
# ElevenLabs / OpenAI / MiniMax instead).
edge-tts = ["edge-tts==7.2.7"]
modal = ["modal==1.3.4"]
daytona = ["daytona==0.155.0"]
vercel = ["vercel==0.5.7"]
hindsight = ["hindsight-client==0.6.1"]
# Optional local dense embeddings for holographic semantic recall. Kept out of
# [all] (lazy-installable via tools/lazy_deps.py "memory.embeddings_local"),
# matching the voice/honcho policy — heavy wheel-only deps resolve at first use.
embeddings = ["sentence-transformers==5.5.1", "numpy==2.4.3"]
# Optional DuckDB/Parquet analytics over the learning-dataset JSONL export.
analytics = ["duckdb==1.4.3"]
# AXIOM verification kernel deps (vendored at axiom/). z3-solver ships no
# aarch64 wheels (Termux), so it is marker-guarded; contracts.py degrades to
# syntax-only checking and labels attestations "contracts:degraded". The
# axiom_bridge event chain is stdlib-only and works without this extra.
axiom = [
  "blake3>=1.0",
  "pynacl>=1.5",
  "fsrs>=6.3.1,<7",
  "fastmcp>=3.0",
  "z3-solver>=4.13; platform_machine != 'aarch64'",
]
# NOTE: the Karpathy autoresearch engine (vendored at hermes_cli/jarvis_prime/
# research_fabric/autoresearch/vendor/, MIT) deliberately has NO extra here —
# its torch==2.9.1 pin would force a repo-wide torch downgrade (uv unifies
# versions across extras; sentence-transformers already resolves a newer
# torch). Like SIA, the engine runs in its OWN environment: `uv sync` inside a
# seeded $HERMES_HOME workspace against the VENDORED pyproject (which also
# carries the pytorch-cu128 index that optional-dependencies cannot express).
# See docs/integrations/autoresearch.md.
dev = ["debugpy==1.8.20", "pytest==9.0.3", "pytest-asyncio==1.3.0", "pytest-xdist==3.8.0", "pytest-split==0.11.0", "pytest-timeout==2.4.0", "mcp==1.28.1", "ty==0.0.48", "ruff==0.15.10", "psutil==7.2.2; sys_platform != \"android\""]
messaging = ["python-telegram-bot[webhooks]==22.6", "discord.py[voice]==2.7.1", "aiohttp==3.14.1", "brotlicffi==1.2.0.1", "slack-bolt==1.27.0", "slack-sdk==3.40.1", "qrcode==7.4.2"]
cron = []  # croniter is now a core dependency; this extra kept for back-compat
slack = ["slack-bolt==1.27.0", "slack-sdk==3.40.1", "aiohttp==3.14.1"]
matrix = ["mautrix[encryption]==0.21.0", "Markdown==3.10.2", "aiosqlite==0.22.1", "asyncpg==0.31.0", "aiohttp-socks==0.11.0"]
cli = ["simple-term-menu==1.6.6"]
tts-premium = ["elevenlabs==1.59.0"]
voice = [
  # Local STT pulls in wheel-only transitive deps (ctranslate2, onnxruntime),
  # so keep it out of the base install for source-build packagers like Homebrew.
  "faster-whisper==1.2.1",
  "sounddevice==0.5.5",
  "numpy==2.4.3",
]
pty = [
  "ptyprocess==0.7.0; sys_platform != 'win32'",
  "pywinpty==2.0.15; sys_platform == 'win32'",
]
honcho = ["honcho-ai==2.0.1"]
mcp = ["mcp==1.28.1"]
homeassistant = ["aiohttp==3.14.1"]
sms = ["aiohttp==3.14.1"]
# NOTE: SIA (Hexo Labs Self-Improving AI), used by the `sia` worker and the
# `/sia-self-improve` skill, is intentionally NOT a Hermes dependency. Like
# goose/codex/aider/claude-code it is an external CLI detected on PATH —
# install it in its own environment (`pip install 'sia-agent[claude]'`). Its
# pins (e.g. openhands→openai==2.8) conflict with Hermes' locked env, which is
# exactly why we shell out to it instead of vendoring it. See
# docs/integrations/sia-self-improvement.md.
# Computer use — macOS background desktop control via cua-driver (MCP stdio).
# The cua-driver binary itself is installed via `muse tools` post-setup
# (curl install script); this extra just pins the MCP client used to talk
# to it, which is already provided by the `mcp` extra.
computer-use = ["mcp==1.28.1"]
acp = ["agent-client-protocol==0.9.0"]
# mistral: extra REMOVED 2026-05-12 — `mistralai` PyPI project quarantined
# after malicious 2.4.6 release (Mini Shai-Hulud worm). Every version of
# `mistralai` returns 404 on PyPI right now, so any pin we'd write is
# unresolvable, which breaks `uv lock --check` in CI.
#
# To restore once PyPI un-quarantines:
#   1. Verify the new release is clean (read the changelog, check Socket
#      advisory page, confirm no malicious code review findings).
#   2. Add back: mistral = ["mistralai==<verified-version>"]
#   3. Re-enable Mistral in:
#        - tools/lazy_deps.py (LAZY_DEPS["tts.mistral"], LAZY_DEPS["stt.mistral"])
#        - hermes_cli/tools_config.py (un-hide from provider picker)
#        - hermes_cli/web_server.py (re-add to dashboard STT options)
#        - tools/transcription_tools.py / tools/tts_tool.py (drop disabled stubs)
#   4. Run `uv lock` to regenerate transitives.
#   5. Optionally re-add to [all] only after a few days of clean operation.
bedrock = ["boto3==1.42.89"]
azure-identity = ["azure-identity==1.25.3"]
termux = [
  # Baseline Android / Termux path for reliable fresh installs.
  "python-telegram-bot[webhooks]==22.6",
  "hermes-agent[cron]",
  "hermes-agent[cli]",
  "hermes-agent[pty]",
  "hermes-agent[mcp]",
  "hermes-agent[honcho]",
  "hermes-agent[acp]",
]
termux-all = [
  # Best-effort "install all" profile for Termux. Same policy as [all]:
  # only includes extras that aren't covered by `tools/lazy_deps.py`.
  # Backends like telegram/slack/dingtalk/feishu/honcho lazy-install at
  # first use, so they're no longer eager-installed here.
  "hermes-agent[termux]",
  "hermes-agent[google]",
  "hermes-agent[homeassistant]",
  "hermes-agent[sms]",
  "hermes-agent[web]",
]
dingtalk = ["dingtalk-stream==0.24.3", "alibabacloud-dingtalk==2.2.42", "qrcode==7.4.2"]
feishu = ["lark-oapi==1.5.3", "qrcode==7.4.2"]
google = [
  # Required by the google-workspace skill (Gmail, Calendar, Drive, Contacts,
  # Sheets, Docs).  Declared here so packagers (Nix, Homebrew) ship them with
  # the [all] extra and users don't hit runtime `pip install` paths that fail
  # in environments without pip (e.g. Nix-managed Python).
  "google-api-python-client==2.194.0",
  "google-auth-oauthlib==1.3.1",
  "google-auth-httplib2==0.3.1",
]
youtube = [
  # Required by skills/media/youtube-content and
  # optional-skills/productivity/memento-flashcards (youtube_quiz.py).
  # Without this declaration uv sync omits the package and both skills fail
  # at first invocation with ModuleNotFoundError (issue #22243).
  "youtube-transcript-api==1.2.4",
]
# `muse dashboard` (localhost SPA + API).  Not in core to keep the default install lean.
web = ["fastapi==0.133.1", "starlette==1.3.1", "uvicorn[standard]==0.41.0"]
all = [
  # Policy (2026-05-12): `[all]` includes only extras that genuinely
  # CAN'T be lazy-installed via `tools/lazy_deps.py` — i.e. things every
  # session can use, things needed before the agent loop is alive
  # (terminal/CLI), and skill deps that packagers (Nix, AUR, Homebrew)
  # need in the wheel. Anything an opt-in backend (provider, search,
  # TTS, image, memory, messaging platform, terminal sandbox) needs
  # MUST live exclusively in `LAZY_DEPS` and resolve at first use —
  # otherwise one quarantined PyPI release breaks every fresh install.
  #
  # Removed from [all] on 2026-05-12 (covered by lazy-install):
  #   anthropic, exa, firecrawl, parallel-web, fal, edge-tts,
  #   modal, daytona, vercel, messaging (telegram/discord/slack),
  #   matrix, slack, honcho, voice (faster-whisper),
  #   dingtalk, feishu, bedrock, tts-premium (elevenlabs)
  #
  # Why: the matrix extra in particular pulls `mautrix[encryption]`
  # which depends on `python-olm`. python-olm has Linux-only wheels and
  # no native build path on Windows or modern macOS. With matrix in
  # [all], `uv sync --locked` on Windows tried to build it from sdist
  # and failed on `make`. Lazy-install routes that build to first use,
  # where the user is expected to have a toolchain available.
  #
  # Removed from [all] on 2026-06-09: the [dev] extra (pytest, debugpy,
  # ruff, ty, pytest-*). It's development/test tooling, not a runtime
  # feature or a skill dep packagers ship — it never belonged in an
  # end-user [all]. Concretely, `ruff` and `ty` are Rust tools with no
  # Termux/Android wheels, so an [all] install on a phone built them
  # from source; `ty`'s sdist bundles the whole ruff monorepo
  # (thousands of parser snapshots) and exhausted device storage
  # ("No space left on device"). Developers install `.[all,dev]`
  # (the documented + CI path); CI already does exactly that.
  "hermes-agent[cron]",
  "hermes-agent[cli]",
  "hermes-agent[pty]",
  "hermes-agent[mcp]",
  "hermes-agent[homeassistant]",
  "hermes-agent[sms]",
  "hermes-agent[acp]",
  "hermes-agent[google]",
  "hermes-agent[web]",
  "hermes-agent[youtube]",
]

[project.scripts]
muse = "hermes_cli.main:main"
# Backward-compatibility alias for the pre-rename `hermes` command. Both names
# dispatch to the same CLI entry point; `muse` is canonical.
hermes = "hermes_cli.main:main"
muse-agent = "run_agent:main"
muse-acp = "acp_adapter.entry:main"

# ── Vercel: the public deployment serves Muse Omni (Singularity cockpit) ──
# The root `vercel.json` runs `scripts/deploy/build_cockpit_vercel.sh`, which
# puts `gateway/cockpit/static/cockpit.dc.html` at site root and the OpenCode
# chat shell (`web/musehq`) under `/chat/`, with Edge API functions under the
# repo-root `api/`. That is the commercial face of the product, so the FastAPI
# builder below is intentionally DISABLED: a live `[tool.vercel]` entry makes
# Vercel prefer its Python/FastAPI builder and serve `vercel_app.py`'s
# health-landing page at `/` instead of the cockpit (the exact symptom we are
# fixing).
#
# `vercel_app.py` is preserved (read-only, public-safe cloud health server) so
# this is fully reversible — to restore the FastAPI deployment, uncomment the
# two sections below and remove the `buildCommand`/`outputDirectory` from the
# root `vercel.json`.
#
# [tool.vercel]
# # Vercel's FastAPI builder scans the repo for a `FastAPI()` instance and, when
# # it finds more than one candidate (here: the localhost admin dashboard
# # `hermes_cli/web_server.py`, the SYNAPSE stub gateway, and a test module), it
# # refuses to guess and fails the build. Pin the entrypoint explicitly.
# #
# # We deliberately point at `vercel_app:app` — a dedicated, public-safe,
# # read-only cloud server (see vercel_app.py) — NOT `hermes_cli.web_server:app`.
# # That dashboard is a loopback-only ADMIN surface (config editing, env-var
# # reveal, ephemeral session tokens) and must never be served on a public URL.
# entrypoint = "vercel_app:app"
#
# [tool.vercel.scripts]
# # fastapi/starlette/uvicorn live ONLY in the optional `web` extra (lean-install
# # policy — see [project.optional-dependencies]). Vercel's FastAPI builder is
# # uv-based and runs a DEFAULT `uv sync`, which resolves the base deps + pydantic
# # but NOT the `web` extra — so `vercel_app.py` would import-fail at runtime with
# # `ModuleNotFoundError: fastapi` even though the build goes green (imports happen
# # at invocation, not build time). A root `requirements.txt` does not help: the
# # uv-based builder installs from pyproject/uv.lock, not requirements.txt.
# #
# # This `build` hook runs AFTER the default install and BEFORE deployment (per
# # Vercel's FastAPI docs), re-syncing the SAME builder venv WITH the `web` extra
# # so fastapi lands in the bundle. `--frozen` reuses the committed uv.lock as-is
# # (no re-lock / network) since we change no dependency versions here. This keeps
# # fastapi out of the lean core install while still making the public cloud
# # server actually runnable on Vercel.
# build = "uv sync --frozen --extra web"

[tool.uv]
# Security override (GHSA-mrfv-m5wm-5w6w / CVE-2025-69277): pynacl < 1.6.2
# bundles a libsodium with an incomplete disallowed-inputs list.
# discord.py (all releases <= 2.7.1) pins "PyNaCl<1.6,>=1.5.0" for its
# optional voice extra, so the patched 1.6.2 is unreachable without this
# override. Remove once discord.py relaxes its upper bound.
override-dependencies = [
  "pynacl>=1.6.2",
  # Security overrides for transitive dependencies flagged by Dependabot.
  # These are pulled in by other packages and can't be bumped via direct
  # pins without breaking the parent's version constraint. Remove each
  # override once the parent package updates its own constraint.
  "urllib3>=2.5.0",          # CVE-2025-50181/50182 — transitive (requests/httpx/openai)
  "cryptography>=45.0.0",    # GHSA — transitive (multiple providers)
  "tornado>=6.5.1",          # GHSA — transitive (faster-whisper/ipython/jupyter)
  "pyasn1>=0.6.1",           # GHSA — transitive (cryptography chain)
  "msgpack>=1.1.0",          # GHSA — transitive (mcp)
  "cbor2>=5.7.1",            # GHSA — transitive (fastmcp)
  "python-multipart>=0.0.18", # GHSA — transitive (fastapi/mcp)
]

# ---------------------------------------------------------------------------
# Production-build exclusions — the single source of truth.
#
# `recovered-agent-sources/` is the byte-preserved archival snapshot of the
# 2026-07-12 device-consolidation recovery. It is historical evidence, not
# live code, and it deliberately contains a broken prototype:
#
#   recovered-agent-sources/device-consolidation-2026-07-12/
#     working-tree-overlays/broken-delegate-prototype/tools/delegate_tool.py
#   line 970 -> IndentationError: expected an indented block after 'elif'
#               statement on line 968
#
# That file is the archive's only whole-tree compile failure, and being broken
# is exactly what the path name declares it to be.
#
# TWO requirements hold at the same time and neither may be dropped:
#   1. the tree is EXCLUDED from every production build artifact, and
#   2. the tree is RETAINED ON DISK as historical evidence.
# Deleting or repairing the prototype to "fix the build" destroys the evidence
# and is the wrong repair. Excluding it is the right one.
#
# The mirrors of this table are:
#   * MANIFEST.in                              -> `prune recovered-agent-sources`
#   * [tool.setuptools.packages.find].exclude  -> wheel/sdist package discovery
#   * [tool.ruff].extend-exclude               -> lint
#   * [tool.ty.src].exclude                    -> typecheck
# `tests/characterization/test_build_exclusions.py` enforces that they all
# agree with this table, that the production file set compiles clean, and that
# the excluded evidence is still on disk.
[tool.muse.production-build]
exclude = ["recovered-agent-sources"]
retained-evidence = [
  "recovered-agent-sources/device-consolidation-2026-07-12/working-tree-overlays/broken-delegate-prototype/tools/delegate_tool.py",
]

[tool.setuptools]
py-modules = ["run_agent", "model_tools", "toolsets", "batch_runner", "trajectory_compressor", "toolset_distributions", "cli", "hermes_bootstrap", "hermes_constants", "hermes_state", "hermes_time", "hermes_logging", "utils"]

[tool.setuptools.package-data]
hermes_cli = ["web_dist/**/*", "tui_dist/**/*", "scripts/install.sh", "scripts/install.ps1"]
gateway = ["assets/**/*"]
"gateway.cockpit" = ["static/**/*"]
plugins = [
  "*/dashboard/manifest.json",
  "*/dashboard/dist/*",
  "*/dashboard/dist/**/*",
]

[tool.setuptools.packages.find]
include = ["agent", "agent.*", "tools", "tools.*", "hermes_cli", "gateway", "gateway.*", "tui_gateway", "tui_gateway.*", "cron", "acp_adapter", "plugins", "plugins.*", "providers", "providers.*", "second_brain", "second_brain.*"]
# Mirrors [tool.muse.production-build].exclude. The include allowlist above
# already happens to keep the archive out, but that is a side effect of the
# allowlist rather than a stated rule — one added `"*"` entry would silently
# pull 209 archived directories (including a nested `hermes_cli`) back into
# package discovery. This exclude states the rule directly, and is checked by
# tests/characterization/test_build_exclusions.py.
exclude = ["recovered-agent-sources", "recovered-agent-sources.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring external services (API keys, Modal, etc.)",
    "real_concurrent_gate: opt out of the autouse stub that disables _detect_concurrent_hermes_instances",
    "ssh: marks tests requiring a reachable SSH server",
]
# pytest-timeout: per-test 30s hard cap.
# Discovered May 2026: the suite reliably hangs at ~96% on full runs even
# though every individual test completes in <30s. Root cause is leaked
# threads / atexit handlers accumulating across thousands of tests until
# something deadlocks at session teardown. The per-test timeout breaks the
# deadlock — the suite then completes cleanly. The 30s cap is large enough
# that no legitimate test trips it; if a test exceeds it that's a real bug
# worth surfacing as a Timeout failure.
#
# The timeout method is intentionally NOT pinned: pytest-timeout auto-selects
# `signal` where SIGALRM exists (Linux/macOS/CI — interrupts the test thread
# for a clean Timeout failure) and `thread` on Windows. Pinning
# `--timeout-method=signal` crashed every xdist worker on Windows with
# `AttributeError: module 'signal' has no attribute 'SIGALRM'`.
addopts = "-m 'not integration' -n auto --timeout=30"

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
# Vendored byte-identical upstream payloads are data, not first-party code.
# recovered-agent-sources/ is the archival snapshot (see
# [tool.muse.production-build]); it contains a file that does not parse, and
# typechecking archived evidence is not a goal.
exclude = [
  "hermes_cli/jarvis_prime/research_fabric/autoresearch/vendor",
  "hermes_cli/jarvis_prime/research_fabric/llm_jepa/vendor",
  "recovered-agent-sources",
]

[tool.ty.rules]
unknown-argument = "warn"
redundant-cast = "ignore"

[tool.ruff]
preview = true  # required for PLW1514 (unspecified-encoding) — preview rule
# Vendored / clean-room do-not-edit payloads are never linted (do-not-edit rule;
# see the sibling VENDOR.md files under research_fabric/*/vendor).
# recovered-agent-sources/ is the byte-preserved archival snapshot of the
# 2026-07-12 device-consolidation recovery (historical evidence, not live
# code) — including an intentionally broken prototype; never linted.
extend-exclude = [
  "hermes_cli/jarvis_prime/research_fabric/autoresearch/vendor",
  "hermes_cli/jarvis_prime/research_fabric/llm_jepa/vendor",
  "recovered-agent-sources",
]

[tool.ruff.lint]
# All other lints are intentionally disabled (see comment history on this
# file) while we wrangle typechecks — but PLW1514 is too load-bearing to
# keep off.  Bare open()/read_text()/write_text() in text mode defaults to
# the system locale encoding on Windows (cp1252 on US-locale installs),
# which silently corrupts any non-ASCII file content.  We had three
# separate Windows sandbox regressions in one debug session before
# adding the explicit encoding.  This rule keeps new code honest.
select = ["PLW1514"]

[tool.ruff.lint.per-file-ignores]
# Tests can intentionally exercise locale-encoding edge cases.
"tests/**" = ["PLW1514"]
# Skills and plugins are partially user-authored — their own conventions.
"skills/**" = ["PLW1514"]
"optional-skills/**" = ["PLW1514"]
"plugins/**" = ["PLW1514"]
