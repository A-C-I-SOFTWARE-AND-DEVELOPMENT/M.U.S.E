# Maps Azure Key Vault secrets into a Kubernetes Secret, mounted into the
# worker pods by the CSI Secrets Store driver (the azure-keyvault-secrets-provider
# AKS add-on enabled in the guide).
#
# Honors the repo rule: no secrets in code; keys live in env. Nothing here is a
# secret value — only references to Key Vault entries you created with
# `az keyvault secret set`.
#
# Fill in BEFORE applying:
#   <KEYVAULT>   - your Key Vault name (e.g. muse-fleet-kv)
#   <TENANT_ID>  - Azure AD tenant ID  (az account show --query tenantId -o tsv)
#   <CLIENT_ID>  - the workload-identity / managed-identity client ID with
#                  'get' on the vault's secrets
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: muse-keyvault
  namespace: muse
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "<CLIENT_ID>"
    keyvaultName: "<KEYVAULT>"
    tenantId: "<TENANT_ID>"
    objects: |
      array:
        - |
          objectName: REDIS-URL
          objectType: secret
        - |
          objectName: REDIS-PASSWORD
          objectType: secret
        - |
          objectName: DATABASE-URL
          objectType: secret
        - |
          objectName: ANTHROPIC-API-KEY
          objectType: secret
        - |
          objectName: OPENROUTER-API-KEY
          objectType: secret
  # Project the fetched Key Vault entries into a real K8s Secret so they can be
  # consumed as env vars via secretKeyRef in deployment.yaml.
  secretObjects:
    - secretName: muse-secrets
      type: Opaque
      data:
        - objectName: REDIS-URL
          key: REDIS_URL
        - objectName: REDIS-PASSWORD
          key: REDIS_PASSWORD
        - objectName: DATABASE-URL
          key: DATABASE_URL
        - objectName: ANTHROPIC-API-KEY
          key: ANTHROPIC_API_KEY
        - objectName: OPENROUTER-API-KEY
          key: OPENROUTER_API_KEY
