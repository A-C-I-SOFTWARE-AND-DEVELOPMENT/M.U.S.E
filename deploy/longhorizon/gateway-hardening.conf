# M.U.S.E. long-horizon hardening drop-in for the gateway service.
#
# Installed by scripts/vps-harden-longhorizon.sh as a systemd *drop-in*:
#   system scope:  /etc/systemd/system/hermes-gateway.service.d/10-longhorizon.conf
#   user   scope:  ~/.config/systemd/user/hermes-gateway.service.d/10-longhorizon.conf
#
# It does NOT replace the unit the gateway generates (`muse gateway install`);
# it only *adds* restart resilience for 24/7 unattended operation. To revert,
# delete the drop-in and run `systemctl daemon-reload`.

[Unit]
# Never give up restarting. systemd's default start-rate limiter parks a unit
# in `failed` after a few quick restarts; over a multi-week horizon that means
# one bad night can leave the agent dead until you happen to notice. Disabling
# the limiter makes transient crashes always self-heal — the watchdog timer is
# the slower backstop.
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=15
# Long-running agentic loops accumulate state; under memory pressure prefer to
# let the OOM killer reap something else first. Deprioritized, not unkillable.
OOMScoreAdjust=-200
MemoryAccounting=yes
# Give in-flight work a chance to flush on stop/restart before SIGKILL.
TimeoutStopSec=30
