# M.U.S.E. log rotation — keeps ~/.hermes/logs from filling the disk over a
# long-horizon 24/7 run. Installed to /etc/logrotate.d/muse-hermes.
#
# copytruncate is required: the gateway holds its log files open, so we truncate
# in place rather than renaming out from under the running process.
#
# __PLACEHOLDERS__ substituted by scripts/vps-harden-longhorizon.sh:
#   __HERMES_HOME__  data dir (logs live under <home>/logs)
#   __RUN_USER__     OS user that owns the logs

__HERMES_HOME__/logs/*.log {
    weekly
    rotate 8
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    su __RUN_USER__ __RUN_USER__
}
