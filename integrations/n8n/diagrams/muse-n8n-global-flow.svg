<text x="398.0" y="156" fill="#93a1c9" font-size="11.5">Atlas /chat · Neural Conversation (Crown)</text>
<rect x="380.0" y="196" width="360" height="52" rx="12" fill="#121a2f" stroke="#37d0d6" stroke-width="1.5"/>
<rect x="380.0" y="196" width="5" height="52" rx="2" fill="#37d0d6"/>
