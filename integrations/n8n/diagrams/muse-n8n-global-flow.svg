<text x="938" y="196" fill="#93a1c9" font-size="11.5">external: Zapier · Make · n8n</text>
<rect x="920" y="242" width="250" height="58" rx="12" fill="#0f1730" stroke="#f4c95d" stroke-width="1.5"/>
