<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1400" font-family="Segoe UI, Inter, system-ui, sans-serif" role="img" aria-labelledby="ttl dsc">
<title id="ttl">MUSE × n8n — global end-to-end pipeline</title>
<desc id="dsc">A chat message enters at the Atlas Neural Conversation and flows through perceive, classify, decide, the AXIOM verification gate, the owner gate, delegation to the n8n connector layer, a hash-chained ledger append, and back out as speech. Includes the inbound n8n to MUSE direction and the five Atlas decks.</desc>
<rect x="0" y="0" width="1200" height="1400" fill="#0b1020"/>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37d0d6"/></marker>
<marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f4c95d"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b6b"/></marker>
</defs>
<text x="40" y="46" fill="#e6ecff" font-size="24" font-weight="700">MUSE × n8n — Global End-to-End Pipeline</text>
<text x="40" y="70" fill="#93a1c9" font-size="13">chat AI agent → Atlas → AXIOM gate → owner gate → delegate → n8n connectors → ledger → speak</text>
<text x="41" y="70" fill="#93a1c9" font-size="11" text-anchor="start" font-weight="400"></text>
<rect x="770" y="30" width="392" height="46" rx="10" fill="#0f1730" stroke="#2b3a5c"/>
<text x="786" y="50" fill="#f4c95d" font-size="12" font-weight="700">INVARIANT</text>
<text x="786" y="67" fill="#93a1c9" font-size="11.5">Intelligence proposes; the verifier disposes. n8n executes,</text>
<text x="864" y="50" fill="#93a1c9" font-size="11.5">— the AXIOM gate stays in MUSE.</text>
<text x="40" y="110" fill="#37d0d6" font-size="13" font-weight="700">ATLAS DECKS</text>
<rect x="40" y="128" width="210" height="52" rx="9" fill="#0f1730" stroke="#f4c95d" stroke-width="1.2"/>
<text x="52" y="149" fill="#e6ecff" font-size="12.5" font-weight="600">▲ Crown</text>
<text x="52" y="167" fill="#93a1c9" font-size="10.5">command · gate · ledger · speak</text>
<rect x="40" y="190" width="210" height="52" rx="9" fill="#0f1730" stroke="#37d0d6" stroke-width="1.2"/>
<text x="52" y="211" fill="#e6ecff" font-size="12.5" font-weight="600">✦ Flight</text>
<text x="52" y="229" fill="#93a1c9" font-size="10.5">agents · fleets · delegate_to</text>
<rect x="40" y="252" width="210" height="52" rx="9" fill="#0f1730" stroke="#37d0d6" stroke-width="1.2"/>
<text x="52" y="273" fill="#e6ecff" font-size="12.5" font-weight="600">⬢ Foundry</text>
<text x="52" y="291" fill="#93a1c9" font-size="10.5">source · release gate · cinema</text>
<rect x="40" y="314" width="210" height="52" rx="9" fill="#0f1730" stroke="#37d0d6" stroke-width="1.2"/>
<text x="52" y="335" fill="#e6ecff" font-size="12.5" font-weight="600">◆ Observatory</text>
<text x="52" y="353" fill="#93a1c9" font-size="10.5">memory · evidence · models</text>
<rect x="40" y="376" width="210" height="52" rx="9" fill="#0f1730" stroke="#f4c95d" stroke-width="1.2"/>
<text x="52" y="397" fill="#e6ecff" font-size="12.5" font-weight="600">⬟ Embassy</text>
<text x="52" y="415" fill="#93a1c9" font-size="10.5">share · post_publicly (gated)</text>
