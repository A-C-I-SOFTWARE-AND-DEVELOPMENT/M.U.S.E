<rect x="380.0" y="1062" width="5" height="66" rx="2" fill="#f4c95d"/>
<text x="398.0" y="1088" fill="#e6ecff" font-size="15" font-weight="600">8 · LEDGER append (host-side)</text>
<text x="398.0" y="1108" fill="#93a1c9" font-size="11.5">GuardrailLedger.append(kind,subject,payload)</text>
<text x="398.0" y="1124" fill="#93a1c9" font-size="11.5">$HERMES_HOME/jarvis_prime/guardrail_ledger.jsonl — sha256 hash chain</text>
