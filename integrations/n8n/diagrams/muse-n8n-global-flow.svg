<text x="398.0" y="604" fill="#93a1c9" font-size="11.5">planning·build·review·test·security·release·owner·rollback</text>
<text x="398.0" y="620" fill="#93a1c9" font-size="11.5">source of truth: GET /v1/cockpit/axiom → chain_valid</text>
