<text x="398.0" y="308" fill="#e6ecff" font-size="15" font-weight="600">3 · TURN → POST /v1/jarvis/chat</text>
<text x="398.0" y="328" fill="#93a1c9" font-size="11.5">perceive · classify · decide · gate · speak</text>
<text x="398.0" y="344" fill="#93a1c9" font-size="11.5">cockpit :8765 (host.docker.internal)</text>
