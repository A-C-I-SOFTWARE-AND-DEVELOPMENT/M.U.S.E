<text x="58" y="1282" fill="#e6ecff" font-size="13" font-weight="700">Two hash-chained ledgers + owner gate</text>
<text x="58" y="1304" fill="#93a1c9" font-size="11.5">AXIOM event chain — $HERMES_HOME/axiom/chain.jsonl (perceive→gate events, chain_valid).   GuardrailLedger — $HERMES_HOME/jarvis_prime/guardrail_ledger.jsonl (every delegation attempt).</text>
<text x="58" y="1324" fill="#93a1c9" font-size="11.5">Owner gate (owner_auth.py): exact phrase “Yes, with authorization.” • 16 OWNER_GATED_ACTIONS (spend, post_publicly, oauth, deploy, package_publish, modify_secrets, …).</text>
