<text x="655" y="660" fill="#ff6b6b" font-size="11" text-anchor="start" font-weight="700">fail</text>
<polygon points="560,748.0 650.0,788 560,828.0 470.0,788" fill="#121a2f" stroke="#f4c95d" stroke-width="1.5"/>
<text x="560" y="792" fill="#e6ecff" font-size="12.5" font-weight="600" text-anchor="middle">owner gate?</text>
