# CodeQL configuration for hermes-agent
# https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/customizing-your-advanced-setup-for-code-scanning

name: "Hermes Agent CodeQL Config"

# Query filters to exclude known false positives
query-filters:
  # The 'hermes skills view' and 'hermes skills export' CLI commands intentionally
  # display skill content to users. CodeQL flags this as "clear-text logging of
  # sensitive information" because skill_view() reads files, but SKILL.md files
  # are documentation/playbooks, not secrets. Exclude this query from analysis.
  - exclude:
      id: py/clear-text-logging-sensitive-data
