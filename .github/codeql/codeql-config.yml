# CodeQL configuration for hermes-agent
# https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/customizing-your-advanced-setup-for-code-scanning

name: "Hermes Agent CodeQL Config"

# Vendored byte-identical upstream payloads are DATA, not first-party code —
# they are sha256-pinned (do-not-edit; CI-enforced by
# tests/jarvis_prime/test_autoresearch_vendor_integrity.py) and any "fix"
# applied to them breaks vendor integrity. Keep CodeQL out of them.
paths-ignore:
  - hermes_cli/jarvis_prime/research_fabric/autoresearch/vendor
  # The standalone cockpit "studio" page is a design-canvas (dc-runtime) build:
  # `studio-support.js` is a GENERATED runtime bundle ("GENERATED from
  # dc-runtime/src/*.ts — do not edit") and the studio/atlas HTML are
  # design-canvas exports. Their `new Function`/`innerHTML`/`DOMParser` usage is
  # inherent template-rendering machinery that only ever evaluates the page's own
  # authored, static design — no untrusted input reaches those sinks — so the
  # high-severity DOM-XSS/code-injection alerts are false positives. Like the
  # vendored payloads above, these are DATA/generated artifacts, not first-party
  # hand-written code; keep CodeQL out of them.
  - gateway/cockpit/static/studio-support.js
  - gateway/cockpit/static/studio.html
  - gateway/cockpit/static/atlas

# Query filters to exclude known false positives
query-filters:
  # The 'hermes skills view' and 'hermes skills export' CLI commands intentionally
  # display skill content to users. CodeQL flags this as "clear-text logging of
  # sensitive information" because skill_view() reads files, but SKILL.md files
  # are documentation/playbooks, not secrets. Exclude this query from analysis.
  - exclude:
      id: py/clear-text-logging-sensitive-data
