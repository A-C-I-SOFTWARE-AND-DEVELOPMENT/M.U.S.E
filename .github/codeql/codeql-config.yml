# CodeQL configuration for hermes-agent
#
# Honored by GitHub's CodeQL default setup when present at this path
# (.github/codeql/codeql-config.yml).
#
# Suppression policy is documented per-rule in
# docs/security/codeql-suppressions.md. Every entry below MUST link to
# an audit row in that file. Do not add a suppression without the audit.

name: hermes-agent CodeQL config

queries:
  # Keep the full GitHub-maintained security-and-quality suite active
  # for every language. Only individual queries are suppressed below.
  - uses: security-and-quality

query-filters:
  # py/clear-text-logging-sensitive-data
  #
  # Audited 2026-05-26 against every alert raised on PR #109 (15 alerts
  # in 8 files). All 15 are false positives: each call site either
  # emits a length-only summary via agent.redact.safe_log_summary() or
  # a strict whitelist-validated identifier via
  # agent.redact.safe_audit_identifier(). The runtime sanitizers
  # rebuild their output via `re.sub` against a bounded char class, so
  # high-entropy credential bytes cannot survive the round-trip — they
  # are replaced with "<redacted>". Identifier-shaped values (env-var
  # names, skill names, session ids, chat ids) pass through unchanged.
  #
  # CodeQL's TaintTracking for this query recognizes only
  # `ConstCompareBarrier` as a sanitizer (per
  # semmle/python/dataflow/new/BarrierGuards.qll); user-defined
  # validators are not modelled as barriers, so the alerts cannot be
  # cleared at the source level. Full audit + per-site reasoning at:
  #   docs/security/codeql-suppressions.md
  - exclude:
      id: py/clear-text-logging-sensitive-data
