# CodeQL configuration for hermes-agent
# https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/customizing-your-advanced-setup-for-code-scanning

name: "Hermes Agent CodeQL Config"

# Paths to exclude from analysis
paths-ignore:
  # Test files don't need security scanning
  - tests/**
  - "**/test_*.py"

# Query filters to exclude known false positives
query-filters:
  # Exclude clear-text-logging warnings from CLI commands that intentionally
  # display content to users. The 'hermes skills view' and 'hermes skills export'
  # commands exist specifically to show skill content - this is not logging.
  - exclude:
      id: py/clear-text-logging-sensitive-data
      # Only exclude from the skills CLI module
      paths:
        - hermes_cli/skills_cmd.py
