name: Deploy Site

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'skills/**'
      - 'optional-skills/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

# Least privilege: only the docs job writes (it pushes the built site to the
# gh-pages branch, which is how this repo's GitHub Pages is served). The Vercel
# job just curls a deploy hook and needs no write scope.
permissions:
  contents: read

# Shared with nexus-pages.yml: both publish to the gh-pages branch, so they must
# not run concurrently (each clones→edits its own subtree→pushes). The retry
# loop in the publish step is the safety net for any residual race.
concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  deploy-vercel:
    if: github.event_name == 'release' && github.repository == 'A-C-I-SOFTWARE-AND-DEVELOPMENT/M.U.S.E'
    runs-on: ubuntu-latest
    steps:
      # Skips cleanly when no deploy hook is configured for this repo —
      # previously this job ran unguarded on every release and curl'd an
      # empty URL when the secret was absent. The check lives in the shell
      # (not a step `if:`) because the `secrets` context is not available in
      # `if:` expressions — referencing it there invalidates the whole
      # workflow file ("Unrecognized named-value: 'secrets'").
      - name: Trigger Vercel Deploy
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "No VERCEL_DEPLOY_HOOK secret configured; skipping."
            exit 0
          fi
          curl -X POST "$VERCEL_DEPLOY_HOOK"

  deploy-docs:
    if: github.repository == 'A-C-I-SOFTWARE-AND-DEVELOPMENT/M.U.S.E'
    runs-on: ubuntu-latest
    # Publishes to the gh-pages branch (this repo's Pages source), so it needs
    # write access to repo contents. No `environment: github-pages` block: that
    # gate enforced a deploy-branch policy that rejected the Actions-artifact
    # path from main ("Deployments are only allowed from gh-pages").
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.11'

      - name: Install PyYAML for skill extraction
        run: pip install pyyaml==6.0.2 httpx==0.28.1

      - name: Extract skill metadata for dashboard
        run: python3 website/scripts/extract-skills.py

      - name: Regenerate per-skill docs pages + catalogs
        run: python3 website/scripts/generate-skill-docs.py

      - name: Build skills index (if not already present)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f website/static/api/skills-index.json ]; then
            python3 scripts/build_skills_index.py || echo "Skills index build failed (non-fatal)"
          fi

      - name: Install dependencies
        run: npm ci
        working-directory: website

      - name: Build Docusaurus
        run: npm run build
        working-directory: website

      - name: Stage deployment
        run: |
          mkdir -p _site/docs
          cp -r website/build/* _site/docs/
          # .nojekyll disables GitHub Pages' Jekyll pass, which would otherwise
          # strip Docusaurus's underscore-prefixed asset dirs on the branch
          # source. The `cp * ` glob above skips dotfiles, so add it explicitly.
          touch _site/.nojekyll
          # llms.txt / llms-full.txt are also published at the site root
          # (https://a-c-i-software-and-development.github.io/muse/llms.txt) because some
          # agents and IDE plugins probe the classic root-level path rather
          # than /docs/llms.txt. Same file, two URLs, one source of truth.
          if [ -f website/build/llms.txt ]; then
            cp website/build/llms.txt _site/llms.txt
          fi
          if [ -f website/build/llms-full.txt ]; then
            cp website/build/llms-full.txt _site/llms-full.txt
          fi

      # Publish the docs into the gh-pages /docs/ subtree WITHOUT disturbing the
      # rest of the branch. gh-pages is CO-OWNED: nexus-pages.yml publishes the
      # NEXUS PWA (+ /cockpit, /atlas, /observatory) at the root. An orphan
      # force-push here would wipe the live NEXUS site — so instead we clone the
      # existing branch, replace only docs/ (+ the root llms*.txt the docs emit),
      # and push, retrying if a concurrent NEXUS deploy raced us to the branch.
      - name: Publish docs to gh-pages/docs (preserve NEXUS)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          SRC="$PWD/_site"
          publish() {
            WT="$(mktemp -d)"
            if ! git clone -q --depth 1 -b gh-pages "$REMOTE" "$WT" 2>/dev/null; then
              rm -rf "$WT"; mkdir -p "$WT"; git -C "$WT" init -q -b gh-pages
            fi
            # Replace ONLY the docs-owned paths; leave NEXUS's root files intact.
            # The root llms*.txt are docs-owned too: delete before the conditional
            # copies so a build that stops emitting them doesn't leave stale
            # agent-facing docs served forever (llms generation is non-fatal in
            # website/scripts/prebuild.mjs, and nexus-pages.yml preserves these).
            rm -rf "$WT/docs"; mkdir -p "$WT/docs"; cp -a "$SRC/docs/." "$WT/docs/"
            rm -f "$WT/llms.txt" "$WT/llms-full.txt"
            [ -f "$SRC/llms.txt" ] && cp "$SRC/llms.txt" "$WT/llms.txt" || true
            [ -f "$SRC/llms-full.txt" ] && cp "$SRC/llms-full.txt" "$WT/llms-full.txt" || true
            touch "$WT/.nojekyll"
            git -C "$WT" config user.name  "github-actions[bot]"
            git -C "$WT" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$WT" add -A
            if git -C "$WT" diff --cached --quiet; then
              echo "docs unchanged; nothing to publish"; rm -rf "$WT"; return 0
            fi
            git -C "$WT" commit -q -m "Deploy docs from ${GITHUB_SHA}"
            if git -C "$WT" push "$REMOTE" HEAD:gh-pages 2>/dev/null; then
              rm -rf "$WT"; return 0
            fi
            rm -rf "$WT"; return 1
          }
          for attempt in 1 2 3 4 5; do
            if publish; then echo "published docs (attempt $attempt)"; exit 0; fi
            echo "gh-pages push race on attempt $attempt; retrying"; sleep "$((attempt * 3))"
          done
          echo "failed to publish docs after 5 attempts"; exit 1
