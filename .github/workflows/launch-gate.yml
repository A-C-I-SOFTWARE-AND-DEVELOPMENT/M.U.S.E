name: LaunchGate

# Aggregator status check. The downstream workflows do the real work
# (Android build / Lint / MUSE unit / Tests / Orchestration tests
# / ruff enforcement / supply-chain audit). LaunchGate just rolls them
# up into a single check that branch protection can require, so the
# operator can enable GitHub auto-merge with one tick rather than
# hand-mapping seven CI columns.
#
# On pull_request events it ALSO prints an advisory red/green/pending
# rollup of the required checks (see the "Advisory rollup" step) to the
# job summary, so an operator can see the whole matrix at a glance. The
# rollup is informational only — it does NOT hard-fail on pending, to
# avoid racing the other in-flight checks. Branch protection remains the
# actual blocker, per docs/launch/AUTOMATED_MERGE_POLICY.md.
#
# Hard rules pinned by docs/launch/AUTOMATED_MERGE_POLICY.md:
#   - No bypass of branch protection.
#   - No merging on red CI.
#   - No skipping of the runtime owner-gate (spend, deploy, credentials,
#     etc.) — that is enforced at runtime via OwnerAuth and is out of
#     scope for this workflow.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  statuses: read
  pull-requests: read

concurrency:
  group: launch-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aggregate:
    name: LaunchGate aggregate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 1

      - name: Note
        run: |
          echo "LaunchGate is the aggregator status check required by branch protection."
          echo "It passes when every downstream required check has reported success on this commit."
          echo "If any downstream check is failing, cancelled, or pending, this job stays pending"
          echo "and auto-merge does not fire."
          echo
          echo "Required downstream checks (must all be in branch-protection's required list):"
          echo "  - Build debug APK            (android-build.yml)"
          echo "  - Lint                       (android-build.yml)"
          echo "  - Android JVM unit (testDebugUnitTest)  (jarvis-prime-unit.yml)"
          echo "  - Python unit (MUSE + redact + orchestrator)  (jarvis-prime-unit.yml)"
          echo "  - ruff enforcement (blocking) (lint.yml)"
          echo "  - Tests                      (tests.yml)"
          echo "  - Orchestration tests        (orchestration-tests.yml)"
          echo "  - Scan PR for critical supply chain risks  (supply-chain-audit.yml)"
          echo
          echo "If you are an operator: see docs/launch/AUTO_MERGE_RUNBOOK.md for"
          echo "the per-PR auto-merge enable steps. Never bypass branch protection."

      - name: Confirm doc + policy presence
        run: |
          set -e
          test -f docs/launch/AUTOMATED_MERGE_POLICY.md || { echo "missing AUTOMATED_MERGE_POLICY.md"; exit 1; }
          test -f docs/launch/AUTO_MERGE_RUNBOOK.md     || { echo "missing AUTO_MERGE_RUNBOOK.md"; exit 1; }
          test -f docs/launch/LAUNCH_GATE_CHECKLIST.md  || { echo "missing LAUNCH_GATE_CHECKLIST.md"; exit 1; }
          echo "All LaunchGate policy + runbook + checklist docs present."

      - name: Confirm runtime owner gates untouched in this PR
        run: |
          set -e
          # Audit hatch: if this PR drops AUTHORIZATION_PHRASE / OwnerAuth, fail loud.
          grep -q "AUTHORIZATION_PHRASE" hermes_cli/jarvis_prime/owner_auth.py \
            || { echo "AUTHORIZATION_PHRASE was removed from owner_auth.py — runtime gate violated"; exit 1; }
          grep -q "class OwnerAuth" hermes_cli/jarvis_prime/owner_auth.py \
            || { echo "OwnerAuth class was removed from owner_auth.py — runtime gate violated"; exit 1; }
          echo "Runtime owner-gate constants present."

      - name: Advisory rollup of required checks
        # NOTE: `release-gate-strict` below is deliberately NOT in this
        # REQUIRED list and not in this job's `needs`. It is a new adoption
        # of WC-2's HERMES_RELEASE_GATE_STRICT mode (see
        # docs/launch/followups/wc-2-release-gate-tooling.md) and runs as a
        # standalone, non-required sibling check until the operator promotes
        # it into branch protection.
        if: github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            // The required checks branch protection should gate on. These
            // names must match the downstream job `name:` strings exactly.
            const REQUIRED = [
              'Build debug APK',
              'Lint',
              'Android JVM unit (testDebugUnitTest)',
              'Python unit (MUSE + redact + orchestrator)',
              'ruff enforcement (blocking)',
              'Orchestration unit tests',
            ];
            const sha = context.payload.pull_request.head.sha;
            const { data } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
              per_page: 100,
            });
            // Latest run per check name (skip LaunchGate's own check).
            const latest = new Map();
            for (const run of data.check_runs) {
              if (run.name.startsWith('LaunchGate')) continue;
              const prev = latest.get(run.name);
              if (!prev || new Date(run.started_at) > new Date(prev.started_at)) {
                latest.set(run.name, run);
              }
            }
            const icon = (s, c) => {
              if (s !== 'completed') return '⏳ pending';
              if (c === 'success') return '✅ success';
              if (c === 'neutral' || c === 'skipped') return '➖ ' + c;
              return '❌ ' + (c || 'failure');
            };
            let body = '### LaunchGate advisory rollup\n\n';
            body += `Head SHA: \`${sha}\`\n\n`;
            body += '| Required check | Status |\n|---|---|\n';
            let red = 0, pending = 0;
            for (const name of REQUIRED) {
              const run = latest.get(name);
              if (!run) { body += `| ${name} | ⚪ not reported yet |\n`; pending++; continue; }
              const cell = icon(run.status, run.conclusion);
              if (cell.startsWith('❌')) red++;
              if (cell.startsWith('⏳')) pending++;
              body += `| ${name} | ${cell} |\n`;
            }
            body += `\n_${red} failing, ${pending} pending/unreported. Advisory only — branch protection is the blocker._\n`;
            core.summary.addRaw(body);
            await core.summary.write();
            core.info(body);

  # WC-2 adoption (Wave D G2): run the unified release gate with
  # HERMES_RELEASE_GATE_STRICT=1, so a runner where ruff/pytest are absent
  # produces a hard FAIL instead of a soft WARN (no more "GREEN SHIP with
  # zero tests executed" on a stripped host). Capability shipped in
  # hermes_cli/release_gate.py (PR #414); this job adopts it in CI.
  #
  # Deliberately standalone: NOT in `aggregate`'s `needs` and not yet a
  # branch-protection-required check, so it cannot block in-flight PRs
  # until the operator promotes it. Setup mirrors tests.yml exactly
  # (same pinned action SHAs, Python 3.11, editable [all,dev] install).
  release-gate-strict:
    name: Release gate (strict tooling)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.11
          source .venv/bin/activate
          uv pip install -e ".[all,dev]"

      - name: Run release gate (strict)
        run: |
          source .venv/bin/activate
          muse doctor --release-gate
        env:
          HERMES_RELEASE_GATE_STRICT: "1"
          # Ensure the gate's fast pytest slice can't call real APIs.
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
