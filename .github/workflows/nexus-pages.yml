# Deploy the NEXUS PWA to GitHub Pages.
# Builds on pushes to main that touch apps/nexus (or manually) and publishes the
# built site to the `gh-pages` branch. This matches a "Deploy from a branch"
# Pages source (Settings → Pages → Branch: gh-pages /(root)). A plain branch push
# (contents: write) is used rather than actions/deploy-pages so it is not gated by
# the github-pages environment's deployment-branch policy.
#
# The site is built with base=/M.U.S.E/ (project Pages subpath) and HashRouter,
# and the deployed commit SHA is embedded so the in-app "Update NEXUS" control can
# tell when a newer main build is live.
#
# It also bundles the static MUSE 3D Systems Atlas (docs/3d-model/) into the same
# deploy under /atlas/, regenerating its data from the shared architecture model
# first so the published 3D model reflects the current architecture; the Neural
# Observatory web viewer under /observatory/; and the muse Cockpit (the imported
# "Singularity" Claude Design, demo mode) under /cockpit/.
name: Deploy NEXUS to Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/nexus/**'
      - 'docs/3d-model/**'
      - 'scripts/diagrams/**'
      - 'gateway/cockpit/static/observatory*'
      - 'gateway/cockpit/static/cockpit.dc.html'
      - 'gateway/cockpit/static/atlas/**'
      - 'gateway/cockpit/static/tokens.css'
      - 'gateway/cockpit/static/vendor/**'
      - '.github/workflows/nexus-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexus-pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build
        working-directory: apps/nexus
        env:
          NEXUS_BASE: /M.U.S.E/
          NEXUS_COMMIT_SHA: ${{ github.sha }}
        run: |
          npm ci --no-audit --no-fund
          npm run build
          touch dist/.nojekyll
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bundle the MUSE 3D Systems Atlas into the site (served at /atlas/)
        run: |
          # Regenerate the atlas data from the shared architecture model, then
          # ship the static atlas alongside NEXUS. stdlib-only, no build step.
          python3 scripts/diagrams/build_muse_flowchart.py
          mkdir -p apps/nexus/dist/atlas
          cp -r docs/3d-model/. apps/nexus/dist/atlas/
      - name: Bundle the Neural Observatory web viewer (served at /observatory/)
        run: |
          # The viewer is plain HTML/JS/CSS (vendored three.js, no build step).
          # Bare /observatory/ serves the always-on, clearly-labeled demo
          # snapshot; /observatory/observatory.html is the live viewer (point it
          # at a gateway with #base=...&token=...). See
          # docs/deploy/observatory-web-hosting.md.
          OBS=apps/nexus/dist/observatory
          mkdir -p "$OBS/vendor"
          cp gateway/cockpit/static/observatory.js "$OBS/"
          cp gateway/cockpit/static/observatory.css "$OBS/"
          cp gateway/cockpit/static/tokens.css "$OBS/"
          cp gateway/cockpit/static/observatory-demo.json "$OBS/"
          cp gateway/cockpit/static/vendor/three.module.min.js "$OBS/vendor/"
          cp gateway/cockpit/static/vendor/three.core.min.js "$OBS/vendor/"
          cp gateway/cockpit/static/observatory-demo.html "$OBS/index.html"
          cp gateway/cockpit/static/observatory.html "$OBS/observatory.html"
      - name: Bundle the muse Cockpit (served at /cockpit/)
        run: |
          # The imported "Singularity" Claude Design — plain HTML + vendored
          # React/dc-runtime + the 3D Atlas, no build step. On Pages there is no
          # gateway, so it runs in its self-contained demo mode (pair it to a
          # gateway for live data). See docs/cockpit-singularity.md.
          CKPT=apps/nexus/dist/cockpit
          mkdir -p "$CKPT/vendor" "$CKPT/atlas"
          cp gateway/cockpit/static/cockpit.dc.html "$CKPT/index.html"
          cp gateway/cockpit/static/vendor/react.production.min.js "$CKPT/vendor/"
          cp gateway/cockpit/static/vendor/react-dom.production.min.js "$CKPT/vendor/"
          cp gateway/cockpit/static/vendor/dc-runtime.js "$CKPT/vendor/"
          cp gateway/cockpit/static/vendor/three.module.min.js "$CKPT/vendor/"
          cp gateway/cockpit/static/vendor/three.core.min.js "$CKPT/vendor/"
          cp gateway/cockpit/static/atlas/index.html "$CKPT/atlas/"
          cp gateway/cockpit/static/atlas/style.css "$CKPT/atlas/"
          cp gateway/cockpit/static/atlas/app.js "$CKPT/atlas/"
          cp gateway/cockpit/static/atlas/architecture_data.js "$CKPT/atlas/"
      - name: Publish to gh-pages
        working-directory: apps/nexus/dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy NEXUS ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
