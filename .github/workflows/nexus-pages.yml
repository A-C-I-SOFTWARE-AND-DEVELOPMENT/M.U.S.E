# Deploy the NEXUS PWA to GitHub Pages.
# Builds on pushes to main that touch apps/nexus (or manually) and publishes the
# built site to the `gh-pages` branch. This matches a "Deploy from a branch"
# Pages source (Settings → Pages → Branch: gh-pages /(root)). A plain branch push
# (contents: write) is used rather than actions/deploy-pages so it is not gated by
# the github-pages environment's deployment-branch policy.
#
# The site is built with base=/M.U.S.E/ (project Pages subpath) and HashRouter,
# and the deployed commit SHA is embedded so the in-app "Update NEXUS" control can
# tell when a newer main build is live.
#
# It also bundles the static MUSE 3D Systems Atlas (docs/3d-model/) into the same
# deploy under /atlas/, regenerating its data from the shared architecture model
# first so the published 3D model reflects the current architecture.
name: Deploy NEXUS to Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/nexus/**'
      - 'docs/3d-model/**'
      - 'scripts/diagrams/**'
      - '.github/workflows/nexus-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexus-pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build
        working-directory: apps/nexus
        env:
          NEXUS_BASE: /M.U.S.E/
          NEXUS_COMMIT_SHA: ${{ github.sha }}
        run: |
          npm ci --no-audit --no-fund
          npm run build
          touch dist/.nojekyll
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bundle the MUSE 3D Systems Atlas into the site (served at /atlas/)
        run: |
          # Regenerate the atlas data from the shared architecture model, then
          # ship the static atlas alongside NEXUS. stdlib-only, no build step.
          python3 scripts/diagrams/build_muse_flowchart.py
          mkdir -p apps/nexus/dist/atlas
          cp -r docs/3d-model/. apps/nexus/dist/atlas/
      - name: Publish to gh-pages
        working-directory: apps/nexus/dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy NEXUS ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
