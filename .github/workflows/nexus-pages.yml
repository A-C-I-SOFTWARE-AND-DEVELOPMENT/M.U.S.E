# Deploy the NEXUS PWA to GitHub Pages.
# Runs on pushes to main that touch apps/nexus, or manually. The site is built
# with base=/M.U.S.E/ (project Pages subpath) and HashRouter, then published.
name: Deploy NEXUS to Pages

on:
  push:
    branches: [main]
    paths: ['apps/nexus/**', '.github/workflows/nexus-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nexus-pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build
        working-directory: apps/nexus
        env:
          NEXUS_BASE: /M.U.S.E/
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/nexus/dist
      - id: deploy
        uses: actions/deploy-pages@v4
