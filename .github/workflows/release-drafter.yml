name: Release Drafter

# Auto-generates release notes from merged PRs using conventional commit labels.
# Creates/updates a draft release on every push to main.
# https://github.com/release-drafter/release-drafter

on:
  push:
    branches:
      - main
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  update_release_draft:
    runs-on: [self-hosted, primary]
    timeout-minutes: 5
    steps:
      - uses: release-drafter/release-drafter@eada3c96a64734dd381cfbda23511034e328ddb0  # v7.6.0
        with:
          config-name: release-drafter-config.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
