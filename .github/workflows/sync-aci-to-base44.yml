# Semantics (decided 2026-06-11): FULL MIRROR, two-way.
# ACI source (aci-hermes-agent-source/) -> Base44 Jarvis repo on every push
# to main, and the Base44 app folder (base44-hermes-connect-app/) mirrors
# back. Commits tagged [base44-to-aci] skip the forward leg to prevent
# loops. Switching to a *filtered* mirror (rsync excludes for docs/ tests/
# etc.) changes downstream default behavior and is owner-gated — propose it
# in the decision ledger first.
name: Sync ACI Hermes to Base44

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aci-to-base44-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[base44-to-aci]')
    runs-on: ubuntu-latest

    steps:
      - name: Check TWO_WAY_SYNC_PAT secret
        id: has_pat
        env:
          SYNC_PAT: ${{ secrets.TWO_WAY_SYNC_PAT }}
        run: |
          if [ -z "$SYNC_PAT" ]; then
            echo "::notice::TWO_WAY_SYNC_PAT secret not configured — skipping Base44 sync."
            echo "has_pat=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_pat=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout ACI Hermes
        if: steps.has_pat.outputs.has_pat == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Sync ACI source and Base44 app folder to Jarvis
        if: steps.has_pat.outputs.has_pat == 'true'
        env:
          SYNC_PAT: ${{ secrets.TWO_WAY_SYNC_PAT }}
          BASE44_REPO: A-C-I-SOFTWARE-AND-DEVELOPMENT/Jarvis
          SOURCE_FOLDER: aci-hermes-agent-source
          APP_FOLDER: base44-hermes-connect-app
        run: |
          set -euo pipefail

          if [ -z "$SYNC_PAT" ]; then
            echo "Missing TWO_WAY_SYNC_PAT secret"
            exit 1
          fi

          git config --global user.name "aci-base44-sync-bot"
          git config --global user.email "aci-base44-sync-bot@users.noreply.github.com"

          SOURCE="$PWD"
          TARGET="../jarvis-base44"

          git clone "https://x-access-token:${SYNC_PAT}@github.com/${BASE44_REPO}.git" "$TARGET"
          cd "$TARGET"
          git checkout main

          mkdir -p "$SOURCE_FOLDER"
          find "$SOURCE_FOLDER" -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || true

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='base44-hermes-connect-app/' \
            "$SOURCE/" "$TARGET/$SOURCE_FOLDER/"

          if [ -d "$SOURCE/$APP_FOLDER" ]; then
            rsync -a --delete \
              --exclude='.git/' \
              --exclude='.github/' \
              "$SOURCE/$APP_FOLDER/" "$TARGET/"
          fi

          # The heredoc body is indented to the YAML block-scalar base indent
          # (YAML strips it, so the shell still sees every line at column 0).
          # Unindented heredoc content terminates the `run: |` block and makes
          # the whole workflow file unparseable.
          cat > BASE44_ACI_SOURCE_OF_TRUTH.md <<'EOF'
          # Base44 Hermes Connect Source of Truth

          Canonical ACI repo:

          A-C-I-SOFTWARE-AND-DEVELOPMENT/hermes-agent

          Base44-connected repo:

          A-C-I-SOFTWARE-AND-DEVELOPMENT/Jarvis

          ACI Hermes source is mirrored into:

          aci-hermes-agent-source/

          Base44 app source is mirrored back into ACI under:

          base44-hermes-connect-app/
          EOF

          git add .
          if git diff --cached --quiet; then
            echo "No ACI to Base44 changes."
            exit 0
          fi

          git commit -m "[aci-to-base44] Sync ACI Hermes source to Base44"
          git push origin main
