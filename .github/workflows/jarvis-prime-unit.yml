name: Jarvis Prime — unit tests

on:
  push:
    branches: [main]
    paths:
      - 'hermes_cli/jarvis_prime/**'
      - 'agent/redact.py'
      - 'tests/test_jarvis_prime_*.py'
      - 'tests/test_orchestrator_*.py'
      - 'tests/agent/test_redact.py'
      - 'apps/android/**'
      - '.github/workflows/jarvis-prime-unit.yml'
  pull_request:
    paths:
      - 'hermes_cli/jarvis_prime/**'
      - 'agent/redact.py'
      - 'tests/test_jarvis_prime_*.py'
      - 'tests/test_orchestrator_*.py'
      - 'tests/agent/test_redact.py'
      - 'apps/android/**'
      - '.github/workflows/jarvis-prime-unit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-prime-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-unit:
    name: Python unit (Jarvis Prime + redact + orchestrator)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Hermetic env — scrub anything that could let a test reach the network.
    env:
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      OPENROUTER_API_KEY: ''
      GITHUB_TOKEN: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime + test deps
        run: |
          python -m pip install --upgrade pip
          # Install the package with its dev extra so pytest +
          # pytest-asyncio + pytest-xdist + pytest-timeout + ruff are all
          # version-pinned to match local development.
          pip install -e '.[dev]'

      - name: ruff (launch-gate surface)
        run: |
          python -m ruff check \
            hermes_cli/jarvis_prime/ \
            agent/redact.py \
            tests/test_jarvis_prime_*.py \
            tests/agent/test_redact.py

      - name: pytest (launch-gate surface)
        run: |
          python -m pytest \
            tests/test_jarvis_prime_*.py \
            tests/test_orchestrator_*.py \
            tests/agent/test_redact.py \
            -q -p no:cacheprovider --timeout=60

  android-unit:
    name: Android JVM unit (testDebugUnitTest)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Cache Gradle caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/android/**/*.gradle*', 'apps/android/gradle/libs.versions.toml', 'apps/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run JVM unit tests
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: |
            apps/android/app/build/reports/tests/
            apps/android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
