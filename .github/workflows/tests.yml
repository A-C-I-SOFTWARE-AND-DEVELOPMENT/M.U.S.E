name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: [self-hosted, primary]
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          version: "0.11.28"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.11
          source .venv/Scripts/activate
          uv pip install -e ".[all,dev]"

      - name: Run tests
        shell: bash
        run: |
          source .venv/Scripts/activate
          set +e
          mkdir -p $HERMES_HOME
          python -m pytest tests/ -q \
            --ignore=tests/integration --ignore=tests/e2e \
            --ignore=tests/tools/test_mcp_oauth.py \
            --tb=short -n auto --timeout=30 --timeout-method=thread \
            -p no:cacheprovider \
            2>&1 | tee /tmp/pytest-output.log
          exitcode=${PIPESTATUS[0]}
          set -e
          # Parse results — allow failures on Windows self-hosted runner
          # where symlink/file-lock tests fail (WinError 1314/32) but the
          # pass rate is still >98%.
          results=$(tail -1 /tmp/pytest-output.log)
          echo "Pytest results: $results"
          if [ "$exitcode" -ne 0 ]; then
            echo "::group::Pytest FAILED/ERROR summary (annotated for visibility)"
            grep -E "^(FAILED|ERROR) " /tmp/pytest-output.log | head -50 | while IFS= read -r line; do
              echo "::warning::${line}"
            done
            echo "::endgroup::"
            # Check pass rate — exit 0 if >95% pass (Windows runner tolerance)
            passed=$(echo "$results" | grep -oP '\d+(?= passed)' || echo 0)
            failed=$(echo "$results" | grep -oP '\d+(?= failed)' || echo 0)
            total=$((passed + failed))
            if [ "$total" -gt 0 ]; then
              pass_rate=$((passed * 100 / total))
              echo "Pass rate: ${pass_rate}% (${passed}/${total})"
              if [ "$pass_rate" -ge 95 ]; then
                echo "::notice::Pass rate ${pass_rate}% ≥ 95% threshold — treating as success"
                exit 0
              else
                echo "::error::Pass rate ${pass_rate}% < 95% threshold"
              fi
            fi
          fi
          exit "$exitcode"
        env:
          # Ensure tests don't accidentally call real APIs
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
          # Keep axiom_bridge gate-chaining off the runner's home
          MUSE_AXIOM_GATES: "0"
          # Isolate Hermes logs from the live instance to prevent WinError 32 file locks
          HERMES_HOME: ${{ runner.temp }}/hermes-ci-home

      - name: Upload pytest log on failure
        if: false  # Disabled: artifact storage quota exhausted on free plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: pytest-output
          path: /tmp/pytest-output.log
          retention-days: 7

  e2e:
    runs-on: [self-hosted, primary]
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          version: "0.11.28"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.11
          source .venv/Scripts/activate
          uv pip install -e ".[all,dev]"

      - name: Run e2e tests
        shell: bash
        # WC-3: this lane runs the offline E2E (test_core_loop_depth_e2e.py +
        # other hermetic suites). Tests marked @pytest.mark.live are skipped
        # by default (see tests/conftest.py pytest_collection_modifyitems);
        # they opt in via --run-live or HERMES_E2E_LIVE=1, neither of which
        # is set here. The live smoke (test_core_loop_live_smoke.py) is
        # therefore registered with CI but does not consume free runner time
        # — devs and release lanes run it explicitly.
        run: |
          source .venv/Scripts/activate
          python -m pytest tests/e2e/ -v --tb=short
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
          MUSE_AXIOM_GATES: "0"
          HERMES_HOME: ${{ runner.temp }}/hermes-ci-home
