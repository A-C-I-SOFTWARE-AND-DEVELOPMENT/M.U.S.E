name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, primary]
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          version: "0.11.28"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.11
          .venv\Scripts\activate
          uv pip install -e ".[all,dev]"

      - name: Run tests
        shell: bash
        run: |
          source .venv/Scripts/activate || source .venv/bin/activate
          set +e
          python -m pytest tests/ -q --ignore=tests/integration --ignore=tests/e2e --tb=short -n auto --timeout=30 2>&1 | tee /tmp/pytest-output.log
          exitcode=${PIPESTATUS[0]}
          set -e
          if [ "$exitcode" -ne 0 ]; then
            echo "::group::Pytest FAILED/ERROR summary (annotated for visibility)"
            grep -E "^(FAILED|ERROR) " /tmp/pytest-output.log | head -50 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            echo "::endgroup::"
          fi
          exit "$exitcode"
        env:
          # Ensure tests don't accidentally call real APIs
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
          # Keep axiom_bridge gate-chaining off the runner's home
          MUSE_AXIOM_GATES: "0"

      - name: Upload pytest log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: pytest-output
          path: /tmp/pytest-output.log
          retention-days: 7

  e2e:
    runs-on: [self-hosted, primary]
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.11
          .venv\Scripts\activate
          uv pip install -e ".[all,dev]"

      - name: Run e2e tests
        # WC-3: this lane runs the offline E2E (test_core_loop_depth_e2e.py +
        # other hermetic suites). Tests marked @pytest.mark.live are skipped
        # by default (see tests/conftest.py pytest_collection_modifyitems);
        # they opt in via --run-live or HERMES_E2E_LIVE=1, neither of which
        # is set here. The live smoke (test_core_loop_live_smoke.py) is
        # therefore registered with CI but does not consume free runner time
        # — devs and release lanes run it explicitly.
        run: |
          source .venv/bin/activate
          python -m pytest tests/e2e/ -v --tb=short
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
          MUSE_AXIOM_GATES: "0"
