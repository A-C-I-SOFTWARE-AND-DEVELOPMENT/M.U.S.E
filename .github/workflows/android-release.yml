name: Android release

# Build a signed release APK and publish it as a downloadable release asset.
# One-button release: Actions → "Android release" → "Run workflow" (no input)
# cuts a permanent versioned release whose version is auto-derived from the
# repo's real history (build date + commit count, e.g. 2026.06.05.107) — no
# tag to type. Pushing an explicit `android-v*` tag still works for a
# hand-named version, and pushes to the build branches refresh the rolling
# `android-latest` download.
#
# Signing is driven entirely by repository secrets — nothing sensitive lives
# in the repo. Set these four secrets (Settings → Secrets and variables →
# Actions); see apps/android/docs/RELEASE_SIGNING.md:
#   ANDROID_KEYSTORE_BASE64    base64 of your .jks keystore
#   ANDROID_KEYSTORE_PASSWORD  keystore (store) password
#   ANDROID_KEY_ALIAS          key alias
#   ANDROID_KEY_PASSWORD       key password
#
# If the keystore secret is absent the job still builds, but the APK falls
# back to debug signing (clearly marked) instead of failing — so forks
# without secrets are not blocked.

on:
  push:
    tags:
      - 'android-v*'
    branches:
      # `main` keeps a rolling `android-latest` download fresh on every
      # Android change. The `claude/live-app-download-*` line is the initial
      # bring-up so the first installable APK publishes before this merges to
      # main; it can be dropped once `main` is publishing on its own.
      - main
      - 'claude/live-app-download-*'
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional: hand-name the release tag (e.g. android-v1.0.0). Leave blank for an auto-versioned date.commits release.'
        required: false
        default: ''
      channel:
        description: 'rolling = refresh the android-latest download from current main (used by sync-main-to-releases); versioned = cut a permanent release (the default one-button behavior).'
        required: false
        type: choice
        default: versioned
        options:
          - versioned
          - rolling

permissions:
  contents: write  # needed to create/upload the GitHub Release asset

# Queue (never cancel) release runs: an in-flight run may be mid-publish of a
# GitHub Release / `android-latest` asset, so cancelling could leave a
# half-published release.
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-apk:
    name: Build & publish signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Full history so the version can be derived from the real commit
          # count (work done), not the default shallow clone of depth 1.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Cache Gradle caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/android/**/*.gradle*', 'apps/android/gradle/libs.versions.toml', 'apps/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Determine release context + version
        id: ctx
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_CHANNEL: ${{ github.event.inputs.channel }}
        run: |
          # Version is auto-derived from the repo's real history so it always
          # reflects the actual time + work done — never a hand-edited
          # placeholder. Format: <UTC build date>.<total commit count>, e.g.
          # 2026.06.05.107. APP_COMMITS counts commits that actually touched
          # the Android app (surfaced in the release notes).
          DATE="$(date -u +%Y.%m.%d)"
          REPO_COMMITS="$(git rev-list --count HEAD)"
          # The job runs from apps/android (defaults.run.working-directory), so
          # the '.' pathspec counts commits that touched the Android app.
          APP_COMMITS="$(git rev-list --count HEAD -- . || echo 0)"
          SHA="$(git rev-parse --short HEAD)"
          AUTO_VERSION="${DATE}.${REPO_COMMITS}"

          if [[ "$REF" == refs/tags/android-v* ]]; then
            # Explicit version tag → permanent, versioned release; the APK is
            # stamped with the tag's version.
            VERSION="${REF_NAME#android-v}"; TAG="$REF_NAME"
            PUBLISH=true; PRERELEASE=false; CHANNEL=versioned
            ASSET="jarvis-prime-${VERSION}.apk"; TITLE="MUSE ${TAG}"
          elif [ "$EVENT" = "workflow_dispatch" ] && [ "$INPUT_CHANNEL" = "rolling" ]; then
            # sync-main-to-releases dispatches us in rolling mode: refresh the
            # 'android-latest' download from the current main instead of cutting
            # a new permanent version. Same outputs as the main-push branch.
            VERSION="$AUTO_VERSION"; TAG="android-latest"
            PUBLISH=true; PRERELEASE=true; CHANNEL=rolling
            ASSET="jarvis-prime-android.apk"; TITLE="MUSE — latest Android build"
          elif [ "$EVENT" = "workflow_dispatch" ] && [ -n "$INPUT_TAG" ]; then
            # Manual dispatch against an explicit tag.
            VERSION="${INPUT_TAG#android-v}"; TAG="$INPUT_TAG"
            PUBLISH=true; PRERELEASE=false; CHANNEL=versioned
            ASSET="jarvis-prime-${VERSION}.apk"; TITLE="MUSE ${TAG}"
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            # THE ONE BUTTON: Actions → Android release → Run workflow with no
            # input cuts a permanent versioned release auto-stamped with the
            # build date + commit count. No tag to type.
            VERSION="$AUTO_VERSION"; TAG="android-v${VERSION}"
            PUBLISH=true; PRERELEASE=false; CHANNEL=versioned
            ASSET="jarvis-prime-${VERSION}.apk"; TITLE="MUSE ${TAG}"
          elif [ "$EVENT" = "push" ]; then
            # Branch push → refresh the rolling 'android-latest' download; the
            # asset name is stable so the URL never changes, but the APK inside
            # still carries the real date+work version.
            VERSION="$AUTO_VERSION"; TAG="android-latest"
            PUBLISH=true; PRERELEASE=true; CHANNEL=rolling
            ASSET="jarvis-prime-android.apk"; TITLE="MUSE — latest Android build"
          else
            VERSION="$AUTO_VERSION"; TAG=""; PUBLISH=false; CHANNEL=none
            ASSET="jarvis-prime-${VERSION}.apk"; TITLE="MUSE ${VERSION}"
          fi

          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "publish=$PUBLISH"
            echo "prerelease=$PRERELEASE"
            echo "channel=$CHANNEL"
            echo "asset=$ASSET"
            echo "title=$TITLE"
            echo "date=$DATE"
            echo "repo_commits=$REPO_COMMITS"
            echo "app_commits=$APP_COMMITS"
            echo "sha=$SHA"
          } >> "$GITHUB_OUTPUT"
          echo "Version $VERSION → ${CHANNEL} release (tag: ${TAG:-none}, asset: $ASSET)"

      - name: Decode release keystore (if configured)
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/jarvis-release.jks"
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore decoded — building a signed release APK."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret set — release APK will fall back to debug signing."
          fi

      - name: Assemble release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.keystore.outputs.configured == 'true' && format('{0}/jarvis-release.jks', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Each build gets a unique, monotonically increasing versionCode so a
          # freshly downloaded rolling APK actually supersedes the prior install
          # (Android treats an equal versionCode as "not newer"). versionName
          # stays the source-of-truth marketing version for tagged releases.
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          # versionName auto-derived from real repo history (build date + commit
          # count) so the version reflects the actual time + work done.
          ANDROID_VERSION_NAME: ${{ steps.ctx.outputs.version }}
        # --warn (not --info) keeps signing-config env reads out of verbose logs.
        run: ./gradlew --no-daemon --stacktrace --warn :app:assembleRelease

      - name: Locate and name the APK
        id: apk
        run: |
          src="$(find app/build/outputs/apk/release -name '*.apk' | head -1)"
          if [ -z "$src" ]; then echo "No release APK produced" >&2; exit 1; fi
          dest="${{ steps.ctx.outputs.asset }}"
          cp "$src" "$dest"
          echo "path=apps/android/$dest" >> "$GITHUB_OUTPUT"
          echo "name=$dest" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature
        id: verify
        env:
          # Set repo/org variable REQUIRE_RELEASE_SIGNING=true to fail the build
          # if the APK is only debug-signed (i.e. the keystore secrets are
          # missing). Default is unset → forks/bring-up still publish a
          # debug-signed APK instead of failing.
          REQUIRE_RELEASE_SIGNING: ${{ vars.REQUIRE_RELEASE_SIGNING }}
        run: |
          bt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          apksigner="$bt/apksigner"
          echo "apksigner: $apksigner"
          # Fail if the APK is unsigned or its signature does not verify at all.
          "$apksigner" verify --print-certs --verbose "${{ steps.apk.outputs.name }}" | tee signer.txt
          # The Android debug keystore has the fixed identity CN=Android Debug.
          # Anything else is a real release-signing identity.
          if grep -q "CN=Android Debug" signer.txt; then
            echo "signing=debug" >> "$GITHUB_OUTPUT"
            echo "::warning::APK is DEBUG-signed (no release keystore secret). Installable via sideload, but NOT a release-signed artifact."
            if [ "${REQUIRE_RELEASE_SIGNING:-false}" = "true" ]; then
              echo "::error::REQUIRE_RELEASE_SIGNING is set but the APK is debug-signed — configure ANDROID_KEYSTORE_* secrets."
              exit 1
            fi
          else
            echo "signing=release" >> "$GITHUB_OUTPUT"
            echo "APK is release-signed by a non-debug identity."
          fi
          # Surface the signer fingerprint(s) in the job summary (no secrets:
          # these are public certificate digests, never the private key/password).
          {
            echo "### APK signature"
            echo '```'
            grep -E 'Signer #[0-9]+ certificate (DN|SHA-256)' signer.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 90

      - name: Publish the downloadable GitHub Release
        if: steps.ctx.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ctx.outputs.tag }}
          TITLE: ${{ steps.ctx.outputs.title }}
          PRERELEASE: ${{ steps.ctx.outputs.prerelease }}
          VERSION: ${{ steps.ctx.outputs.version }}
          BUILD_DATE: ${{ steps.ctx.outputs.date }}
          REPO_COMMITS: ${{ steps.ctx.outputs.repo_commits }}
          APP_COMMITS: ${{ steps.ctx.outputs.app_commits }}
          SHA: ${{ steps.ctx.outputs.sha }}
          ASSET: ${{ steps.apk.outputs.name }}
          SIGNING: ${{ steps.verify.outputs.signing }}
        run: |
          if [ "$SIGNING" = "release" ]; then
            sign_line="**Release-signed** (verified by apksigner)."
          else
            sign_line="**Debug-signed** — no release keystore secret is configured, so this is a pre-release build. Fully installable via sideload (Android may warn it is from an \"unknown developer\"); it is **not** a Play-ready release artifact. See apps/android/docs/RELEASE_SIGNING.md."
          fi
          # printf keeps every Markdown line at column 0 regardless of the
          # YAML block indentation, so nothing renders as an accidental code block.
          {
            printf '%s\n' "**MUSE** — the **local-only Hermes/JARVIS Android cockpit**. Version ${VERSION}."
            printf '%s\n' ""
            printf '%s\n' "_Auto-versioned from the repo's real history: built **${BUILD_DATE}** (UTC) from commit \`${SHA}\` — **${REPO_COMMITS}** commits of work total, **${APP_COMMITS}** of them touching the Android app._"
            printf '%s\n' ""
            printf '%s\n' "> This app runs on your device: it organizes handoffs to the AI tools you already use (Codex, Claude Code, ChatGPT, Claude) via clipboard / deep links / the Termux bridge. Its only network traffic is to **your own local Hermes gateway** (default \`127.0.0.1:8765\`) when you pair one — **never** to remote AI providers — and it holds **no** API keys. Unpaired, it runs fully offline against an on-device mock."
            printf '%s\n' ""
            printf '%s\n' "Signing: ${sign_line}"
            printf '%s\n' ""
            printf '%s\n' "## Install"
            printf '%s\n' "1. On your Android phone, download \`${ASSET}\` from the Assets below."
            printf '%s\n' "2. Open it and tap install; allow installs from this source if prompted."
            printf '%s\n' "3. Launch **MUSE**."
            printf '%s\n' ""
            printf '%s\n' "Requires Android 8.0+ (API 26). Built for arm64-v8a / armeabi-v7a."
          } > release-notes.md
          pre_flag=""
          [ "$PRERELEASE" = "true" ] && pre_flag="--prerelease"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --notes-file release-notes.md --target "$GITHUB_SHA" $pre_flag
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --notes-file release-notes.md --target "$GITHUB_SHA" $pre_flag
          fi
          gh release upload "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
          echo "Download: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ASSET}"
