name: Android release

# Build a signed release APK and publish it as a downloadable release asset
# on every Android version tag (e.g. `android-v0.1.0`). Also runnable on
# demand via the Actions tab.
#
# Signing is driven entirely by repository secrets — nothing sensitive lives
# in the repo. Set these four secrets (Settings → Secrets and variables →
# Actions); see apps/android/docs/RELEASE_SIGNING.md:
#   ANDROID_KEYSTORE_BASE64    base64 of your .jks keystore
#   ANDROID_KEYSTORE_PASSWORD  keystore (store) password
#   ANDROID_KEY_ALIAS          key alias
#   ANDROID_KEY_PASSWORD       key password
#
# If the keystore secret is absent the job still builds, but the APK falls
# back to debug signing (clearly marked) instead of failing — so forks
# without secrets are not blocked.

on:
  push:
    tags:
      - 'android-v*'
    branches:
      # `main` keeps a rolling `android-latest` download fresh on every
      # Android change. The `claude/live-app-download-*` line is the initial
      # bring-up so the first installable APK publishes before this merges to
      # main; it can be dropped once `main` is publishing on its own.
      - main
      - 'claude/live-app-download-*'
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional release tag to attach the APK to (e.g. android-v0.1.0)'
        required: false
        default: ''

permissions:
  contents: write  # needed to create/upload the GitHub Release asset

jobs:
  release-apk:
    name: Build & publish signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Cache Gradle caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/android/**/*.gradle*', 'apps/android/gradle/libs.versions.toml', 'apps/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode release keystore (if configured)
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/jarvis-release.jks"
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore decoded — building a signed release APK."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret set — release APK will fall back to debug signing."
          fi

      - name: Assemble release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.keystore.outputs.configured == 'true' && format('{0}/jarvis-release.jks', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace --info :app:assembleRelease

      - name: Determine release context
        id: rel
        run: |
          ver="$(grep -E '^\s*versionName' app/build.gradle.kts | head -1 | sed -E 's/.*"(.*)".*/\1/')"
          echo "version=${ver:-0.0.0}" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # Real version tag → permanent, versioned release.
            echo "publish=true"     >> "$GITHUB_OUTPUT"
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "asset=jarvis-prime-${ver:-release}.apk" >> "$GITHUB_OUTPUT"
            echo "title=Jarvis Prime ${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            # Manually dispatched against an explicit tag.
            echo "publish=true"     >> "$GITHUB_OUTPUT"
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "asset=jarvis-prime-${ver:-release}.apk" >> "$GITHUB_OUTPUT"
            echo "title=Jarvis Prime ${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            # Branch push → refresh the rolling 'android-latest' download. The
            # asset name is stable so the download URL never changes.
            echo "publish=true"     >> "$GITHUB_OUTPUT"
            echo "tag=android-latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=true"  >> "$GITHUB_OUTPUT"
            echo "asset=jarvis-prime-android.apk" >> "$GITHUB_OUTPUT"
            echo "title=Jarvis Prime — latest Android build" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false"    >> "$GITHUB_OUTPUT"
            echo "asset=jarvis-prime-${ver:-release}.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Locate and name the APK
        id: apk
        run: |
          src="$(find app/build/outputs/apk/release -name '*.apk' | head -1)"
          if [ -z "$src" ]; then echo "No release APK produced" >&2; exit 1; fi
          dest="${{ steps.rel.outputs.asset }}"
          cp "$src" "$dest"
          echo "path=apps/android/$dest" >> "$GITHUB_OUTPUT"
          echo "name=$dest" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature
        id: verify
        env:
          # Set repo/org variable REQUIRE_RELEASE_SIGNING=true to fail the build
          # if the APK is only debug-signed (i.e. the keystore secrets are
          # missing). Default is unset → forks/bring-up still publish a
          # debug-signed APK instead of failing.
          REQUIRE_RELEASE_SIGNING: ${{ vars.REQUIRE_RELEASE_SIGNING }}
        run: |
          bt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          apksigner="$bt/apksigner"
          echo "apksigner: $apksigner"
          # Fail if the APK is unsigned or its signature does not verify at all.
          "$apksigner" verify --print-certs --verbose "${{ steps.apk.outputs.name }}" | tee signer.txt
          # The Android debug keystore has the fixed identity CN=Android Debug.
          # Anything else is a real release-signing identity.
          if grep -q "CN=Android Debug" signer.txt; then
            echo "signing=debug" >> "$GITHUB_OUTPUT"
            echo "::warning::APK is DEBUG-signed (no release keystore secret). Installable via sideload, but NOT a release-signed artifact."
            if [ "${REQUIRE_RELEASE_SIGNING:-false}" = "true" ]; then
              echo "::error::REQUIRE_RELEASE_SIGNING is set but the APK is debug-signed — configure ANDROID_KEYSTORE_* secrets."
              exit 1
            fi
          else
            echo "signing=release" >> "$GITHUB_OUTPUT"
            echo "APK is release-signed by a non-debug identity."
          fi
          # Surface the signer fingerprint(s) in the job summary (no secrets:
          # these are public certificate digests, never the private key/password).
          {
            echo "### APK signature"
            echo '```'
            grep -E 'Signer #[0-9]+ certificate (DN|SHA-256)' signer.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 90

      - name: Publish the downloadable GitHub Release
        if: steps.rel.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.rel.outputs.tag }}
          TITLE: ${{ steps.rel.outputs.title }}
          PRERELEASE: ${{ steps.rel.outputs.prerelease }}
          VERSION: ${{ steps.rel.outputs.version }}
          ASSET: ${{ steps.apk.outputs.name }}
          SIGNING: ${{ steps.verify.outputs.signing }}
        run: |
          if [ "$SIGNING" = "release" ]; then
            sign_line="**Release-signed** (verified by apksigner)."
          else
            sign_line="**Debug-signed** — no release keystore secret is configured, so this is a pre-release build. Fully installable via sideload (Android may warn it is from an \"unknown developer\"); it is **not** a Play-ready release artifact. See apps/android/docs/RELEASE_SIGNING.md."
          fi
          # printf keeps every Markdown line at column 0 regardless of the
          # YAML block indentation, so nothing renders as an accidental code block.
          {
            printf '%s\n' "**Jarvis Prime** — the **local-only Hermes/JARVIS Android cockpit**. Version ${VERSION}."
            printf '%s\n' ""
            printf '%s\n' "> This app runs entirely on your device: it organizes handoffs to the AI tools you already use (Codex, Claude Code, ChatGPT, Claude) via clipboard / deep links / the Termux bridge. It makes **no network calls of its own**, proxies **no** AI provider, and holds **no** API keys."
            printf '%s\n' ""
            printf '%s\n' "Signing: ${sign_line}"
            printf '%s\n' ""
            printf '%s\n' "## Install"
            printf '%s\n' "1. On your Android phone, download \`${ASSET}\` from the Assets below."
            printf '%s\n' "2. Open it and tap install; allow installs from this source if prompted."
            printf '%s\n' "3. Launch **Jarvis Prime**."
            printf '%s\n' ""
            printf '%s\n' "Requires Android 8.0+ (API 26). Built for arm64-v8a / armeabi-v7a."
          } > release-notes.md
          pre_flag=""
          [ "$PRERELEASE" = "true" ] && pre_flag="--prerelease"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --notes-file release-notes.md --target "$GITHUB_SHA" $pre_flag
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --notes-file release-notes.md --target "$GITHUB_SHA" $pre_flag
          fi
          gh release upload "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
          echo "Download: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ASSET}"
