name: Secret scan

# Blocks commits/PRs that ADD a high-confidence secret. Reuses the repo's
# canonical detector (hermes_cli/secrets_policy.py) via scripts/scan_secrets.py.
#
# Diff mode only — it scans the lines a change ADDS, never the whole tree, so
# already-reviewed fixtures don't re-trip it and the low-precision high_entropy
# heuristic stays advisory. The script is stdlib-only: no dependency install.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: scan added lines for secrets
    runs-on: [self-hosted, primary]
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # need history for the merge-base diff

      - name: Determine base ref
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="origin/${{ github.base_ref }}"
          else
            # Whole pushed range: github.event.before is the SHA before the
            # push, so it covers every commit in a multi-commit push. Fall
            # back to HEAD~1 / HEAD when before is the zero SHA (new branch /
            # first push) or unreachable (force-push).
            BEFORE="${{ github.event.before }}"
            ZERO="0000000000000000000000000000000000000000"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "$ZERO" ] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              BASE_REF="$BEFORE"
            else
              BASE_REF=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
            fi
          fi
          echo "ref=${BASE_REF}" >> "$GITHUB_OUTPUT"
          echo "Base ref: ${BASE_REF}"

      - name: Scan added lines
        run: |
          python3 scripts/scan_secrets.py --base "${{ steps.base.outputs.ref }}"
