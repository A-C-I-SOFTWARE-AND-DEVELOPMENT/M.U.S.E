name: PR Todo Checker

# Scans the PR diff for newly introduced TODO / FIXME comments and posts a
# review comment on each one. With ``enable_ignore_checkbox`` a reviewer can
# tick a box to acknowledge an intentional TODO so the check passes.
#
# Marketplace action: https://github.com/marketplace/actions/pr-todo-checker
# Third-party actions are pinned to a full commit SHA (with the human-readable
# tag in a trailing comment) to match this repo's supply-chain convention.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review_comment:
    types: [edited, deleted]

permissions:
  contents: read
  pull-requests: write # needed to post / update TODO review comments
  statuses: write # the action sets a "PR Todo Checker" commit status via
  #                 repos.createCommitStatus; without this scope the call
  #                 fails and the check silently "fails open" (never red).

concurrency:
  group: pr-todo-checker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  find_todos:
    name: Check for Todos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check for Todos
        uses: phntmxyz/pr_todo_checker@ca2891552a6cd4069c6afb83c955133e77dac685 # v1.2.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          enable_ignore_checkbox: true
          # Don't flag the checker's own config file: its documentation
          # comments necessarily contain the words TODO / FIXME, and the
          # action name (pr-todo-checker) trips the matcher too.
          exclude: |
            .github/workflows/pr-todo-checker.yml
