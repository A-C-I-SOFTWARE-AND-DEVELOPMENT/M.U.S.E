name: Orchestration tests

# Runs the orchestration-specific test suite plus a py_compile + bash
# syntax sanity sweep. Deliberately narrow scope so it stays green
# even if the broader test suite has unrelated flakes.

on:
  push:
    branches: [main]
    paths:
      - 'hermes_cli/**'
      - 'scripts/hermes-orchestrate.sh'
      - 'scripts/hermes-termux-service.sh'
      - 'scripts/hermes-termux-doctor.sh'
      - 'scripts/hermes-ai-radar.sh'
      - 'tests/test_orchestrator*.py'
      - 'tests/test_worker*.py'
      - 'tests/test_scoring.py'
      - 'tests/test_merge_engine.py'
      - 'tests/test_validation_gates.py'
      - 'tests/test_github_publisher.py'
      - '.github/workflows/orchestration-tests.yml'
  pull_request:
    paths:
      - 'hermes_cli/**'
      - 'scripts/hermes-orchestrate.sh'
      - 'scripts/hermes-termux-service.sh'
      - 'scripts/hermes-termux-doctor.sh'
      - 'scripts/hermes-ai-radar.sh'
      - 'tests/test_orchestrator*.py'
      - 'tests/test_worker*.py'
      - 'tests/test_scoring.py'
      - 'tests/test_merge_engine.py'
      - 'tests/test_validation_gates.py'
      - 'tests/test_github_publisher.py'
      - '.github/workflows/orchestration-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orchestration-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Orchestration unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-xdist pytest-timeout PyYAML

      - name: Py-compile the orchestrator modules
        run: |
          python -m py_compile hermes_cli/*.py hermes_cli/workers/*.py

      - name: Bash syntax-check the orchestration scripts
        run: |
          bash -n scripts/hermes-orchestrate.sh
          bash -n scripts/hermes-termux-service.sh
          bash -n scripts/hermes-termux-doctor.sh
          bash -n scripts/hermes-ai-radar.sh

      - name: Run orchestration tests
        env:
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          GITHUB_TOKEN: ""
          muse_AXIOM_GATES: "0"
          HERMES_ORCHESTRATOR_JOBS_ROOT: ${{ github.workspace }}/.tmp/orchestrator-jobs
        run: |
          python -m pytest \
            tests/test_orchestrator*.py \
            tests/test_worker*.py \
            tests/test_scoring.py \
            tests/test_merge_engine.py \
            tests/test_validation_gates.py \
            tests/test_github_publisher.py \
            -q -p no:cacheprovider