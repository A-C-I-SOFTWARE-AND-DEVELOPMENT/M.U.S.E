  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    const templateData = JSON.parse(templateEl.textContent);
    const pages = templateData.pages;
    const entryId = templateData.entry;
    const pageIds = Object.keys(pages);

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : {};

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));

    // file:// document inherit a null origin, so crossorigin forces a CORS
    // fetch that SRI then rejects — the manifest bytes are ours; SRI protects
    // against CDN compromise, not this), and inject the page's own
    // window.__resources + the click interceptor into <head>. slice() rather
    // than replace() keeps us clear of $-pattern substitution.

      }
      return map;

      // a blanket <base target="_parent"> would also redirect form submissions
      // and tear down the wrapper. Non-# links navigate the parent to the
      // anchor's resolved href; #/… routes forward to the parent's hash only
      // when the id is one of this bundle's own pages (author #/… links from
      // an in-page hash router are left to the scroll path so they don't yank
      // the user to the entry page); plain #frag scrolls in place.

      // anchors, which closest()/IDL .target get wrong.

            'var tg = a.getAttribute("target");' +
            'if (tg && tg !== "_self") return;' +

            'if (h.charAt(0) !== "#") {' +

              'e.preventDefault();' +
              'if (/^(?:[a-z][a-z0-9+.-]*:|\\/\\/)/i.test(h)) parent.location.assign(h);' +
              'return;' +
            '}' +
            'e.preventDefault();' +
            'if (h.slice(0, 2) === "#/") {' +
              'var c = h.indexOf(":", 2);' +
              'var pid = c < 0 ? h.slice(2) : h.slice(2, c);' +
              'try { pid = decodeURIComponent(pid); } catch(err) {}' +
              'if (window.__bundler_pages.indexOf(pid) >= 0) { parent.location.hash = h; return; }' +
            '}' +
            'var t = h.length > 1 ? document.getElementById(h.slice(1)) : null;' +
            'if (t) t.scrollIntoView({behavior:"smooth"});' +
            'else scrollTo({top:0, behavior:"smooth"});' +
          '});' : '');

      // ids) before wrapping — same escape level as every sibling JSON island.
      var headScript = '<script>' +
        headContent.split('</' + 'script').join('<\\/' + 'script') +
        '</' + 'script>';

      // would push the parser into quirks mode. DOMParser always emits a <head>

      // attributes through, so match the full opening tag.

        var hi = headOpen.index + headOpen[0].length;
        t = t.slice(0, hi) + headScript + t.slice(hi);
      }
      pages[id] = t;
    }

    setStatus('Rendering...');

    if (pageIds.length === 1) {
      // Single page: the pre-crawl render path. Parse the template and swap the
      // root element. Scripts inserted via DOMParser/replaceWith are inert per
      // spec — re-create each with createElement so they execute, awaiting
      // onload for src scripts to preserve ordering (React before ReactDOM
      // before Babel before text/babel).

      const dead = Array.from(document.scripts);
      for (const old of dead) {
        const s = document.createElement('script');
        for (const a of old.attributes) s.setAttribute(a.name, a.value);
        s.textContent = old.textContent;
        // text/babel scripts with a src: fetch and inline. transformScriptTags
        // does XHR against the src, but blob:null/ from a file:// origin is
        // silently dropped. Inlining makes it a plain inline babel script,
        // which transformScriptTags handles unconditionally.

          try {
            const r = await fetch(s.src);
            s.textContent = await r.text();
            s.removeAttribute('src');
          } catch (e) {}
        }
        // Non-executable script types (text/babel, application/json, …) are
        // data blocks per spec: the browser never fetches src and never fires
        // load/error, so awaiting would hang forever.
        const exec = !s.type || s.type === 'module' || /(java|ecma)script/i.test(s.type);
        const p = (s.src && exec) ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
        old.replaceWith(s);
        if (p) await p;
      }
      // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
      // which fired before we swapped the document. Trigger manually if present.
      if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
        window.Babel.transformScriptTags();
      }
      return;
    }

    // Multi-page: render into a full-viewport srcdoc iframe so each page runs
    // in its own realm while staying same-origin with the parent (so asset
    // blob URLs load and parent.location is writable).
    var frame = document.createElement('iframe');
    frame.id = '__bundler_frame';
    frame.setAttribute('style', 'position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff');
    document.body.appendChild(frame);

    function decode(s) {
      try { return decodeURIComponent(s); } catch (e) { return s; }
    }
    function route() {
      var h = (location.hash || '');
      if (h.slice(0, 2) !== '#/') return { id: entryId, anchor: '' };
      h = h.slice(2);
      var i = h.indexOf(':');
      return i < 0 ? { id: decode(h), anchor: '' }
                   : { id: decode(h.slice(0, i)), anchor: decode(h.slice(i + 1)) };
    }

    var current = null;
    var navGen = 0;
    function navigate() {
      var r = route();
      var id = Object.prototype.hasOwnProperty.call(pages, r.id) ? r.id : entryId;
      if (current === id) {
        // Same-page anchor change: the iframe's own hash handles this, so
        // normally we don't reach here. If we do (e.g. a programmatic
        // parent.location.hash change), nudge the iframe.
        var cw = frame.contentWindow;
        if (!cw) return;
        var el = r.anchor && cw.document.getElementById(r.anchor);
        if (el) el.scrollIntoView({ behavior: 'smooth' });
        else cw.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }
      current = id;
      var gen = ++navGen;
      frame.onload = function() {
        // One-shot: an iframe-internal navigation (form submit, page JS
        // location.href=) re-fires onload with the same gen; after that the
        // iframe may be cross-origin, and cw.* access would throw.
        frame.onload = null;
        if (gen !== navGen) return;
        var cw = frame.contentWindow;
        try { cw.document.title && (document.title = cw.document.title); } catch (e) {}
        var splash = document.getElementById('__bundler_thumbnail') ||
                     document.getElementById('__bundler_placeholder');
        if (splash) splash.remove();
        if (loading) loading.remove();
        var el = r.anchor && cw.document.getElementById(r.anchor);
        if (el) el.scrollIntoView();
        else cw.scrollTo(0, 0);
      };
      frame.srcdoc = pages[id];
    }

    window.addEventListener('hashchange', navigate);
    navigate();
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

  <script type="__bundler/template">
{"pages":{"muse Cockpit.dc":"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\n<script src=\"e83356b4-c6fe-4a93-a592-ab493df62424\"><\u002Fscript>\n<\u002Fhead>\n<body>\n\n<x-dc>\n<helmet>\n  <style>/* muse — \"Singularity\" design tokens.\n *\n * One white core in the void; a single thin spectral ring. This is the\n * canonical token source for the browser cockpit and the reference palette\n * for other surfaces (Android theme migration tracked separately).\n *\n * Aligned to design-system/tokens.json. White is the hero; spectral color is a\n * sparing accent (the matte ring). Elevation is TONAL (lift the void tone),\n * never a drop shadow. Hierarchy by VALUE, not effects.\n */\n:root {\n  /* ---- Color: the Singularity palette ---------------------------------- */\n  --void:        #050507; /* background — the dark field, full-bleed always */\n  --void-2:      #0b0d12; /* raised surface (tonal elevation, not a shadow) */\n  --void-3:      #12151d; /* cards (tonal elevation, not a shadow) */\n  --edge:        #1c2030; /* hairline borders */\n  --core:        #ffffff; /* the single point of light — primary accent / hero */\n  --signal:      #e8ecf4; /* primary text */\n  --signal-dim:  #aab2c4; /* secondary text */\n  --signal-mute: #6b7388; /* tertiary text / metadata */\n  --ring-1:      #7ae0ff; /* spectral ring — cyan start stop */\n  --ring-2:      #b388ff; /* spectral ring — violet end stop */\n  --ok:          #5be3a0; /* success / online (UI status — never brand art) */\n  --warn:        #f5c451; /* attention (UI status — never brand art) */\n  --danger:      #ff5c63; /* destructive / emergency stop (UI status only) */\n\n  /* ---- Gradients & lines ----------------------------------------------- */\n  --ring-grad:   linear-gradient(90deg, var(--ring-1), var(--ring-2)); /* left→right cyan→violet */\n\n  /* ---- Elevation (tonal — higher = lighter void tone, NEVER a shadow) -- */\n  --elevation-flat:   var(--void);\n  --elevation-raised: var(--void-2);\n  --elevation-card:   var(--void-3);\n\n  /* ---- Spacing: 4/8 grid ----------------------------------------------- */\n  --space-1:   4px;\n  --space-2:   8px;\n  --space-3:   12px;\n  --space-4:   16px;\n  --space-6:   24px;\n  --space-8:   32px;\n  --space-12:  48px;\n  --space-16:  64px;\n\n  /* ---- Radius ---------------------------------------------------------- */\n  --radius-sm:   8px;\n  --radius-md:   12px;  /* canonical default */\n  --radius-lg:   16px;\n  --radius-pill: 9999px;\n  --radius:      var(--radius-md); /* legacy alias — md is the default */\n\n  /* ---- Type scale ------------------------------------------------------ */\n  --sans: ui-sans-serif, system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif;\n  --mono: ui-monospace, \"SF Mono\", \"JetBrains Mono\", Menlo, Consolas, monospace;\n\n  --type-display-size:    40px;\n  --type-display-weight:  600;\n  --type-display-spacing: -0.5px;\n  --type-display-line:    48px;\n\n  --type-title-size:      22px;\n  --type-title-weight:    600;\n  --type-title-spacing:   -0.2px;\n  --type-title-line:      28px;\n\n  --type-body-size:       15px;\n  --type-body-weight:     400;\n  --type-body-spacing:    0;\n  --type-body-line:       22px;\n\n  --type-label-size:      12px;\n  --type-label-weight:    500;\n  --type-label-spacing:   0.4px;\n  --type-label-line:      16px;\n\n  /* ---- Motion: Material 3 ---------------------------------------------- */\n  --duration-fast:     150ms;\n  --duration-standard: 250ms;\n  --duration-slow:     350ms;\n  --easing-standard:   cubic-bezier(0.2, 0, 0, 1);\n  --easing-emphasized: cubic-bezier(0.05, 0.7, 0.1, 1);\n  --easing-decelerate: cubic-bezier(0, 0, 0, 1);\n}\n<\u002Fstyle>\n  <style>/* muse cockpit — \"Cinematic synthesis\" design system.\n *\n * Single source of styling: reset/base, the cinematic shell (one atmospheric\n * depth pool, core-bloom glyph), sticky header, left nav rail, .view sections,\n * and EVERY component from the catalog. White is the hero; the spectral ring is\n * MATTE (never bloomed/glowed/neon). Elevation is TONAL — no drop shadows.\n * Hierarchy by VALUE. Round line caps everywhere. Spectral color <= ~20%.\n */\n\n/* ======================================================================== *\n * Reset / base\n * ======================================================================== */\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml, body { margin: 0; height: 100%; }\n\nbody {\n  /* The void is the full-bleed field. ONE broad atmospheric depth pool sits\n   * behind the lockup (top-centre) — a single faint cool wash, not a stack. */\n  background:\n    radial-gradient(1100px 560px at 50% -8%,\n      rgba(122, 224, 255, 0.05) 0%,\n      rgba(179, 136, 255, 0.035) 34%,\n      rgba(5, 5, 7, 0) 68%),\n    var(--void);\n  background-attachment: fixed;\n  color: var(--signal);\n  font-family: var(--sans);\n  font-size: var(--type-body-size);\n  font-weight: var(--type-body-weight);\n  line-height: var(--type-body-line);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\na { color: var(--ring-1); text-decoration: none; }\na:hover { text-decoration: underline; }\n\ncode, .mono { font-family: var(--mono); font-size: 12px; }\n\n::selection { background: rgba(122, 224, 255, 0.22); color: var(--core); }\n\n:focus-visible { outline: 2px solid var(--ring-1); outline-offset: 2px; border-radius: 2px; }\n\n.grow { flex: 1 1 auto; }\n.muted { color: var(--signal-mute); }\n\n/* ======================================================================== *\n * The brand glyph + cinematic core bloom\n * --------------------------------------------------------------------------\n * The WHITE CORE blazes via stacked cool-white radial halos (4 radii: tight\n * bright center -> wide faint edge) + one tight high-emissive punch. The ring\n * is MATTE — never touched by the bloom. Deterministic, no filters.\n * ======================================================================== */\n.glyph { position: relative; display: inline-grid; place-items: center; line-height: 0; }\n\n/* The volumetric bloom lives BEHIND the svg, sized to the core only, so the\n * matte ring is never glowed. Layered cool-white radial halos + a core punch. */\n.glyph::before {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  border-radius: 50%;\n  pointer-events: none;\n  background:\n    radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0) 9%),\n    radial-gradient(circle at 50% 50%, rgba(242, 251, 255, 0.55) 0%, rgba(242, 251, 255, 0) 16%),\n    radial-gradient(circle at 50% 50%, rgba(224, 248, 255, 0.30) 0%, rgba(224, 248, 255, 0) 30%),\n    radial-gradient(circle at 50% 50%, rgba(212, 242, 255, 0.16) 0%, rgba(212, 242, 255, 0) 52%);\n}\n.glyph > svg { position: relative; z-index: 1; }\n\n/* The animated spin is allowed ONLY in the live cockpit header. */\n.glyph.spin > svg { transform-origin: 50% 50%; animation: glyph-spin 8.5s linear infinite; }\n@keyframes glyph-spin { to { transform: rotate(360deg); } }\n@media (prefers-reduced-motion: reduce) { .glyph.spin > svg { animation: none; } }\n\n/* ======================================================================== *\n * App shell layout\n * ======================================================================== */\n.app {\n  display: grid;\n  grid-template-columns: 248px 1fr;\n  grid-template-rows: auto 1fr;\n  grid-template-areas:\n    \"header header\"\n    \"nav    main\";\n  min-height: 100vh;\n}\n\n/* ---- Header (sticky) --------------------------------------------------- */\n.app-header {\n  grid-area: header;\n  position: sticky;\n  top: 0;\n  z-index: 20;\n  display: flex;\n  align-items: center;\n  gap: var(--space-4);\n  padding: var(--space-3) var(--space-6);\n  border-bottom: 1px solid var(--edge);\n  background: rgba(5, 5, 7, 0.78);\n  backdrop-filter: blur(10px);\n}\n\n.lockup { display: flex; align-items: center; gap: var(--space-3); min-width: 0; }\n.lockup .wordmark {\n  font-size: var(--type-title-size);\n  font-weight: var(--type-title-weight);\n  letter-spacing: 0.5px;\n  color: var(--core);\n}\n.lockup .expansion {\n  font-size: var(--type-label-size);\n  font-weight: var(--type-label-weight);\n  letter-spacing: var(--type-label-spacing);\n  color: var(--signal-mute);\n}\n\n.header-status { display: flex; align-items: center; gap: var(--space-2); }\n.header-status .status-text { font-size: var(--type-label-size); color: var(--signal-dim); }\n.header-actions { display: flex; align-items: center; gap: var(--space-2); }\n\n/* ---- Left nav rail ----------------------------------------------------- */\n.app-nav {\n  grid-area: nav;\n  position: sticky;\n  top: 57px; /* below the header */\n  align-self: start;\n  height: calc(100vh - 57px);\n  overflow-y: auto;\n  padding: var(--space-4) var(--space-3);\n  border-right: 1px solid var(--edge);\n  background: var(--void);\n  display: flex;\n  flex-direction: column;\n  gap: var(--space-1);\n}\n\n.nav-item {\n  position: relative;\n  display: flex;\n  align-items: center;\n  gap: var(--space-3);\n  width: 100%;\n  padding: var(--space-2) var(--space-3);\n  border: 0;\n  border-radius: var(--radius-sm);\n  background: transparent;\n  color: var(--signal-mute);\n  font: inherit;\n  font-size: var(--type-body-size);\n  text-align: left;\n  cursor: pointer;\n  transition: color var(--duration-fast) var(--easing-standard),\n              background-color var(--duration-fast) var(--easing-standard);\n}\n.nav-item:hover { color: var(--signal); background: var(--void-2); }\n.nav-item.active { color: var(--signal); background: var(--void-2); }\n/* Active marker: a thin MATTE ring-grad accent bar (no glow). */\n.nav-item.active::before {\n  content: \"\";\n  position: absolute;\n  left: 0;\n  top: 50%;\n  transform: translateY(-50%);\n  width: 3px;\n  height: 18px;\n  border-radius: var(--radius-pill);\n  background: var(--ring-grad);\n}\n.nav-item .nav-ext { margin-left: auto; color: var(--signal-mute); font-size: 11px; }\n\n/* ---- Main + view sections --------------------------------------------- */\n.app-main {\n  grid-area: main;\n  min-width: 0;\n  padding: var(--space-6);\n}\n\n.view { display: none; max-width: 980px; margin: 0 auto; }\n.view.active { display: block; }\n\n/* ======================================================================== *\n * Component catalog\n * ======================================================================== */\n\n/* ---- Button ------------------------------------------------------------ */\n.btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: var(--space-2);\n  padding: var(--space-3) var(--space-2);\n  border: 1px solid transparent;\n  border-radius: var(--radius-md);\n  background: transparent;\n  color: var(--signal);\n  font-family: var(--sans);\n  font-size: var(--type-label-size);\n  font-weight: var(--type-label-weight);\n  letter-spacing: var(--type-label-spacing);\n  line-height: var(--type-label-line);\n  cursor: pointer;\n  transition: background-color var(--duration-fast) var(--easing-standard),\n              border-color var(--duration-fast) var(--easing-standard),\n              color var(--duration-fast) var(--easing-standard),\n              transform var(--duration-fast) var(--easing-standard);\n}\n.btn:focus-visible { outline: 2px solid var(--ring-1); outline-offset: 2px; }\n.btn:disabled { opacity: 0.4; cursor: not-allowed; }\n.btn:active:not(:disabled) { transform: scale(0.98); }\n\n/* Primary — core fill, void text (the single bright control). */\n.btn.primary { background: var(--core); color: var(--void); border-color: var(--core); }\n.btn.primary:hover:not(:disabled) { background: #f2fbff; border-color: #f2fbff; }\n\n/* Secondary — 1px edge + signal text, tonal fill on interaction. */\n.btn.secondary { border-color: var(--edge); color: var(--signal); }\n.btn.secondary:hover:not(:disabled) { background: var(--void-2); }\n.btn.secondary:active:not(:disabled) { background: var(--void-3); }\n\n/* Ghost — transparent + signal-dim, lifts on interaction. */\n.btn.ghost { color: var(--signal-dim); }\n.btn.ghost:hover:not(:disabled) { color: var(--signal); background: var(--void-2); }\n.btn.ghost:active:not(:disabled) { background: var(--void-3); }\n\n/* Danger — danger text + danger border, tinted fill on interaction. */\n.btn.danger { color: var(--danger); border-color: var(--danger); }\n.btn.danger:hover:not(:disabled) { background: rgba(255, 92, 99, 0.12); }\n.btn.danger:active:not(:disabled) { background: rgba(255, 92, 99, 0.20); }\n\n/* ---- Card -------------------------------------------------------------- */\n.card {\n  background: var(--void-3);          /* elevation-card tonal overlay */\n  border: 1px solid var(--edge);\n  border-radius: var(--radius-md);\n  padding: var(--space-4);\n}\n.card + .card { margin-top: var(--space-3); }\n.card.interactive { transition: background-color var(--duration-fast) var(--easing-standard); }\n.card.interactive:hover { background: var(--void-2); }\n\n/* ---- Chip / StatusPill ------------------------------------------------- */\n.pill {\n  display: inline-flex;\n  align-items: center;\n  gap: var(--space-1);\n  padding: var(--space-1) var(--space-2);\n  border: 1px solid transparent;\n  border-radius: var(--radius-pill);\n  font-size: var(--type-label-size);\n  font-weight: var(--type-label-weight);\n  letter-spacing: var(--type-label-spacing);\n  line-height: var(--type-label-line);\n  white-space: nowrap;\n}\n.pill.neutral { background: var(--void-2); border-color: var(--edge); color: var(--signal-dim); }\n.pill.ok      { background: rgba(91, 227, 160, 0.14); color: var(--ok); }\n.pill.warn    { background: rgba(245, 196, 81, 0.14); color: var(--warn); }\n.pill.danger  { background: rgba(255, 92, 99, 0.14); color: var(--danger); }\n.pill.accent  { background: rgba(122, 224, 255, 0.14); color: var(--ring-1); }\n/* Selected filter chip inverts to a Primary at pill radius. */\n.pill.selected { background: var(--core); color: var(--void); border-color: var(--core); }\n\n/* ---- StatusDot --------------------------------------------------------- */\n.dot {\n  display: inline-block;\n  width: var(--space-2);\n  height: var(--space-2);\n  border-radius: 50%;\n  background: var(--signal-mute);   /* idle / disconnected default */\n  flex: none;\n}\n.dot.ok     { background: var(--ok); }\n.dot.warn   { background: var(--warn); }\n.dot.danger { background: var(--danger); }\n.dot.off    { background: var(--signal-mute); }\n.dot.live   { background: var(--ring-1); animation: dot-pulse var(--duration-slow) var(--easing-standard) infinite alternate; }\n@keyframes dot-pulse { from { opacity: 1; } to { opacity: 0.4; } }\n@media (prefers-reduced-motion: reduce) { .dot.live { animation: none; } }\n\n/* ---- PhaseRail --------------------------------------------------------- */\n.phaserail { display: flex; flex-direction: column; gap: var(--space-2); }\n.phaserail .segments { display: flex; align-items: stretch; gap: var(--space-2); }\n.phaserail .phase { flex: 1 1 0; display: flex; flex-direction: column; gap: var(--space-1); min-width: 0; }\n.phaserail .bar {\n  height: 4px;\n  border-radius: var(--radius-pill);\n  background: var(--edge);            /* pending */\n}\n.phaserail .label {\n  font-size: var(--type-label-size);\n  font-weight: var(--type-label-weight);\n  letter-spacing: var(--type-label-spacing);\n  color: var(--signal-mute);\n  white-space: nowrap;\n  overflow: hidden;\n  text-overflow: ellipsis;\n}\n.phaserail .phase.done .bar    { background: var(--ring-1); }\n.phaserail .phase.active .bar  { background: var(--ring-grad); background-size: 200% 100%; animation: rail-shimmer 1.6s var(--easing-decelerate) infinite; }\n.phaserail .phase.failed .bar  { background: var(--danger); }\n.phaserail .phase.active .label,\n.phaserail .phase.done .label  { color: var(--signal); }\n@keyframes rail-shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }\n@media (prefers-reduced-motion: reduce) { .phaserail .phase.active .bar { animation: none; } }\n\n/* ---- EmptyState -------------------------------------------------------- */\n.empty {\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: var(--space-6);\n  text-align: center;\n  padding: var(--space-16) var(--space-6);\n}\n.empty .glyph { opacity: 0.5; }   /* dimmed glyph, no spin */\n.empty .empty-title {\n  font-size: var(--type-title-size);\n  font-weight: var(--type-title-weight);\n  letter-spacing: var(--type-title-spacing);\n  line-height: var(--type-title-line);\n  color: var(--signal);\n  margin: 0;\n}\n.empty .empty-body {\n  font-size: var(--type-body-size);\n  line-height: var(--type-body-line);\n  color: var(--signal-dim);\n  margin: 0;\n  max-width: 42ch;\n}\n\n/* ---- SectionHeader ----------------------------------------------------- */\n.section-header {\n  display: flex;\n  align-items: flex-end;\n  gap: var(--space-3);\n  padding-bottom: var(--space-3);\n  margin: var(--space-4) 0 var(--space-4);\n  border-bottom: 1px solid var(--edge);\n}\n.section-header .heads { display: flex; flex-direction: column; gap: var(--space-1); min-width: 0; }\n.section-header .eyebrow {\n  font-size: var(--type-label-size);\n  font-weight: var(--type-label-weight);\n  letter-spacing: var(--type-label-spacing);\n  text-transform: uppercase;\n  color: var(--signal-mute);\n}\n.section-header .section-title {\n  font-size: var(--type-title-size);\n  font-weight: var(--type-title-weight);\n  letter-spacing: var(--type-title-spacing);\n  line-height: var(--type-title-line);\n  color: var(--signal);\n  margin: 0;\n}\n.section-header .trailing { margin-left: auto; display: flex; align-items: center; gap: var(--space-2); }\n\n/* ======================================================================== *\n * Form controls (shared field styling for view modules)\n * ======================================================================== */\n.field {\n  width: 100%;\n  font: inherit;\n  font-size: var(--type-body-size);\n  color: var(--signal);\n  background: var(--void-2);\n  border: 1px solid var(--edge);\n  border-radius: var(--radius-sm);\n  padding: var(--space-3);\n}\n.field::placeholder { color: var(--signal-mute); }\n.field:focus-visible { outline: none; border-color: var(--ring-1); }\ntextarea.field { resize: vertical; }\n\n/* ======================================================================== *\n * Dialogs + banners\n * ======================================================================== */\ndialog {\n  background: var(--void-3);\n  color: var(--signal);\n  border: 1px solid var(--edge);\n  border-radius: var(--radius-md);\n  padding: var(--space-6);\n  max-width: 460px;\n  width: calc(100vw - var(--space-8));\n}\ndialog::backdrop { background: rgba(0, 0, 0, 0.6); }\ndialog h3 { margin: 0 0 var(--space-3); font-size: var(--type-title-size); font-weight: var(--type-title-weight); }\ndialog label { display: block; font-size: var(--type-label-size); color: var(--signal-mute); margin-bottom: var(--space-1); }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-4); }\n.hint { color: var(--signal-mute); font-size: var(--type-label-size); margin-top: var(--space-2); }\n.row { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }\n\n.banner {\n  display: none;\n  align-items: center;\n  gap: var(--space-3);\n  flex-wrap: wrap;\n  margin: var(--space-3) var(--space-6) 0;\n  padding: var(--space-3) var(--space-4);\n  border-radius: var(--radius-md);\n}\n.banner.show { display: flex; }\n.banner.offline { background: rgba(255, 92, 99, 0.08); border: 1px solid var(--danger); color: #ffd7d9; }\n.banner.pair    { background: var(--void-2); border: 1px solid var(--edge); color: var(--signal); }\n\n/* ======================================================================== *\n * Responsive — collapse the rail to a horizontal strip on narrow viewports\n * ======================================================================== */\n@media (max-width: 760px) {\n  .app {\n    grid-template-columns: 1fr;\n    grid-template-areas:\n      \"header\"\n      \"nav\"\n      \"main\";\n  }\n  .app-nav {\n    position: static;\n    height: auto;\n    flex-direction: row;\n    flex-wrap: wrap;\n    border-right: 0;\n    border-bottom: 1px solid var(--edge);\n  }\n  .nav-item { width: auto; }\n  .nav-item.active::before { display: none; }\n  .nav-item.active { box-shadow: inset 0 -2px 0 0 var(--ring-1); }\n}\n\n/* =====================================================================\n   GLOBAL 3D / AAA POLISH  — depth, glass, parallax-ready, tactile motion\n   (Intentionally overrides the flat tonal baseline above.)\n   ===================================================================== */\nbody { perspective: 1800px; }\n.app { transform-style: preserve-3d; forced-color-adjust: none; }\n\n/* Kill native widget chrome so authored dark styling is honored everywhere */\n.app button, .app input, .btn, .nav-item, .field {\n  -webkit-appearance: none;\n  appearance: none;\n}\n\n/* Floating glass header */\n.app-header {\n  background: linear-gradient(180deg, rgba(15,18,25,0.99) 0%, rgba(10,12,17,0.975) 100%);\n  -webkit-backdrop-filter: blur(16px) saturate(1.15);\n  backdrop-filter: blur(16px) saturate(1.15);\n  border-bottom: 1px solid rgba(255,255,255,0.06);\n  box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 22px 48px -30px rgba(0,0,0,0.95);\n}\n\n/* Obsidian-glass cards with real depth */\n.card {\n  background: linear-gradient(162deg, rgba(21,25,34,0.90) 0%, rgba(13,16,22,0.84) 100%);\n  border: 1px solid rgba(255,255,255,0.055);\n  -webkit-backdrop-filter: blur(7px);\n  backdrop-filter: blur(7px);\n  box-shadow:\n    inset 0 1px 0 rgba(255,255,255,0.06),\n    0 2px 6px -3px rgba(0,0,0,0.55),\n    0 26px 50px -34px rgba(0,0,0,0.95);\n  transition: transform .45s cubic-bezier(.2,0,0,1),\n              box-shadow .45s cubic-bezier(.2,0,0,1),\n              border-color .3s var(--easing-standard);\n}\n.card.interactive { cursor: pointer; }\n.card.interactive:hover {\n  transform: translateY(-4px) scale(1.006);\n  border-color: rgba(122,224,255,0.24);\n  box-shadow:\n    inset 0 1px 0 rgba(255,255,255,0.10),\n    0 2px 6px -3px rgba(0,0,0,0.5),\n    0 36px 64px -34px rgba(0,0,0,0.95),\n    0 0 0 1px rgba(122,224,255,0.10),\n    0 0 46px -14px rgba(122,224,255,0.20);\n}\n\n/* Nav rail — depth + glide + spectral active wash */\n.nav-item { transition: color .15s, background-color .2s, transform .2s var(--easing-standard), box-shadow .25s; }\n.nav-item:hover { transform: translateX(3px); }\n.nav-item.active {\n  background: linear-gradient(90deg, rgba(122,224,255,0.12) 0%, rgba(179,136,255,0.05) 60%, rgba(179,136,255,0) 100%);\n  box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 12px 26px -20px rgba(122,224,255,0.55);\n}\n\n/* Tactile buttons */\n.btn { transition: transform .15s cubic-bezier(.2,0,0,1), box-shadow .22s, filter .2s, background-color .2s; }\n.btn:hover { transform: translateY(-1.5px); }\n.btn:active { transform: translateY(0) scale(.975); }\n.btn.primary {\n  box-shadow: inset 0 1px 0 rgba(255,255,255,0.55), 0 10px 24px -12px rgba(255,255,255,0.30);\n}\n.btn.primary:hover { box-shadow: inset 0 1px 0 rgba(255,255,255,0.65), 0 16px 32px -12px rgba(255,255,255,0.42); }\n.btn.secondary:hover { box-shadow: 0 0 0 1px rgba(122,224,255,0.18), 0 12px 26px -16px rgba(122,224,255,0.3); }\n.btn.danger:hover { box-shadow: 0 0 26px -8px rgba(255,92,99,0.5); }\n\n/* Glassy pills + glow on accents */\n.pill { -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }\n.pill.accent { box-shadow: 0 0 20px -9px rgba(122,224,255,0.55); }\n.pill.ok { box-shadow: 0 0 20px -9px rgba(91,227,160,0.5); }\n\n/* Phase-rail bars glow with their state */\n.phaserail .bar { box-shadow: 0 0 12px -3px currentColor; }\n\n/* Inset, focus-glowing input */\n.field {\n  background: linear-gradient(180deg, rgba(8,9,13,0.92), rgba(13,16,22,0.82));\n  box-shadow: inset 0 2px 6px rgba(0,0,0,0.45);\n  transition: box-shadow .22s, border-color .22s;\n}\n.field:focus {\n  box-shadow: inset 0 2px 6px rgba(0,0,0,0.45), 0 0 0 1px rgba(122,224,255,0.32), 0 0 24px -10px rgba(122,224,255,0.45);\n}\n\n/* Depth on titles + the glyph */\n.section-title { text-shadow: 0 2px 20px rgba(0,0,0,0.55); }\n.lockup .glyph { filter: drop-shadow(0 0 10px rgba(122,224,255,0.35)); }\n\n@media (prefers-reduced-motion: reduce) {\n  .card.interactive:hover, .nav-item:hover, .btn:hover, .btn:active { transform: none; }\n}\n<\u002Fstyle>\n  <style>\n    :root, html, body { color-scheme: dark; }\n    @keyframes cockpitBootExit { to { opacity: 0; transform: scale(1.05); } }\n    @keyframes cockpitViewEnter { from { transform: translateY(12px); } to { transform: none; } }\n    @keyframes cockpitBootGlyphIn { from { opacity: 0; transform: scale(0.55); } to { opacity: 1; transform: scale(1); } }\n    @keyframes cockpitBootSweep { from { transform: translateX(-120%); } to { transform: translateX(120%); } }\n    @keyframes cockpitBootText { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }\n    @keyframes cockpitGrain {\n      0% { transform: translate(0, 0); } 20% { transform: translate(-6%, 4%); }\n      40% { transform: translate(4%, -5%); } 60% { transform: translate(-3%, 6%); }\n      80% { transform: translate(5%, 3%); } 100% { transform: translate(0, 0); }\n    }\n    @keyframes cockpitScan { to { transform: translateY(50%); } }\n    @keyframes cockpitFadeIn { from { opacity: 0; } to { opacity: 1; } }\n    @media (prefers-reduced-motion: reduce) {\n      [style*=\"cockpitGrain\"], [style*=\"cockpitScan\"] { animation: none !important; }\n    }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<!-- ===== Ambient atmosphere (fixed, tonal, behind the cockpit) ===== -->\n<canvas data-bg=\"cockpit-bg\" style=\"position:fixed; inset:0; z-index:0; width:100%; height:100%; pointer-events:none; opacity:0.6; transform:scale(1.08); transition:transform .4s ease-out; will-change:transform;\"><\u002Fcanvas>\n<div style=\"position:fixed; inset:0; z-index:0; pointer-events:none; background:radial-gradient(120% 80% at 50% 50%, rgba(0,0,0,0) 52%, rgba(0,0,0,0.45) 100%);\"><\u002Fdiv>\n<div style=\"position:fixed; inset:-40% 0; z-index:1; pointer-events:none; opacity:0.045; mix-blend-mode:screen; background-image:url('data:image/svg+xml;utf8,&lt;svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22160%22 height=%22160%22&gt;&lt;filter id=%22n%22&gt;&lt;feTurbulence type=%22fractalNoise%22 baseFrequency=%220.9%22 numOctaves=%222%22 stitchTiles=%22stitch%22/&gt;&lt;/filter&gt;&lt;rect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23n)%22/&gt;&lt;/svg&gt;'); background-size:200px 200px; animation:cockpitGrain 7s steps(6) infinite;\"><\u002Fdiv>\n<div style=\"position:fixed; inset:0; z-index:1; pointer-events:none; opacity:0.025; background:repeating-linear-gradient(0deg, rgba(255,255,255,0.7) 0, rgba(255,255,255,0.7) 1px, transparent 1px, transparent 3px); height:200%; animation:cockpitScan 9s linear infinite;\"><\u002Fdiv>\n\n<!-- ===== Ignition / boot sequence ===== -->\n<sc-if value=\"{{ bootActive }}\" hint-placeholder-val=\"{{ true }}\">\n  <div onanimationend=\"{{ onBootExitEnd }}\" style=\"position:fixed; inset:0; z-index:200; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px; background:radial-gradient(900px 520px at 50% 42%, rgba(122,224,255,0.06) 0%, rgba(179,136,255,0.04) 34%, rgba(5,5,7,0) 70%), rgba(5,5,7,0.8); animation:cockpitBootExit 620ms var(--easing-standard) 1850ms forwards;\">\n    <span class=\"glyph spin\" style=\"animation:cockpitBootGlyphIn 900ms cubic-bezier(0.05,0.7,0.1,1) both;\">\n      <svg viewBox=\"0 0 48 48\" width=\"86\" height=\"86\" aria-label=\"muse\">\n        <defs><linearGradient id=\"boot-ring\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"0\"><stop offset=\"0\" stop-color=\"#7ae0ff\"><\u002Fstop><stop offset=\"1\" stop-color=\"#b388ff\"><\u002Fstop><\u002FlinearGradient><\u002Fdefs>\n        <g transform=\"rotate(-32 24 24)\"><circle cx=\"24\" cy=\"24\" r=\"15\" fill=\"none\" stroke=\"url(#boot-ring)\" stroke-width=\"1.6\" stroke-dasharray=\"66 28\" stroke-linecap=\"round\"><\u002Fcircle><\u002Fg>\n        <circle cx=\"24\" cy=\"24\" r=\"3.1\" fill=\"#ffffff\"><\u002Fcircle>\n      <\u002Fsvg>\n    <\u002Fspan>\n    <div style=\"display:flex; align-items:baseline; gap:12px;\">\n      <span style=\"font-family:var(--sans); font-size:30px; font-weight:600; letter-spacing:1px; color:var(--core);\">muse<\u002Fspan>\n      <span style=\"font-size:var(--type-label-size); font-weight:500; letter-spacing:0.4px; text-transform:uppercase; color:var(--signal-mute);\">Multi-Use Synaptic Entity<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"position:relative; width:280px; height:2px; border-radius:9999px; overflow:hidden; background:var(--edge);\">\n      <div style=\"position:absolute; inset:0; width:45%; background:var(--ring-grad); border-radius:9999px; animation:cockpitBootSweep 1100ms cubic-bezier(0.2,0,0,1) infinite;\"><\u002Fdiv>\n    <\u002Fdiv>\n    <span style=\"font-family:var(--mono); font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--signal-dim); animation:cockpitBootText 1400ms ease-in-out infinite;\">Getting things ready<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ===== The cockpit ===== -->\n<div class=\"app\" style=\"position:relative; z-index:2;\">\n\n  <!-- Header -->\n  <header class=\"app-header\">\n    <span class=\"lockup\">\n      <span class=\"glyph spin\" style=\"position:relative;\">\n        <span style=\"position:absolute; inset:-14px; border-radius:50%; pointer-events:none; background:radial-gradient(circle at 50% 50%, rgba(122,224,255,0.10) 0%, rgba(122,224,255,0) 70%);\"><\u002Fspan>\n        <svg viewBox=\"0 0 48 48\" width=\"30\" height=\"30\" aria-label=\"muse\">\n          <defs><linearGradient id=\"hdr-ring\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"0\"><stop offset=\"0\" stop-color=\"#7ae0ff\"><\u002Fstop><stop offset=\"1\" stop-color=\"#b388ff\"><\u002Fstop><\u002FlinearGradient><\u002Fdefs>\n          <g transform=\"rotate(-32 24 24)\"><circle cx=\"24\" cy=\"24\" r=\"15\" fill=\"none\" stroke=\"url(#hdr-ring)\" stroke-width=\"1.6\" stroke-dasharray=\"66 28\" stroke-linecap=\"round\"><\u002Fcircle><\u002Fg>\n          <circle cx=\"24\" cy=\"24\" r=\"3.1\" fill=\"#ffffff\"><\u002Fcircle>\n        <\u002Fsvg>\n      <\u002Fspan>\n      <span class=\"wordmark\">muse<\u002Fspan>\n      <span class=\"expansion\">Multi-Use Synaptic Entity<\u002Fspan>\n    <\u002Fspan>\n\n    <span class=\"grow\"><\u002Fspan>\n\n    <div style=\"display:flex; align-items:center; gap:20px; margin-right:8px;\">\n      <div style=\"display:flex; flex-direction:column; align-items:flex-end; line-height:1.1;\">\n        <span style=\"font-family:var(--mono); font-size:13px; color:var(--signal);\">{{ telemetry.uptime }}<\u002Fspan>\n        <span style=\"font-size:10px; letter-spacing:0.6px; text-transform:uppercase; color:var(--signal-mute);\">running for<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"width:1px; height:24px; background:var(--edge);\"><\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; align-items:flex-end; line-height:1.1;\">\n        <span style=\"font-family:var(--mono); font-size:13px; color:var(--signal);\">{{ telemetry.latency }}<span style=\"color:var(--signal-mute); font-size:10px;\"> ms<\u002Fspan><\u002Fspan>\n        <span style=\"font-size:10px; letter-spacing:0.6px; text-transform:uppercase; color:var(--signal-mute);\">response time<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"width:1px; height:24px; background:var(--edge);\"><\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; align-items:flex-end; line-height:1.1;\">\n        <span style=\"font-family:var(--mono); font-size:13px; color:var(--signal);\">{{ telemetry.tps }}<span style=\"color:var(--signal-mute); font-size:10px;\"> words/s<\u002Fspan><\u002Fspan>\n        <span style=\"font-size:10px; letter-spacing:0.6px; text-transform:uppercase; color:var(--signal-mute);\">speed<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <span class=\"header-status\">\n      <span class=\"{{ conn.dotCls }}\"><\u002Fspan>\n      <span class=\"status-text\">{{ conn.label }}<\u002Fspan>\n    <\u002Fspan>\n    <span class=\"header-actions\">\n      <button type=\"button\" class=\"btn secondary\" onclick=\"{{ onToggleAudio }}\" title=\"Turn interface sounds on or off\">{{ audioLabel }}<\u002Fbutton>\n      <button type=\"button\" class=\"btn secondary\" onclick=\"{{ onResetAll }}\" title=\"Undo all your changes across the cockpit\">Reset<\u002Fbutton>\n      <button type=\"button\" class=\"btn secondary\" onclick=\"{{ onToken }}\" title=\"Connect a device\">Connect<\u002Fbutton>\n      <button type=\"button\" class=\"{{ stopBtnCls }}\" onclick=\"{{ onEmergency }}\" title=\"Pause everything and switch to view-only\">{{ stopLabel }}<\u002Fbutton>\n    <\u002Fspan>\n  <\u002Fheader>\n\n  <!-- ===== Connection panel (real gateway pairing) ===== -->\n  <sc-if value=\"{{ conn2.open }}\" hint-placeholder-val=\"{{ false }}\">\n    <div onclick=\"{{ conn2.onClose }}\" style=\"position:fixed; inset:0; z-index:180; background:rgba(4,5,9,0.66); backdrop-filter:blur(8px); display:flex; align-items:flex-start; justify-content:center; padding:72px 20px;\">\n      <div onclick=\"{{ stop }}\" style=\"width:520px; max-width:100%; max-height:84vh; overflow-y:auto; background:linear-gradient(180deg, var(--void-2), var(--void)); border:1px solid var(--edge); border-radius:var(--radius-lg); box-shadow:0 28px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(120,180,255,0.06); padding:24px 24px 22px;\">\n        <div style=\"display:flex; align-items:flex-start; gap:12px; margin-bottom:4px;\">\n          <span class=\"glyph\" style=\"flex:none; margin-top:2px;\"><svg viewBox=\"0 0 48 48\" width=\"30\" height=\"30\" aria-hidden=\"true\"><circle cx=\"24\" cy=\"24\" r=\"6\" fill=\"#fff\"><\u002Fcircle><circle cx=\"24\" cy=\"24\" r=\"14\" fill=\"none\" stroke=\"var(--ring-1)\" stroke-width=\"1.2\" opacity=\"0.7\"><\u002Fcircle><circle cx=\"24\" cy=\"24\" r=\"21\" fill=\"none\" stroke=\"var(--ring-2)\" stroke-width=\"0.8\" opacity=\"0.4\"><\u002Fcircle><\u002Fsvg><\u002Fspan>\n          <div style=\"flex:1;\">\n            <div style=\"font-size:var(--type-title-size); font-weight:600; color:var(--signal); line-height:1.2;\">Connect to your muse<\u002Fdiv>\n            <div style=\"font-size:12px; color:var(--signal-dim); margin-top:3px; line-height:1.5;\">Pair this cockpit with the muse gateway running on your machine. It talks only to your own local gateway — no keys leave your device.<\u002Fdiv>\n          <\u002Fdiv>\n          <button type=\"button\" onclick=\"{{ conn2.onClose }}\" class=\"btn secondary\" style=\"flex:none; padding:5px 10px;\">Close<\u002Fbutton>\n        <\u002Fdiv>\n\n        <!-- Gateway address -->\n        <div style=\"margin-top:18px;\">\n          <div style=\"font-size:10px; letter-spacing:0.09em; text-transform:uppercase; color:var(--signal-mute); margin-bottom:7px;\">Gateway address<\u002Fdiv>\n          <div style=\"display:flex; gap:8px;\">\n            <input type=\"text\" value=\"{{ conn2.url }}\" oninput=\"{{ conn2.onUrl }}\" placeholder=\"{{ conn2.placeholder }}\" spellcheck=\"false\" style=\"flex:1; font-family:var(--mono); font-size:13px; color:var(--signal); background:var(--void-3); border:1px solid var(--edge); border-radius:var(--radius-md); padding:9px 11px; outline:none;\" style-focus=\"border-color:var(--ring-1);\">\n            <button type=\"button\" onclick=\"{{ conn2.onCheck }}\" class=\"btn primary\" style=\"flex:none;\">Check<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Health result -->\n        <sc-if value=\"{{ conn2.hasInfo }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:12px; border:1px solid var(--edge); border-radius:var(--radius-md); padding:11px 13px; background:var(--void-3); display:flex; flex-direction:column; gap:6px;\">\n            <div style=\"display:flex; align-items:center; gap:8px;\"><span class=\"dot live\"><\u002Fspan><span style=\"font-size:12px; font-weight:600; color:var(--signal);\">Gateway reachable<\u002Fspan><span class=\"pill ok\" style=\"margin-left:auto; font-size:10px;\">{{ conn2.info.service }}<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex; gap:18px; font-size:11px; color:var(--signal-dim); font-family:var(--mono);\">\n              <span>API {{ conn2.info.api }}<\u002Fspan><span>gateway {{ conn2.info.ver }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- Pairing: begin -->\n        <sc-if value=\"{{ conn2.isReachable }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:16px;\">\n            <div style=\"font-size:10px; letter-spacing:0.09em; text-transform:uppercase; color:var(--signal-mute); margin-bottom:7px;\">Pair this device<\u002Fdiv>\n            <div style=\"display:flex; gap:8px;\">\n              <input type=\"text\" value=\"{{ conn2.deviceName }}\" oninput=\"{{ conn2.onDeviceName }}\" placeholder=\"Name this device (e.g. Studio Mac)\" style=\"flex:1; font-size:13px; color:var(--signal); background:var(--void-3); border:1px solid var(--edge); border-radius:var(--radius-md); padding:9px 11px; outline:none;\" style-focus=\"border-color:var(--ring-1);\">\n              <button type=\"button\" onclick=\"{{ conn2.onStartPair }}\" class=\"btn primary\" style=\"flex:none;\">Get code<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- Pairing: confirm -->\n        <sc-if value=\"{{ conn2.isConfirm }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:16px; border:1px solid var(--ring-1); border-radius:var(--radius-md); padding:14px; background:linear-gradient(180deg, rgba(120,180,255,0.07), rgba(120,180,255,0));\">\n            <div style=\"display:flex; align-items:center; gap:8px; margin-bottom:10px;\">\n              <span style=\"font-size:12px; font-weight:600; color:var(--signal);\">Pairing code<\u002Fspan>\n              <span style=\"margin-left:auto; font-size:11px; color:var(--signal-mute); font-family:var(--mono);\">{{ conn2.pairExpiresIn }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex; gap:6px; margin-bottom:14px;\">\n              <sc-for list=\"{{ conn2.pairCodeChars }}\" as=\"c\" hint-placeholder-count=\"8\">\n                <span style=\"flex:1; text-align:center; font-family:var(--mono); font-size:20px; font-weight:600; letter-spacing:0.04em; color:var(--ring-1); background:var(--void-3); border:1px solid var(--edge); border-radius:var(--radius-sm); padding:9px 0;\">{{ c }}<\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"font-size:12px; color:var(--signal-dim); line-height:1.5; margin-bottom:9px;\">To authorize this device, type the owner phrase exactly:<br><span style=\"font-family:var(--mono); color:var(--signal);\">{{ conn2.ownerPhrase }}<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex; gap:8px;\">\n              <input type=\"text\" value=\"{{ conn2.phrase }}\" oninput=\"{{ conn2.onPhrase }}\" placeholder=\"Owner authorization phrase\" style=\"flex:1; font-size:13px; color:var(--signal); background:var(--void-3); border:1px solid var(--edge); border-radius:var(--radius-md); padding:9px 11px; outline:none;\" style-focus=\"border-color:var(--ring-1);\">\n              <button type=\"button\" onclick=\"{{ conn2.onConfirm }}\" class=\"btn primary\" style=\"flex:none;\">Pair<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- Connected -->\n        <sc-if value=\"{{ conn2.isConnected }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:16px; border:1px solid var(--edge); border-radius:var(--radius-md); padding:14px; background:var(--void-3);\">\n            <div style=\"display:flex; align-items:center; gap:8px; margin-bottom:10px;\">\n              <span class=\"dot live\"><\u002Fspan><span style=\"font-size:13px; font-weight:600; color:var(--signal);\">Paired &amp; live<\u002Fspan>\n              <span class=\"pill ok\" style=\"margin-left:auto; font-size:10px;\">LIVE<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-size:11px; color:var(--signal-mute); font-family:var(--mono); margin-bottom:12px;\">device {{ conn2.deviceId }}<\u002Fdiv>\n            <sc-if value=\"{{ conn2.hasRuntime }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:9px 16px; padding:11px 0; border-top:1px solid var(--edge); border-bottom:1px solid var(--edge); margin-bottom:12px;\">\n                <div style=\"display:flex; flex-direction:column; gap:2px;\"><span style=\"font-size:10px; color:var(--signal-mute); text-transform:uppercase; letter-spacing:0.06em;\">Host<\u002Fspan><span style=\"font-size:12px; color:var(--signal); font-family:var(--mono);\">{{ conn2.runtime.hostname }}<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex; flex-direction:column; gap:2px;\"><span style=\"font-size:10px; color:var(--signal-mute); text-transform:uppercase; letter-spacing:0.06em;\">Platform<\u002Fspan><span style=\"font-size:12px; color:var(--signal); font-family:var(--mono);\">{{ conn2.runtime.platform }} · {{ conn2.runtime.arch }}<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex; flex-direction:column; gap:2px;\"><span style=\"font-size:10px; color:var(--signal-mute); text-transform:uppercase; letter-spacing:0.06em;\">Gateway<\u002Fspan><span style=\"font-size:12px; color:var(--signal); font-family:var(--mono);\">v{{ conn2.runtime.ver }} · {{ conn2.runtime.mode }}<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex; flex-direction:column; gap:2px;\"><span style=\"font-size:10px; color:var(--signal-mute); text-transform:uppercase; letter-spacing:0.06em;\">Queue<\u002Fspan><span style=\"font-size:12px; color:var(--signal); font-family:var(--mono);\">{{ conn2.runtime.running }} running · {{ conn2.runtime.queued }} queued<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"display:flex; gap:8px;\">\n              <button type=\"button\" onclick=\"{{ conn2.onRefresh }}\" class=\"btn secondary\" style=\"flex:1;\">Refresh live data<\u002Fbutton>\n              <button type=\"button\" onclick=\"{{ conn2.onDisconnect }}\" class=\"btn danger\" style=\"flex:none;\">Disconnect<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- Error -->\n        <sc-if value=\"{{ conn2.hasError }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:14px; border:1px solid var(--danger); border-radius:var(--radius-md); padding:11px 13px; background:rgba(255,90,90,0.06); display:flex; gap:9px; align-items:flex-start;\">\n            <span class=\"dot danger\" style=\"flex:none; margin-top:5px;\"><\u002Fspan>\n            <span style=\"font-size:12px; color:var(--signal-dim); line-height:1.5;\">{{ conn2.error }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"margin-top:16px; font-size:11px; color:var(--signal-mute); line-height:1.55; border-top:1px solid var(--edge); padding-top:12px;\">Endpoints follow the real cockpit API — <span style=\"font-family:var(--mono);\">/v1/health<\u002Fspan>, <span style=\"font-family:var(--mono);\">/v1/cockpit/pair/start<\u002Fspan>, <span style=\"font-family:var(--mono);\">/pair/confirm<\u002Fspan>, then bearer-token calls v class=\"section-header\" style=\"margin-top:0;\">\n          <div class=\"heads\"><span class=\"eyebrow\">What muse is doing<\u002Fspan><h2 class=\"section-title\">Active tasks<\u002Fh2><\u002Fdiv>\n          <div class=\"trailing\">\n            <div style=\"display:flex; align-items:center; gap:2px; padding:3px; border:1px solid var(--edge); border-radius:var(--radius-pill); margin-right:4px;\">\n              <button type=\"button\" onclick=\"{{ onLayoutCards }}\" style=\"{{ layoutCardsStyle }}\">Cards<\u002Fbutton>\n              <button type=\"button\" onclick=\"{{ onLayoutStream }}\" style=\"{{ layoutStreamStyle }}\">List<\u002Fbutton>\n            <\u002Fdiv>\n            <span class=\"pill accent\">{{ runningLabel }}<\u002Fspan>\n            <button type=\"button\" class=\"btn primary\" onclick=\"{{ onNewJob }}\">New task<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Layout A: cards -->\n        <sc-if value=\"{{ jobsCards }}\" hint-placeholder-val=\"{{ true }}\">\n          <div>\n            <sc-for list=\"{{ jobs }}\" as=\"job\" hint-placeholder-count=\"4\">\n              <div class=\"card interactive\" style=\"margin-top:12px;\">\n                <div style=\"display:flex; align-items:flex-start; gap:12px; margin-bottom:16px;\">\n                  <div style=\"display:grid; gap:4px; min-width:0;\">\n                    <span style=\"font-size:var(--type-body-size); font-weight:600; color:var(--signal);\">{{ job.title }}<\u002Fspan>\n                    <span class=\"mono\" style=\"font-size:var(--type-label-size); color:var(--signal-mute);\">{{ job.sub }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"margin-left:auto; display:flex; align-items:center; gap:8px;\">\n                    <span class=\"{{ job.dotCls }}\"><\u002Fspan>\n                    <span class=\"{{ job.statusCls }}\">{{ job.statusLabel }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div class=\"phaserail\">\n                  <div class=\"segments\">\n                    <sc-for list=\"{{ job.phases }}\" as=\"phase\" hint-placeholder-count=\"5\">\n                      <div class=\"{{ phase.cls }}\"><div class=\"bar\"><\u002Fdiv><div class=\"label\">{{ phase.label }}<\u002Fdiv><\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- Layout B: dense stream -->\n        <sc-if value=\"{{ jobsStream }}\" hint-placeholder-val=\"{{ false }}\">\n          <div class=\"card\" style=\"padding:0; overflow:hidden;\">\n            <sc-for list=\"{{ jobs }}\" as=\"job\" hint-placeholder-count=\"4\">\n              <div style=\"{{ job.rowStyle }}\">\n                <span class=\"{{ job.dotCls }}\" style=\"flex:none;\"><\u002Fspan>\n                <div style=\"min-width:0; flex:1 1 auto;\">\n                  <div style=\"font-size:var(--type-body-size); color:var(--signal); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;\">{{ job.title }}<\u002Fdiv>\n                  <div class=\"mono\" style=\"font-size:11px; color:var(--signal-mute);\">{{ job.sub }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"flex:none; width:160px;\">\n                  <div style=\"height:4px; border-radius:9999px; background:var(--edge); overflow:hidden;\"><div style=\"height:100%; border-radius:9999px; background:var(--ring-grad); width:{{ job.pct }}%;\"><\u002Fdiv><\u002Fdiv>\n                  <div class=\"mono\" style=\"font-size:10px; color:var(--signal-mute); margin-top:4px;\">{{ job.phaseLabel }}<\u002Fdiv>\n                <\u002Fdiv>\n                <span class=\"{{ job.statusCls }}\" style=\"flex:none;\">{{ job.statusLabel }}<\u002Fspan>\n                <span class=\"mono\" style=\"flex:none; width:54px; text-align:right; font-size:11px; color:var(--signal-mute);\">{{ job.elapsed }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <!-- ===================== APPROVALS ===================== -->\n    <sc-if value=\"{{ show.approvals }}\" hint-placeholder-val=\"{{ false }}\">\n      <section style=\"animation:cockpitViewEnter 320ms cubic-bezier(0.05,0.7,0.1,1) both;\">\n        <div class=\"section-header\" style=\"margin-top:0;\">\n          <div class=\"heads\"><span class=\"eyebrow\">Needs your OK<\u002Fspan><h2 class=\"section-title\">Approvals<\u002Fh2><\u002Fdiv>\n          <div class=\"trailing\"><span class=\"{{ approvalsCountCls }}\">{{ approvalsCountLabel }}<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ hasApprovals }}\" hint-placeholder-val=\"{{ true }}\">\n          <div>\n            <sc-for list=\"{{ approvals }}\" as=\"ap\" hint-placeholder-count=\"4\">\n              <div class=\"card\" style=\"margin-top:12px; display:flex; gap:16px; align-items:flex-start;\">\n                <div style=\"flex:none; width:70px; text-align:center; padding-top:2px;\">\n                  <div style=\"font-size:10px; letter-spacing:0.8px; text-transform:uppercase; color:var(--signal-mute);\">Gate<\u002Fdiv>\n                  <div style=\"font-size:15px; font-weight:600; color:var(--signal); margin-top:2px;\">{{ ap.gate }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"width:1px; align-self:stretch; background:var(--edge);\"><\u002Fdiv>\n                <div style=\"flex:1 1 auto; min-width:0;\">\n                  <div style=\"display:flex; align-items:center; gap:10px; margin-bottom:6px;\">\n                    <span style=\"font-size:var(--type-body-size); font-weight:600; color:var(--signal);\">{{ ap.title }}<\u002Fspan>\n                    <span class=\"{{ ap.riskCls }}\">{{ ap.risk }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"font-size:va xt-transform:uppercase; color:var(--signal-mute); margin:0 0 10px 2px;\">Running now<\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:12px;\">\n          <sc-for list=\"{{ skillsActive }}\" as=\"sk\" hint-placeholder-count=\"8\">\n            <div class=\"card interactive\" style=\"display:flex; align-items:center; gap:13px;\">\n              <span style=\"flex:none; width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; background:var(--void-2); border:1px solid var(--edge); position:relative;\">\n                <span style=\"position:absolute; inset:-7px; border-radius:12px; pointer-events:none; background:radial-gradient(circle at 50% 50%, rgba(122,224,255,0.12) 0%, rgba(122,224,255,0) 70%);\"><\u002Fspan>\n                <svg viewBox=\"0 0 48 48\" width=\"20\" height=\"20\" aria-hidden=\"true\"><g transform=\"rotate(-32 24 24)\"><circle cx=\"24\" cy=\"24\" r=\"15\" fill=\"none\" stroke=\"url(#hdr-ring)\" stroke-width=\"2.2\" stroke-dasharray=\"66 28\" stroke-linecap=\"round\"><\u002Fcircle><\u002Fg><circle cx=\"24\" cy=\"24\" r=\"3.1\" fill=\"#fff\"><\u002Fcircle><\u002Fsvg>\n              <\u002Fspan>\n              <div style=\"min-width:0;\">\n                <div style=\"font-size:var(--type-body-size); font-weight:600; color:var(--signal);\">{{ sk.name }}<\u002Fdiv>\n                <div style=\"font-size:var(--type-label-size); color:var(--signal-dim);\">{{ sk.desc }}<\u002Fdiv>\n              <\u002Fdiv>\n              <span class=\"pill ok\" style=\"margin-left:auto; flex:none;\"><span class=\"dot ok\"><\u002Fspan> On<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"font-size:11px; letter-spacing:0.6px; text-transform:uppercase; color:var(--signal-mute); margin:22px 0 10px 2px;\">Skill library<\u002Fdiv>\n        <div style=\"display:flex; flex-wrap:wrap; gap:10px;\">\n          <sc-for list=\"{{ skillCats }}\" as=\"cat\" hint-placeholder-count=\"14\">\n            <div style=\"display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:var(--radius-md); background:var(--void-3); border:1px solid var(--edge);\">\n              <span style=\"font-size:13px; color:var(--signal);\">{{ cat.label }}<\u002Fspan>\n              <span class=\"mono\" style=\"font-size:11px; color:var(--signal-mute);\">{{ cat.count }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <!-- ===================== FUSION ===================== -->\n    <sc-if value=\"{{ show.fusion }}\" hint-placeholder-val=\"{{ false }}\">\n      <section style=\"animation:cockpitViewEnter 320ms cubic-bezier(0.05,0.7,0.1,1) both;\">\n        <div class=\"section-header\" style=\"margin-top:0;\">\n          <div class=\"heads\"><span class=\"eyebrow\">Mixture of minds<\u002Fspan><h2 class=\"section-title\">Fusion<\u002Fh2><\u002Fdiv>\n          <div class=\"trailing\"><button type=\"button\" class=\"btn secondary\" onclick=\"{{ onAutoAssemble }}\">Auto-assemble<\u002Fbutton><span class=\"pill accent\"><span class=\"dot live\"><\u002Fspan> {{ fusionActiveLabel }}<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:var(--type-label-size); color:var(--signal-dim); margin:0 0 14px 2px;\">Put any models together into one blend, drawn from every provider you have connected. muse can add or drop models on its own as a task needs.<\u002Fdiv>\n        <div class=\"card\" style=\"margin-bottom:12px; display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,0.95fr); gap:20px; align-items:center;\">\n          <div style=\"aspect-ratio:1/1; width:100%; max-width:360px; margin:0 auto;\">{{ pentagram }}<\u002Fdiv>\n          <div>\n            <div style=\"font-size:10px; letter-spacing:0.6px; text-transform:uppercase; color:var(--signal-mute); margin-bottom:8px;\">Pentagram editor<\u002Fdiv>\n            <div style=\"font-size:var(--type-body-size); line-height:var(--type-body-line); color:var(--signal-dim);\">Each point of the star is a model in the blend. <strong style=\"color:var(--signal);\">Drag a node inward<\u002Fstrong> to give it less weight, or <strong style=\"color:var(--signal);\">outward toward its point<\u002Fstrong> to give it more. Tap an empty point to add the next model. The star is muse's synaptic web; the white core is the fused answer.<\u002Fdiv>\n            <div style=\"margin-top:14px; font-size:var(--type-label-size); color:var(--signal-mute);\">Fine-tune the exact numbers in the list below.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:12px; align-items:start;\">\n          <!-- sources -->\n          <div style=\"display:flex; flex-direction:column; gap:12px;\">\n            <sc-for list=\"{{ fusion }}\" as=\"f\" hint-placeholder-count=\"4\">\n              <div class=\"card\" style=\"opacity:{{ f.rowOpacity }}; transition:opacity .2s;\">\n                <div style=\"display:flex; align-items:center; gap:12px;\">\n                  <div style=\"min-width:0;\">\n                    <div class=\"mono\" style=\"font-size:14px; font-weight:600; color:var(--signal);\">{{ f.name }}<\u002Fdiv>\n                    <div style=\"font-size:var(--type-label-size); color:var(--signal-mute);\">{{ f.provName }} · {{ f.role }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <button type=\"button\" onclick=\"{{ f.onToggle }}\" title=\"Remove from blend\" style=\"margin-left:auto; width:28px; height:28px; border:1px solid var(--edge); border-radius:8px; background:transparent; color:var(--signal-mute); cursor:pointer;\">×<\u002Fbutton>\n                <\u002Fdiv>\n                <div style=\"margin-top:14px; display:flex; align-items:center; gap:12px;\">\n                  <button type=\"button\" onclick=\"{{ f.onDown }}\" style=\"width:28px; height:28px; border:1px solid var(--edge); border-radius:8px; background:var(--void-2); color:var(--signal-dim); cursor:pointer; font-size:15px;\">−<\u002Fbutton>\n                  <div style=\"flex:1 1 auto; height:6px; border-radius:9999px; background:var(--edge); overflow:hidden;\"><div style=\"height:100%; border-radius:9999px; background:var(--ring-grad); width:{{ f.barW }}; transition:width .25s var(--easing-standard);\"><\u002Fdiv><\u002Fdiv>\n                  <button type=\"button\" onclick=\"{{ f.onUp }}\" style=\"width:28px; height:28px; border:1px solid var(--edge); border-radius:8px; background:var(--void-2); color:var(--signal-dim); cursor:pointer; font-size:15px;\">+<\u002Fbutton>\n                  <span class=\"mono\" style=\"flex:none; width:42px; text-align:right; font-size:13px; color:var(--signal);\">{{ f.contrib }}%<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ hasAddable }}\" hint-placeholder-val=\"{{ false }}\">\n              <div class=\"card\" style=\"padding:14px;\">\n                <div style=\"font-size:10px; letter-spacing:0.6px; text-transform:uppercase; color:var(--signal-mute); margin-bottom:10px;\">Add a model to the blend<\u002Fdiv>\n                <div style=\"display:flex; flex-wrap:wrap; gap:8px;\">\n                  <sc-for list=\"{{ addable }}\" as=\"a\" hint-placeholder-count=\"3\">\n                    <button type=\"button\" onclick=\"{{ a.onAdd }}\" style=\"padding:7px 12px; border:1px solid var(--edge); border-radius:9999px; background:var(--void-2); color:var(--signal-dim); cursor:pointer; font:inherit; font-size:12px;\">+ {{ a.name }} <span style=\"color:var(--signal-mute);\">· {{ a.provName }}<\u002Fspan><\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <!-- fused output -->\n          <div class=\"card\" style=\"position:sticky; top:69px;\">\n            <div style=\"display:flex; align-items:center; gap:10px; margin-bottom:14px;\">\n              <span class=\"glyph spin\"><svg viewBox=\"0 0 48 48\" width=\"22\" height=\"22\" aria-hidden=\"true\"><g transform=\"rotate(-32 24 24)\"><circle cx=\"24\" cy=\"24\" r=\"15\" fill=\"none\" stroke=\"url(#hdr-ring)\" stroke-width=\"2.2\" stroke-dasharray=\"66 28\" stroke-linecap=\"round\"><\u002Fcircle><\u002Fg><circle cx=\"24\" cy=\"24\" r=\"3.1\" fill=\"#fff\"><\u002Fcircle><\u002Fsvg><\u002Fspan>\n              <span style=\"font-size:var(--type-body-size); font-weight:600; color:var(--signal);\">Fused answer<\u002Fspan>\n              <span class=\"pill ok\" style=\"margin-left:auto;\">{{ fusionConfidence }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex; height:10px; border-radius:9999px; overflow:hidden; background:var(--edge); margin-bottom:14px;\">\n              <sc-for list=\"{{ fusion }}\" as=\"f\" hint-placeholder-count=\"4\">\n                <div style=\"width:{{ f.barW }}; background:var(--ring-grad); border-right:1px solid var(--void);\"><\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"font-size:var(--type-body-size); line-height:var(--type-body-line); color:var(--signal-dim); padding:14px; background:var(--void-2); border:1px solid var(--edge); border-left:2px solid var(--ring-1); border-radius:var(--radius-md);\">{{ fusionAnswer }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <!-- ===================== 3D ATLAS ===================== -->\n    <sc-if value=\"{{ show.atlas }}\" hint-placeholder-val=\"{{ false }}\">\n      <section style=\"animation:cockpitViewEnter 320ms cubic-bezier(0.05,0.7,0.1,1) both; max-width:none;\">\n        <div class=\"section-header\" style=\"margin-top:0;\">\n          <div class=\"heads\"><span class=\"eyebrow\">The whole mind<\u002Fspan><h2 class=\"section-title\">3D Atlas<\u002Fh2><\u002Fdiv>\n          <div class=\"trailing\"><span class=\"pill accent\"><span class=\"dot live\"><\u002Fspan> interactive · WebGL<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"position:relative; height:calc(100vh - 180px); min-height:520px; border-radius:10px; overflow:hidden; box-shadow:0 30px 70px -34px rgba(0,0,0,0.9), 0 0 0 1px var(--edge);\">\n          <iframe src=\"{{ atlasSrc }}\" title=\"MUSE 3D Systems Atlas\" style=\"width:100%; height:100%; border:0; display:block; background:#05080f;\"><\u002Fiframe>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <!-- ===================== ROUTES ===================== -->\n    <sc-if value=\"{{ show.routes }}\" hint-placeholder-val=\"{{ false }}\">\n      <section style=\"animation:cockpitViewEnter 320ms cubic-bezier(0.05,0.7,0.1,1) both; max-width:none;\">\n        <div class=\"section-header\" style=\"margin-top:0;\">\n          <div class=\"heads\"><span class=\"eyebrow\">Any provider, any model<\u002Fspan><h2 class=\"section-title\">Models &amp; providers<\u002Fh2><\u002Fdiv>\n          <div class=\"trailing\"><span class=\"pill accent\">{{ modelsOnlineLabel }}<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:var(--type-label-size); color:var(--signal-dim); margin:0 0 16px 2px;\">One omni source for every model. Connect any provider, add any model, and choose which ones muse can use — you are never locked to one.<\u002Fdiv>\n\n        <div style=\"display:flex; align-items:center; margin-bottom:10px;\"><span style=\"font-size:10px; letter-spacing:0.6px; text-transform:uppercase; color:var(--signal-mute);\">Providers<\u002Fspan><span class=\"grow\"><\u002Fspan><button type=\"button\" class=\"btn secondary\" onclick=\"{{ onAddProvider }}\">+ Add provider<\u002Fbutton><\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:24px;\">\n          <sc-for list=\"{{ providerList }}\" as=\"p\" hint-placeholder-count=\"6\">\n            <div class=\"card\" style=\"padding:14px; display:flex; align-items:center; gap:12px;\">\n              <div style=\"min-width:0;\">\n                <div style=\"display:flex; align-items:center; gap:7px;\"><span style=\"font-size:14px; font-weight:600; color:var(--signal);\">{{ p.name }}<\u002Fspan><sc-if value=\"{{ p.omni }}\" hint-placeholder-val=\"{{ false }}\"><span class=\"pill accent\" style=\"font-size:9px;\">OMNI<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n                <div style=\"font-size:11px; color:var(--signal-mute);\">{{ p.kindLabel }}<\u002Fdiv>\n              <\u002Fdiv>\n              <button type=\"button\" onclick=\"{{ p.onToggle }}\" style=\"{{ p.trackStyle }}; margin-left:auto;\"><span style=\"{{ p.knobStyle }}\"><\u002Fspan><\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:flex; align-items:center; margin-bottom:10px;\"><span style=\"font-size:10px; letter-spacing:0.6px; text-transform:uppercase; color:var(--signal-mute);\">Models<\u002Fspan><span class=\"grow\"><\u002Fspan><button type=\"button\" class=\"btn primary\" onclick=\"{{ onOpenAddModel }}\">+ Add model<\u002Fbutton><\u002Fdiv>\n        <sc-if value=\"{{ addModelOpen }}\" hint-placeholder-val=\"{{ false }}\">\n          <div class=\"card\" style=\"margin-bottom:12px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;\">\n            <input class=\"field\" placeholder=\"Model name\" value=\"{{ newModelName }}\" oninput=\"{{ onNewModelName }}\" style=\"flex:1 1 160px;\">\n            <select class=\"field\" value=\"{{ newModelProv }}\" onchange=\"{{ onNewModelProv }}\" style=\"flex:none; width:150px;\">\n              <sc-for list=\"{{ providerList }}\" as=\"p\" hint-placeholder-count=\"3\"><option value=\"{{ p.id }}\">{{ p.name }}<\u002Foption><\u002Fsc-for>\n            <\u002Fselect>\n            <select class=\"field\" value=\"{{ newModelStrength }}\" onchange=\"{{ onNewModelStrength }}\" style=\"flex:none; width:150px;\">\n              <option value=\"Reasoning\">Reasoning<\u002Foption><option value=\"Code\">Code<\u002Foption><option value=\"Vision\">Vision<\u002Foption><option value=\"Long context\">Long context<\u002Foption><option value=\"Math\">Math<\u002Foption><option value=\"Fast\">Fast<\u002Foption><option value=\"Cheap\">Cheap<\u002Foption><option value=\"Writing\">Writing<\u002Foption>\n            <\u002Fselect>\n            <input class=\"field\" placeholder=\"Context (K)\" value=\"{{ newModelCtx }}\" oninput=\"{{ onNewModelCtx }}\" style=\"flex:none; width:120px;\">\n            <button type=\"button\" class=\"btn primary\" onclick=\"{{ onAddModel }}\">Add<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div class=\"card\" style=\"padding:0; overflow:hidden;\">\n          <div style=\"display:grid; grid-template-columns:1.5fr 1fr 0.7fr 0.6fr 1.4fr auto; gap:14px; padding:12px 16px; border-bottom:1px solid var(--edge); font-size:10px; letter-spacing:0.6px; text-transform:uppercase; color:var(--signal-mute);\">\n            <span>Model<\u002Fspan><span>Best at<\u002Fspan><span>Context<\u002Fspan><span>Cost<\u002Fspan><span>On · fusion<\u002Fspan><span><\u002Fspan>\n          <\u002Fdiv>\n          <sc-for list=\"{{ modelList }}\" as=\"m\" hint-placeholder-count=\"6\">\n            <div style=\"display:grid; grid-template-columns:1.5fr 1fr 0.7fr 0.6fr 1.4fr auto; gap:14px; padding:14px 16px; border-bottom:1px solid var(--edge); align-items:center; opacity:{{ m.rowOpacity }};\">\n              <div style=\"min-width:0;\"><div class=\"mono\" style=\"font-size:13px; color:var(--signal); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;\">{{ m.name }}<\u002Fdiv><div style=\"font-size:11px; color:var(--signal-mute);\">{{ m.provName }}<\u002Fdiv><\u002Fdiv>\n              <span style=\"font-size:12px; color:var(--signal-dim); min-width:0;\">{{ m.strengthText }}<\u002Fspan>\n              <span class=\"mo
