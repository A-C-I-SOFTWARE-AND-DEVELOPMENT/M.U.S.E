[package]
name = "muse-desktop"
version = "0.1.0"
description = "muse — Multi-Use Synaptic Entity desktop shell (Tauri v2)."
authors = ["A.C.I. Software and Development"]
edition = "2021"
rust-version = "1.77.2"

# The library that the binary and (on mobile) the platform entry points share.
[lib]
name = "muse_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Core Tauri v2. `tray-icon` enables the system tray; the menu API is part of
# core in v2. `devtools` is enabled only in debug builds below.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
# Rust-side spawn of `muse cockpit serve` (brain.rs); no shell capability is
# exposed to the webview.
tauri-plugin-shell = "2"
# Persist window size/position across restarts (saved on tray Quit).
tauri-plugin-window-state = "2"
# Native clipboard for the "Copy Gateway URL" menu action.
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Store per-device gateway credentials in the operating-system vault.
keyring = "3"

# Desktop-only: the auto-update scaffold. Registered at runtime ONLY when
# plugins.updater.pubkey is non-empty in tauri.conf.json (inert until the
# owner provisions the signing keypair — see ../RELEASE.md).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[features]
# Default to no extra features. `custom-protocol` is the production bundling
# path Tauri injects; it MUST be enabled when building the binary for release.
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(debug_assertions)'.dependencies]
# Web inspector in debug builds only.
tauri = { version = "2", features = ["devtools"] }

[profile.release]
panic = "abort"   # smaller binaries; we don't unwind across the FFI boundary
codegen-units = 1
lto = true
opt-level = "s"
strip = true
