# Hermes model catalog — pre-wired OSS models, ready to go.
#
# Every entry below is a one-tap model the app's `/model` picker and the
# agent router can select immediately. Each model names the provider
# plugin that serves it (under `plugins/model-providers/<provider>/`) and
# the `requires_env` key that unlocks it. Drop the keys in
# `~/.hermes/.env` (see `.env.example`) and `hermes doctor` reports each
# model as ready/blocked.
#
# `hermes_model_catalog.py` loads and validates this file. Keep entries
# alphabetical within a provider so diffs stay readable. This is data,
# not code — adding a model is a YAML edit, no Python change.

version: 1

# Default the router reaches for first, by tier. The loader picks the
# first READY model in each tier (its env key is present), so the user
# always has a working default no matter which keys they've set.
defaults:
  frontier:
    - openrouter/llama-3.3-70b
    - novita/llama-3.3-70b
    - nvidia/llama-3.1-nemotron-70b
    - cerebras/zai-glm-4.7
  fast:
    - ollama-local/qwen3_5-9b
    - ollama-local/gemma4-12b
    # Cloud speed lane: wafer-scale Cerebras beats any cloud 8B on latency
    # AND quality when CEREBRAS_API_KEY is present; stays behind local-first.
    - cerebras/gpt-oss-120b
    - openrouter/llama-3.1-8b
  local:
    - ollama-local/qwen3_5-9b
    - ollama-local/gemma4-12b
    - ollama-local/qwen3-coder-30b

providers:

  openrouter:
    requires_env: OPENROUTER_API_KEY
    plugin: model-providers/openrouter
    models:
      - id: llama-3.3-70b
        model: meta-llama/llama-3.3-70b-instruct
        family: llama
        params_b: 70
        context: 131072
        tags: [oss, general, tools]
      - id: llama-3.1-8b
        model: meta-llama/llama-3.1-8b-instruct
        family: llama
        params_b: 8
        context: 131072
        tags: [oss, fast]
      - id: qwen-2.5-72b
        model: qwen/qwen-2.5-72b-instruct
        family: qwen
        params_b: 72
        context: 131072
        tags: [oss, general, coding]
      - id: deepseek-r1
        model: deepseek/deepseek-r1
        family: deepseek
        params_b: 671
        context: 65536
        tags: [oss, reasoning]
      - id: mixtral-8x22b
        model: mistralai/mixtral-8x22b-instruct
        family: mistral
        params_b: 141
        context: 65536
        tags: [oss, general]
      # Frontier OSS coding / reasoning / multimodal via OpenRouter (one key
      # serves every vendor below). Model slugs mirror the OSS brain's verified
      # ProviderRefs in docs/ai-intelligence/oss-model-catalog.yaml (the layer
      # that actually drives routing); the current frontier *variant* per family
      # (GLM-5.1, Kimi-K2.6, MiniMax-M3, …) is tracked there via current_variant.
      # Rows tagged `candidate` are new picker entries — confirm availability
      # against OpenRouter's live model list before relying on them for spend.
      - id: deepseek-v4
        model: deepseek/deepseek-v4
        family: deepseek
        params_b: 671
        context: 1000000
        tags: [oss, coding, reasoning, agentic, tools, candidate]
      - id: glm-5
        model: z-ai/glm-5
        family: glm
        params_b: 744
        context: 200000
        tags: [oss, coding, agentic, bug-fix, tools, candidate]
      # GLM-5.2 — current frontier GLM variant (upstream Hermes v0.17.0):
      # ships a verified 1M-token context window. params_b mirrors glm-5
      # (same family iteration). Confirm availability on OpenRouter before spend.
      - id: glm-5.2
        model: z-ai/glm-5.2
        family: glm
        params_b: 744
        context: 1048576
        tags: [oss, coding, agentic, bug-fix, tools, candidate]
      - id: kimi-k2
        model: moonshotai/kimi-k2
        family: kimi
        params_b: 1000
        context: 256000
        tags: [oss, coding, agentic, reasoning, candidate]
      - id: minimax-m2
        model: minimax/minimax-m2
        family: minimax
        params_b: 230
        context: 1000000
        tags: [oss, coding, agentic, multimodal, candidate]
      - id: qwen3-coder
        model: qwen/qwen3-coder
        family: qwen
        params_b: 80
        context: 256000
        tags: [oss, coding, code-edit, tools, candidate]
      - id: qwen3-235b
        model: qwen/qwen3-235b-a22b
        family: qwen
        params_b: 235
        context: 262000
        tags: [oss, reasoning, math, candidate]
      - id: qwen3-vl
        model: qwen/qwen3-vl
        family: qwen
        params_b: 235
        context: 256000
        tags: [oss, multimodal, doc, vision, candidate]

  novita:
    requires_env: NOVITA_API_KEY
    plugin: model-providers/novita
    models:
      - id: llama-3.3-70b
        model: meta-llama/llama-3.3-70b-instruct
        family: llama
        params_b: 70
        context: 131072
        tags: [oss, general]
      - id: qwen-2.5-7b
        model: qwen/qwen-2.5-7b-instruct
        family: qwen
        params_b: 7
        context: 32768
        tags: [oss, fast]
      - id: deepseek-v3
        model: deepseek/deepseek-v3
        family: deepseek
        params_b: 671
        context: 65536
        tags: [oss, general, coding]

  # Wafer-scale speed lane (~1,000-3,000 tok/s). Cerebras RETIRES model IDs
  # aggressively (a retired ID 404s), so only IDs kept stable through several
  # deprecation waves are pre-wired here; `hermes doctor` and the picker probe
  # the live /v1/models list, which is authoritative. Do NOT re-add
  # qwen-3-coder-480b (retired → GLM-4.7) or gemma-4-31b-it (not a Cerebras ID).
  cerebras:
    requires_env: CEREBRAS_API_KEY
    plugin: model-providers/cerebras
    models:
      - id: gpt-oss-120b
        model: gpt-oss-120b
        family: gpt-oss
        params_b: 120
        context: 131072
        tags: [oss, fast, general, reasoning, tools]
      - id: zai-glm-4.7
        model: zai-glm-4.7
        family: glm
        params_b: 357
        context: 131072
        tags: [oss, fast, coding, reasoning, tools]

  nvidia:
    requires_env: NVIDIA_API_KEY
    plugin: model-providers/nvidia
    models:
      - id: llama-3.1-nemotron-70b
        model: nvidia/llama-3.1-nemotron-70b-instruct
        family: llama
        params_b: 70
        context: 131072
        tags: [oss, general, tuned]
      - id: mistral-nemo-12b
        model: nv-mistralai/mistral-nemo-12b-instruct
        family: mistral
        params_b: 12
        context: 131072
        tags: [oss, fast]

  huggingface:
    requires_env: HF_TOKEN
    plugin: model-providers/huggingface
    models:
      - id: qwen-2.5-coder-32b
        model: Qwen/Qwen2.5-Coder-32B-Instruct
        family: qwen
        params_b: 32
        context: 131072
        tags: [oss, coding]
      - id: llama-3.1-8b
        model: meta-llama/Llama-3.1-8B-Instruct
        family: llama
        params_b: 8
        context: 131072
        tags: [oss, fast]

  ollama-cloud:
    requires_env: OLLAMA_CLOUD_API_KEY
    plugin: model-providers/ollama-cloud
    models:
      - id: llama3.3-70b
        model: llama3.3:70b
        family: llama
        params_b: 70
        context: 131072
        tags: [oss, general]
      - id: deepseek-r1-70b
        model: deepseek-r1:70b
        family: deepseek
        params_b: 70
        context: 65536
        tags: [oss, reasoning]

  # On-device / desktop. No API key — connectivity is the local daemon.
  ollama-local:
    requires_env: null
    plugin: model-providers/custom
    base_url: http://127.0.0.1:11434
    models:
      # Gemma 4 — Google DeepMind open-weight family (Apache-2.0). The
      # local-first default for JARVIS reasoning / memory / voice / mobile
      # lanes. Tags reflect the published model card; context is a
      # conservative floor — verify the exact Ollama build before relying on
      # a larger window or a specific tag (12B is intentionally model-card
      # only; see docs/ai-intelligence/oss-model-catalog.yaml).
      - id: gemma4-e2b
        model: gemma4:e2b
        family: gemma
        params_b: 2
        context: 131072
        tags: [oss, local, offline, gemma, mobile, voice, fast, memory, multimodal]
      - id: gemma4-e4b
        model: gemma4:e4b
        family: gemma
        params_b: 4
        context: 131072
        tags: [oss, local, offline, gemma, reasoning, memory, voice, mobile, multimodal, doc]
      # ---- Installed-here models (reconciled 2026-06-27 against `ollama show`) ----
      # The six entries below are the models actually pulled on this machine
      # (RTX 5070 Laptop, 8GB VRAM). `context` is a CONSERVATIVE runtime floor
      # of 32768 — the native windows (256K–1M) are UNREACHABLE at 8GB even
      # with q8_0 KV + flash attention, so the catalog advertises what the box
      # can actually serve, not the model card maximum. Every chat model here
      # supports tools; vision/thinking tags follow the verified capability
      # matrix. gemma4-e2b/e4b above stay listed as downloadable-on-other-machines
      # candidates but are NOT installed here.
      - id: qwen3-coder-30b
        model: qwen3-coder:30b
        family: qwen
        params_b: 30
        context: 32768
        tags: [oss, local, offline, coding, code-edit, tools]
      - id: gpt-oss-20b
        model: gpt-oss:20b
        family: openai-oss
        params_b: 20
        context: 32768
        tags: [oss, local, offline, reasoning, agentic, tools, thinking]
      - id: gemma4-12b
        model: gemma4:12b
        family: gemma
        params_b: 12
        context: 32768
        tags: [oss, local, offline, general, vision, tools, thinking]
      - id: qwen3_5-9b
        model: qwen3.5:9b
        family: qwen
        params_b: 9
        context: 32768
        tags: [oss, local, offline, fast, general, vision, tools, thinking]
      - id: qwythos-mythos-9b
        model: hf.co/empero-ai/Qwythos-9B-Claude-Mythos-5-1M-GGUF:Q5_K_M
        family: qwen
        params_b: 9
        context: 32768
        tags: [oss, local, offline, creative, companion, long-context, tools, thinking, vision]
      - id: ornith-9b
        model: hf.co/deepreinforce-ai/Ornith-1.0-9B-GGUF:Q4_K_M
        family: qwen
        params_b: 9
        context: 32768
        tags: [oss, local, offline, reasoning, tools, thinking]
      - id: qwen2.5-7b
        model: qwen2.5:7b
        family: qwen
        params_b: 7
        context: 32768
        tags: [oss, local, offline]
      # Local retrieval stack — embeddings + rerankers for Memory Tree,
      # Research Vault, GraphRAG and code navigation. Not chat models; they
      # power retrieval, not the /model picker's conversation default.
      - id: qwen3-embedding
        model: qwen3-embedding
        family: qwen
        params_b: 8
        context: 32768
        tags: [oss, local, offline, embedding, retrieval]
      - id: bge-m3
        model: bge-m3
        family: bge
        params_b: 0.6
        context: 8192
        tags: [oss, local, offline, embedding, retrieval, multilingual]
      - id: qwen3-reranker
        model: qwen3-reranker
        family: qwen
        params_b: 8
        context: 32768
        tags: [oss, local, offline, rerank, retrieval]
      - id: bge-reranker
        model: bge-reranker
        family: bge
        params_b: 0.6
        context: 8192
        tags: [oss, local, offline, rerank, retrieval]

  llamacpp-local:
    requires_env: null
    plugin: model-providers/custom
    base_url: http://127.0.0.1:8080
    models:
      - id: qwen2.5-7b
        model: qwen2.5-7b-instruct
        family: qwen
        params_b: 7
        context: 32768
        tags: [oss, local, offline]

# Media generation — surfaced in the app's capability catalog and
# reachable by voice ("make me an image of…", "create a video of…").
media:
  image:
    - provider: fal
      requires_env: FAL_KEY
      plugin: image_gen/fal
      models: [flux-2-pro, flux-2-klein, nano-banana, recraft-v3]
    - provider: openai
      requires_env: OPENAI_API_KEY
      plugin: image_gen/openai
      models: [gpt-image-1.5]
    - provider: xai
      requires_env: XAI_API_KEY
      plugin: image_gen/xai
      models: [grok-2-image]
  video:
    - provider: fal
      requires_env: FAL_KEY
      plugin: video_gen/fal
      models: [veo-3, kling-2.1, wan-2.2]
    - provider: xai
      requires_env: XAI_API_KEY
      plugin: video_gen/xai
      models: [grok-video]

# ---------------------------------------------------------------------------
# Open-weight candidates — models you can DOWNLOAD and run locally.
#
# This section is read by `hermes_cli/models/catalog.py` (NOT the provider
# loader above). It powers `hermes models bootstrap`. Nothing here is fetched
# on a normal install — bootstrap requires --accept-downloads.
#
# Every entry MUST carry a license field. RAM/VRAM are conservative floors.
# `source` is "<runtime-source>:<ref>"; `verify` gives source/checksum guidance.
# Sizes/context reflect the commonly published open-weight builds of each
# family; confirm the exact build's card before relying on it.
# ---------------------------------------------------------------------------
open_weight_candidates:
  # ---- Gemma 4 (Google DeepMind, Apache-2.0) ----
  # Local-first companion/memory/voice/reasoning family. E2B/E4B are the
  # mobile/laptop defaults; 26B/31B are workstation/server reasoning + review
  # fallbacks. Sizes/context are conservative floors — verify the exact local
  # build/card before relying on it. 12B is intentionally NOT a candidate here
  # (no confirmed Ollama tag); it lives in the OSS model brain as a model-card
  # variant only.
  - name: gemma4-e2b
    source: ollama:gemma4:e2b
    access: open-weight
    license: Apache-2.0
    runtime: ollama
    kind: chat
    min_ram_gb: 4
    min_vram_gb: 0
    context: 131072
    strengths: [mobile, low-latency, voice, memory-curation, multimodal]
    weaknesses: [smallest-variant-weaker-deep-reasoning]
    routing_lanes: [companion, voice, memory, fast, mobile]
    tiers: [laptop, desktop, workstation, server]
    verify: "verify exact local build/card before relying on it; `ollama show gemma4:e2b`."
  - name: gemma4-e4b
    source: ollama:gemma4:e4b
    access: open-weight
    license: Apache-2.0
    runtime: ollama
    kind: reasoning
    min_ram_gb: 8
    min_vram_gb: 0
    context: 131072
    strengths: [local-reasoning, memory-curation, voice, mobile, multimodal, doc]
    weaknesses: [not-a-default-coder]
    routing_lanes: [companion, strategy, memory, voice, mobile]
    tiers: [laptop, desktop, workstation, server]
    verify: "verify exact local build/card before relying on it; `ollama show gemma4:e4b`."
  - name: gemma4-26b-a4b
    source: ollama:gemma4:26b
    access: open-weight
    license: Apache-2.0
    runtime: ollama
    kind: reasoning
    min_ram_gb: 32
    min_vram_gb: 24
    context: 131072
    strengths: [strong-local-reasoning, memory, review-fallback, doc, ocr]
    weaknesses: [needs-workstation-class-hardware]
    routing_lanes: [strategy, critic, operator, memory, reviewer]
    tiers: [workstation, server]
    verify: "verify exact local build/card before relying on it; `ollama show gemma4:26b`."
  - name: gemma4-31b
    source: ollama:gemma4:31b
    access: open-weight
    license: Apache-2.0
    runtime: ollama
    kind: reasoning
    min_ram_gb: 48
    min_vram_gb: 28
    context: 131072
    strengths: [deep-local-reasoning, multimodal, review-fallback, deep-research-fallback]
    weaknesses: [server-class-only]
    routing_lanes: [strategy, critic, operator, deep-research, reviewer]
    tiers: [workstation, server]
    verify: "verify exact local build/card before relying on it; `ollama show gemma4:31b`."
  # ---- Qwen coding / reasoning ----
  - name: qwen2.5-coder-7b
    source: ollama:qwen2.5-coder:7b
    access: open-weight
    license: Apache-2.0
    runtime: ollama
    kind: coder
    min_ram_gb: 8
    min_vram_gb: 6
    context: 131072
    strengths: [coding, fill-in-the-middle, tool-use]
    weaknesses: [weaker-long-context-reasoning]
    routing_lanes: [builder, fast]
    tiers: [laptop, desktop, workstation, server]
    verify: "ollama pulls signed manifests; verify digest with `ollama show qwen2.5-coder:7b`."
  - name: qwen2.5-coder-32b
    source: ollama:qwen2.5-coder:32b
    access: open-weight
    license: Apache-2.0
    runtime: ollama
    kind: coder
    min_ram_gb: 32
    min_vram_gb: 24
    context: 131072
    strengths: [strong-coding, refactor, repo-scale-edits]
    weaknesses: [needs-24GB+-vram-for-speed]
    routing_lanes: [builder, reviewer]
    tiers: [workstation, server]
    verify: "Verify via `ollama show qwen2.5-coder:32b`; HF source Qwen/Qwen2.5-Coder-32B-Instruct."
  # ---- DeepSeek coding / reasoning ----
  - name: deepseek-coder-v2-16b
    source: ollama:deepseek-coder-v2:16b
    access: open-weight
    license: deepseek-license
    runtime: ollama
    kind: coder
    min_ram_gb: 16
