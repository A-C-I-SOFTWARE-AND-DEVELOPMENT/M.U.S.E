<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1145 232" width="1145" height="232" role="img" aria-label="muse — Multi-Use Synaptic Entity — One mind, many pathways.">
  <!--
    muse banner — V2 "Cinematic synthesis", REFINED to production grade.
    Refinements over the comp: (1) value ladder — wordmark near-white (#eef2f7) so
    the white core owns the single luminous peak; (2) tight high-emissive core
    "punch"; (3) optical micro-corrections — U-bowl overshoot + larger baseline
    periods. Palette: gateway/cockpit/static/tokens.css. Glyph: the cockpit mark.
  -->
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ae0ff"/>
      <stop offset="1" stop-color="#b388ff"/>
    </linearGradient>
    <!-- one wide atmospheric depth pool behind the lockup -->
    <radialGradient id="depth" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#13233f" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#0a1120" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#050507" stop-opacity="0"/>
    </radialGradient>
    <!-- volumetric bloom: cool-white halos, bright-tight center to wide-faint edge -->
    <radialGradient id="halo4" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#bfe9ff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#7ae0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d4f2ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#9fd8f5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#eafbff" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#cdeeff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.82"/>
      <stop offset="0.5" stop-color="#e6f7ff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#e0f8ff" stop-opacity="0"/>
    </radialGradient>
    <!-- tight high-emissive core punch -->
    <radialGradient id="coreHot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.62" stop-color="#f2fbff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#eafaff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1145" height="232" fill="#050507"/>

  <g transform="translate(212,-5) scale(1.12)">
    <!-- atmospheric depth (single layer, broad) -->
    <circle cx="70" cy="90" r="104" fill="url(#depth)"/>

    <!-- spectral ring: matte, saturated, no glow -->
    <circle cx="70" cy="90" r="62" fill="none" stroke="url(#ring)" stroke-width="6.5"
            stroke-dasharray="273 116" stroke-linecap="round"
            transform="rotate(-32 70 90)"/>

    <!-- volumetric core bloom: stacked halos, tight hot core, then the crisp white core -->
    <circle cx="70" cy="90" r="64" fill="url(#halo4)"/>
    <circle cx="70" cy="90" r="46" fill="url(#halo3)"/>
    <circle cx="70" cy="90" r="30" fill="url(#halo2)"/>
    <circle cx="70" cy="90" r="20" fill="url(#halo1)"/>
    <circle cx="70" cy="90" r="16" fill="url(#coreHot)"/>
    <circle cx="70" cy="90" r="12.5" fill="#ffffff"/>

    <!-- wordmark muse — near-white (value ladder), weight 15, crisp matte -->
    <g fill="none" stroke="#eef2f7" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
      <!-- M -->
      <path d="M 184,134 L 184,46 L 228,96 L 272,46 L 272,134"/>
      <!-- U (bowl overshoots the baseline by ~2 for optical balance) -->
      <path d="M 316,46 L 316,98 A 38,38 0 0 0 392,98 L 392,46"/>
      <!-- S -->
      <path d="M 496,68 C 496,49 436,49 436,76 C 436,99 496,85 496,110 C 496,137 436,137 436,114"/>
      <!-- E -->
      <path d="M 608,46 L 540,46 L 540,134 L 608,134"/>
      <path d="M 540,90 L 600,90"/>
    </g>
    <!-- periods — larger, baseline-aligned -->
    <g fill="#eef2f7">
      <circle cx="292" cy="127" r="9"/>
      <circle cx="412" cy="127" r="9"/>
      <circle cx="520" cy="127" r="9"/>
      <circle cx="628" cy="127" r="9"/>
    </g>
  </g>

  <!-- tier 1: acronym expansion -->
  <text x="572" y="180" text-anchor="middle"
        font-family="Liberation Sans, DejaVu Sans, Helvetica, Arial, sans-serif"
        font-size="18" font-weight="700" letter-spacing="7" fill="#aab2c4">MULTI-USE SYNAPTIC ENTITY</text>
  <!-- tier 2: tagline / motto -->
  <text x="572" y="208" text-anchor="middle"
        font-family="Liberation Sans, DejaVu Sans, Helvetica, Arial, sans-serif"
        font-size="15.5" font-weight="400" letter-spacing="3" fill="#8b93a6">One mind, many pathways.</text>
</svg>
