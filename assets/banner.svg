<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1145 196" width="1145" height="196" role="img" aria-label="M.U.S.E. — Multi-Use Synaptic Entity">
  <!--
    M.U.S.E. "Singularity" banner: one white core in the void, a single thin
    spectral ring (cyan to violet), and a bespoke geometric white wordmark.
    Canonical source; rasterized to assets/banner.png with cairosvg at 4x (4580x784).
    Palette: gateway/cockpit/static/tokens.css. Glyph: the cockpit core+ring mark.
  -->
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ae0ff"/>
      <stop offset="1" stop-color="#b388ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1a2640" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#0a0f1c" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#050507" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#d6ecff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1145" height="196" fill="#050507"/>

  <g transform="translate(212,-13) scale(1.12)">
    <!-- ambient glow behind the glyph (tight, defined) -->
    <circle cx="70" cy="90" r="84" fill="url(#glow)"/>

    <!-- spectral ring: one ~70% arc with a single gap (the cockpit mark) -->
    <circle cx="70" cy="90" r="62" fill="none" stroke="url(#ring)" stroke-width="6.5"
            stroke-dasharray="273 116" stroke-linecap="round"
            transform="rotate(-32 70 90)"/>

    <!-- white core + tight luminous bloom -->
    <circle cx="70" cy="90" r="24" fill="url(#coreglow)"/>
    <circle cx="70" cy="90" r="12.5" fill="#ffffff"/>

    <!-- wordmark M.U.S.E. — bespoke monoline geometric letters (white) -->
    <g fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
      <!-- M -->
      <path d="M 184,134 L 184,46 L 228,96 L 272,46 L 272,134"/>
      <!-- U -->
      <path d="M 316,46 L 316,96 A 38,38 0 0 0 392,96 L 392,46"/>
      <!-- S -->
      <path d="M 496,68 C 496,49 436,49 436,76 C 436,99 496,85 496,110 C 496,137 436,137 436,114"/>
      <!-- E -->
      <path d="M 608,46 L 540,46 L 540,134 L 608,134"/>
      <path d="M 540,90 L 600,90"/>
    </g>
    <!-- periods -->
    <g fill="#ffffff">
      <circle cx="292" cy="128" r="8"/>
      <circle cx="412" cy="128" r="8"/>
      <circle cx="520" cy="128" r="8"/>
      <circle cx="628" cy="128" r="8"/>
    </g>
  </g>

  <!-- expansion / subtitle -->
  <text x="572" y="174" text-anchor="middle"
        font-family="Liberation Sans, DejaVu Sans, Helvetica, Arial, sans-serif"
        font-size="18" font-weight="700" letter-spacing="7" fill="#aab2c4">MULTI-USE SYNAPTIC ENTITY</text>
</svg>
