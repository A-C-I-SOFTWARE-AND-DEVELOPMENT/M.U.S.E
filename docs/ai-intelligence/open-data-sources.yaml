# Open data sources registry for training / evaluating JARVIS.
#
# This file is the machine-readable source of truth behind
# docs/ai-intelligence/top-open-data-sources-for-training.md. It is loaded by
# hermes_cli/jarvis_prime/open_data_sources.py and bridged into the Research
# Vault so the JARVIS learning pipeline can cite external open data.
#
# Field reference:
#   rank              ordering / priority from the research review (unique)
#   key               stable slug used by the CLI and code
#   name              human name
#   role              train | eval | both
#   legal_posture     permissive | mixed | cdla_permissive | apache_2_0 | mit |
#                     cc_by_4_0 | verify_at_ingest | no_llm_training
#   license_notes     usage / licensing constraints, caveats
#   languages         language coverage (free text)
#   size              reported scale (free text)
#   schema_provenance schema + provenance notes
#   quality_strengths why it is valuable
#   biases            main biases / duplication risks
#   best_tasks        recommended tasks + subset to ingest
#   source_uris       canonical URLs (first is used as the vault source_uri)
#   evidence_strength primary | strong | moderate | weak | vendor_reported
#                     (matches research_vault.EvidenceStrength)
#   core_ingest       in the recommended core training-ingest set
#   benchmark_wall    held out as an eval-only benchmark (never trained on)
#   cluster           capability cluster id (see `clusters:` below). Legacy
#                     code/GitHub entries default to `code-github` when omitted.
#
# Clusters group sources by the Hermes capability domain they train, mapped to
# the model routing task-classes (docs/ai-intelligence/model-routing-task-classes.md)
# they improve. See docs/ai-intelligence/training-data-clusters.md.

version: 2
as_of: "2026-06-04"

clusters:
  - id: code-github
    title: "Code & SWE (GitHub-derived)"
    capability_domains: ["code-build", "code-review", "repo-navigation", "test-debug"]
    model_task_classes: ["coding_plan", "coding_build", "coding_review", "test_debug"]
    rationale: >-
      Repo-level code, issues/PRs, CI signal, and SWE benchmarks from GitHub and
      Software Heritage. The original registry. Trains the builder/reviewer lanes
      and the test-aware repair loop.
  - id: agentic-tool-use
    title: "Agentic tool-use & function-calling"
    capability_domains: ["tool-use", "function-calling", "mcp", "orchestration"]
    model_task_classes: ["coding_build", "tool_reliability"]
    rationale: >-
      Multi-tool, multi-turn trajectories (incl. real MCP environments) and
      verified function calls. Hermes is fundamentally a tool/MCP agent, yet the
      registry had zero agentic data — this closes the largest gap.
  - id: instruction-following
    title: "Instruction-following & chat"
    capability_domains: ["companion", "chat", "summarization", "general-sft"]
    model_task_classes: ["mobile_chat", "voice_reply", "summarization"]
    rationale: >-
      Broad, permissive SFT mixtures for general helpfulness across every
      conversational surface (TUI, gateways, mobile, voice).
  - id: reasoning-math
    title: "Reasoning & math"
    capability_domains: ["planning", "strategy", "critic", "reasoning"]
    model_task_classes: ["coding_plan", "research"]
    rationale: >-
      Verified chain-of-thought reasoning traces and olympiad math. Trains the
      planner/strategy/critic lanes and deliberate multi-step decomposition.
  - id: research-rag-citations
    title: "Research, RAG & citations"
    capability_domains: ["research", "evidence-verification", "citations", "memory"]
    model_task_classes: ["research", "citation_verification", "memory_curator"]
    rationale: >-
      Open-domain, multi-hop, and long-form QA with attributable citations.
      Trains the research engine and the evidence/citation verification gate.
  - id: preference-safety
    title: "Preference, safety & alignment"
    capability_domains: ["alignment", "safety", "refusal", "red-team", "owner-gates"]
    model_task_classes: ["coding_review", "research"]
    rationale: >-
      Human-preference and safety-preference data for helpfulness ranking and
      refusal/owner-gate behavior. Backs the constitution, verification gates,
      and self-audit layer. Largely preference/eval, not raw SFT.

