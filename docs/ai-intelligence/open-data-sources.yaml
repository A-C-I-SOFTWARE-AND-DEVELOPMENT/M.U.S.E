# Open data sources registry for training / evaluating JARVIS.
#
# This file is the machine-readable source of truth behind
# docs/ai-intelligence/top-open-data-sources-for-training.md. It is loaded by
# hermes_cli/jarvis_prime/open_data_sources.py and bridged into the Research
# Vault so the JARVIS learning pipeline can cite external open data.
#
# Field reference:
#   rank              ordering / priority from the research review (unique)
#   key               stable slug used by the CLI and code
#   name              human name
#   role              train | eval | both
#   legal_posture     permissive | mixed | cdla_permissive | apache_2_0 | mit |
#                     cc_by_4_0 | verify_at_ingest | no_llm_training
#   license_notes     usage / licensing constraints, caveats
#   languages         language coverage (free text)
#   size              reported scale (free text)
#   schema_provenance schema + provenance notes
#   quality_strengths why it is valuable
#   biases            main biases / duplication risks
#   best_tasks        recommended tasks + subset to ingest
#   source_uris       canonical URLs (first is used as the vault source_uri)
#   evidence_strength primary | strong | moderate | weak | vendor_reported
#                     (matches research_vault.EvidenceStrength)
#   core_ingest       in the recommended core training-ingest set
#   benchmark_wall    held out as an eval-only benchmark (never trained on)

version: 1
as_of: "2026-06-04"

sources:
  - rank: 1
    key: swe-bench
    name: "SWE-bench + SWE-bench Verified"
    role: both
    legal_posture: verify_at_ingest
    license_notes: >-
      Public benchmark assets; verify current redistribution terms at pull
      time. Verified (500 human-validated tasks) is held out as eval-only;
      original SWE-bench assets, if trained on, must be split by repo and time.
    languages: "Python (12 repos)"
    size: "2,294 task instances; Verified = 500"
    schema_provenance: "Issue text + repo snapshot + executable harness + tests/patch evaluation"
    quality_strengths: >-
      Best public benchmark for repo-level issue resolution; Verified improves
      instance clarity and correctness.
    biases: "Python-only; benchmark-contamination risk; issue-selection bias"
    best_tasks: >-
      Bug fixing, repo navigation, patching, test-aware repair. Keep Verified
      fully eval-only.
    source_uris:
      - "https://www.swebench.com"
      - "https://github.com/princeton-nlp/SWE-bench"
    evidence_strength: strong
    core_ingest: false
    benchmark_wall: true

  - rank: 2
    key: the-stack-v2
    name: "The Stack v2"
    role: train
    legal_posture: mixed
    license_notes: >-
      Mixed original licenses, including no_license; must follow original terms
      and honor removals. Permissive-only; exclude no_license, is_generated,
      is_vendor, and oversized/low-value files. Card warns about PII, secrets,
      and malicious code.
    languages: "658 languages"
    size: "3.28B unique files, 104.2M repos, 67.53 TB"
    schema_provenance: >-
      File-level metadata: blob_id, directory_id, path, content_id, detected
      licenses, repo name, revision/snapshot, stars/forks, generated/vendor
      flags. Provenance via Software Heritage + GH Archive.
    quality_strengths: "Massive breadth; explicit license metadata; near-dedup pipeline"
    biases: "Public-GitHub skew; possible PII/secrets; ~40% of permissive files near/exact duplicates"
    best_tasks: "Base code pretraining, retrieval corpus, code-style prior"
    source_uris:
      - "https://huggingface.co/datasets/bigcode/the-stack-v2"
    evidence_strength: strong
    core_ingest: true
    benchmark_wall: false

