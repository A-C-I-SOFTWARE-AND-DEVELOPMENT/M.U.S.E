# Hermes Model / Worker Intelligence Registry
#
# This file is the source of truth for which workers Hermes can route work
# to. The model-router skill (skills/model-router/SKILL.md) reads it on
# every routing decision. The companion docs in this directory describe
# the decision policy (model-routing-policy.md) and the per-worker
# capability matrix (tool-capability-matrix.md).
#
# Schema:
#   id                  — stable worker identifier used throughout Hermes
#   provider            — vendor or origin (hermes, openai, anthropic, etc.)
#   surface             — how the worker is exposed (internal, cli, app,
#                         web, local, mcp, tunnel, user-driven)
#   strengths           — what this worker is genuinely good at
#   best_for            — fine-grained task descriptors (free-form)
#   categories          — canonical task categories the worker handles;
#                         must come from the router's category list (see
#                         model-routing-policy.md §2)
#   detection           — how Hermes confirms the worker is reachable on
#                         the host
#   run_mode            — how Hermes drives the worker once selected
#   quality             — draft | standard | high | critical
#   speed               — slow  | medium   | fast | instant
#   cost                — free  | low      | medium | high
#   privacy             — local | standard | cloud
#   risk                — low   | medium   | high   (blast radius of a
#                         bad run)
#   validation          — intermediate checks the worker runs itself
#                         (final validation is always hermes-local)
#   fallbacks           — preferred fallback order if this worker is the
#                         primary
#   approval_required   — true if Hermes must collect human approval
#                         before invoking this worker
#   approval_triggers   — which approval tags the worker triggers
#                         (publish, deployment, schema, remote-tunnel-setup,
#                         secrets, continuous-listening, ...)
#
# Notes:
#   - "internal" workers (hermes-local, github-publisher, human-approval)
#     are always present.
#   - Detection is performed at session start and cached per process.
#   - Cost is qualitative; the router does not model dollars/token here.
#   - The registry is read by hermes_cli/model_registry.py at runtime.
#     If this file is missing or malformed, the router falls back to a
#     hard-coded built-in registry (see model_registry._BUILTIN).

models:
  - id: hermes-local
    provider: hermes
    surface: internal
    strengths:
      - repo evidence
      - terminal validation
      - file operations
      - memory
      - GitHub publishing
      - planning and routing
      - skill orchestration
    best_for:
      - every job
      - validation
      - local context
      - plumbing
      - redaction_safe_draft
      - github_publish
    categories:
      - planning
      - validation
      - backend-orchestration
      - user-profile-learning
      - voice-pipeline
      - security
    detection:
      internal: true
    run_mode:
      internal: true
    quality: high
    speed: fast
    cost: free
    privacy: local
    risk: low
    validation:
      runs_tests: true
      runs_lints: true
      reads_diff: true
      smoke_runs: true
    fallbacks: []
    approval_required: false
    approval_triggers: []

  - id: codex
    provider: openai
    surface: cli/app/web
    strengths:
      - implementation
      - tests
      - fast code changes
      - GitHub tasks
      - patch-oriented edits
    best_for:
      - feature implementation
      - bug fixes
      - test repair
      - refactor_small
    categories:
      - implementation
      - debug
      - validation
    detection:
      command: codex
      any_of:
        - env: OPENAI_API_KEY
        - file: ~/.codex/auth.json
        - file: ~/.hermes/auth.json   # hermes-managed openai-codex OAuth
      requires_git_repo: true
    run_mode:
      official_cli: true
      invocation: "codex exec '{prompt}'"
      pty: true
      flags:
        full_auto: "--full-auto"
        yolo: "--yolo"
    quality: high
    speed: fast
    cost: medium
    privacy: cloud
    risk: low
    validation:
      runs_tests: optional
      reads_diff: true
    fallbacks:
      - claude-code-local
      - aider
      - hermes-local
    approval_required: false
    approval_triggers: []

  - id: claude-code-local
    provider: anthropic
    surface: cli
    strengths:
      - architecture
      - long-context review
      - multi-file reasoning
      - refactor planning
      - risk review
      - careful diffs
    best_for:
      - architecture
      - code_review
      - long_context_review
      - refactor_large
      - complex refactor
    categories:
      - refactor
      - implementation
      - debug
      - security
    detection:
      command: claude
      any_of:
        - env: ANTHROPIC_API_KEY
        - file: ~/.claude/.credentials.json
        - command_help: claude
    run_mode:
      official_cli: true
      print_mode: "claude -p '{prompt}' --allowed-tools 'Read,Edit' --max-turns {max_turns}"
      interactive: "tmux + claude"
      prefers_print_mode: true
    quality: critical
    speed: medium
    cost: high
    privacy: cloud
    risk: low
    validation:
      reads_diff: true
      runs_tests: optional
    fallbacks:
      - codex
      - aider
      - hermes-local
    approval_required: false
    approval_triggers: []

  - id: claude-code-windows
    provider: anthropic
    surface: cli-tunnel
    strengths:
      - long-context review
      - multi-file reasoning
      - repo-wide refactor
      - architecture
      - remote workstation throughput
    best_for:
      - refactor_large
      - architecture
      - complex repo-wide coding
    categories:
      - refactor
      - implementation
      - architecture
      - backend-orchestration
      - remote-execution
    detection:
      command: claude
      tunnel: claude-code-windows   # secure tunnel must be healthy
      any_of:
        - env: ANTHROPIC_API_KEY
        - file: ~/.claude/.credentials.json
      requires:
        - tunnel.healthy: true
    run_mode:
      tunnel_cli: true
      invocation: "claude --remote windows -p '{prompt}'"
      pty: true
    quality: critical
    speed: medium
    cost: high
    privacy: cloud
    risk: medium
    validation:
      reads_diff: true
      runs_tests: optional
    fallbacks:
      - claude-code-local
      - codex
      - aider
      - hermes-local
    approval_required: true
    approval_triggers:
      - remote-tunnel-setup
    notes: >
      Preferred for complex repo-wide coding when the secure tunnel to
      the user's Windows workstation is healthy. Falls back to
      claude-code-local on any tunnel failure.

  - id: aider
    provider: paul-gauthier
    surface: cli
    strengths:
      - git-aware paired edits
      - surgical multi-file patches
      - explicit diff output
      - works against any chat model
    best_for:
      - refactor_small
      - bug_fix
      - test_repair
      - implementation
      - git-native local patch loops
    categories:
      - implementation
      - refactor
      - debug
    detection:
      command: aider
      requires_git_repo: true
      any_of:
        - env: OPENAI_API_KEY
        - env: ANTHROPIC_API_KEY
        - env: DEEPSEEK_API_KEY
        - env: OPENROUTER_API_KEY
        - env: AIDER_MODEL
    run_mode:
      official_cli: true
      invocation: "aider --yes --message '{prompt}'"
      pty: false
    quality: high
    speed: medium
    cost: low
    privacy: cloud
    risk: low
    validation:
      reads_diff: true
      runs_tests: optional
    fallbacks:
      - codex
      - claude-code-local
      - hermes-local
    approval_required: false
    approval_triggers: []
    notes: >
      Preferred for git-native local patch loops where surgical diffs
      and explicit commits are the priority.

  - id: goose
    provider: block
    surface: cli
    strengths:
      - local shell + file agent
      - plumbing tasks on the host
      - long-running shell sessions
      - extensible via MCP
      - recipe and extension workflows
    best_for:
      - plumbing
      - implementation
      - bug_fix
      - recipe-driven workflows
    categories:
      - implementation
      - backend-orchestration
      - debug
    detection:
      command: goose
      any_of:
        - file: ~/.config/goose/config.yaml
        - env: GOOSE_PROVIDER
    run_mode:
      official_cli: true
      invocation: "goose run --text '{prompt}'"
      pty: true
    quality: standard
    speed: medium
    cost: low
    privacy: cloud
    risk: low
    validation:
      reads_diff: true
      runs_tests: optional
    fallbacks:
      - aider
      - codex
      - hermes-local
    approval_required: false
    approval_triggers: []
    notes: >
      Optional worker selected for recipe and extension workflows.
      The router does not preferentially route to Goose unless a
      Goose recipe is the natural way to express the task.

  - id: chatgpt-handoff
    provider: openai
    surface: user-driven
    strengths:
      - user-driven reasoning
      - leverages an existing ChatGPT subscription
      - no API key required
      - safe for tasks the user wants to review manually
    best_for:
      - manual_handoff
      - research
      - architecture        # when the user wants to think alongside ChatGPT
    categories:
      - research
      - planning
    detection:
      manual_only: true     # only selectable when the user asks for it
      requires_user_opt_in: true
      config_flag: model_router.allow_manual_handoff
    run_mode:
      handoff: true
      mechanism: clipboard_or_deeplink
      no_api_calls: true
    quality: high
    speed: slow             # bounded by user paste cycle
    cost: free              # uses the user's existing subscription
    privacy: cloud
    risk: medium
    validation:
      user_pastes_back_result: true
      hermes_validates_pasted_result: true
    fallbacks:
      - hermes-local
    approval_required: false
    approval_triggers: []
    notes: >
      Never selected automatically. Opted in via /route chatgpt-handoff
      or model_router.allow_manual_handoff=true.

  - id: local-model
    provider: local
    surface: local
    strengths:
      - offline reasoning
      - redaction-safe drafting
      - free-tier fallback
      - privacy-preserving
    best_for:
      - redaction_safe_draft
      - research
      - implementation        # for small tasks where a local model is enough
      - bug_fix               # for small tasks
    categories:
      - research
      - planning
      - user-profile-learning
    detection:
      any_of:
        - port: 11434         # ollama default
        - command: ollama
        - command: llama-server
        - command: lms        # lm studio
        - env: HERMES_LOCAL_MODEL_URL
    run_mode:
      provider_endpoint: true
      respects:
        - model.base_url
        - model.api_key
        - HERMES_LOCAL_MODEL_URL
    quality: standard
    speed: medium
    cost: free
    privacy: local
    risk: low
    validation:
      reads_diff: true
      runs_tests: optional
    fallbacks:
      - aider
      - codex
      - claude-code-local
      - hermes-local
    approval_required: false
    approval_triggers: []

  - id: github-publisher
    provider: hermes
    surface: internal
    strengths:
      - branch / push / PR / comment
      - gated writes
      - allowlisted repos
      - audit-friendly token redaction
    best_for:
      - github_publish
    categories:
      - github-pr
      - deployment
    detection:
      internal: true
      requires:
        - github.enabled: true
        - "GITHUB_PERSONAL_ACCESS_TOKEN env var present"
      writes_require:
        - github.allow_writes: true
        - "repo on github.allowed_repositories (or allowlist empty)"
    run_mode:
      internal: true
      plugin: github_assistant
    quality: high
    speed: fast
    cost: free
    privacy: cloud
    risk: high
    validation:
      reads_diff: true        # confirms what is being pushed
      respects_allowlist: true
    fallbacks:
      - hermes-local          # leaves a TODO if the publisher can't act
    approval_required: true
    approval_triggers:
      - publish

  # ────────────────────────────────────────────────────────────────────
  # Specialist workers (browser, deployment, mobile, approval gate)
  # ────────────────────────────────────────────────────────────────────

  - id: browser-research
    provider: hermes
    surface: tool
    strengths:
      - current external docs
      - URL fetch
      - search summarization
      - citation capture
    best_for:
      - research
      - external_doc_lookup
    categories:
      - research
    detection:
      tool: browser
      any_of:
        - plugin: web_search
        - env: HERMES_BROWSER_BACKEND
    run_mode:
      internal: true
      tool: browser
    quality: high
    speed: fast
    cost: low
    privacy: cloud
    risk: low
    validation:
      cites_sources: true
      reads_diff: false
    fallbacks:
      - chatgpt-handoff
      - hermes-local
    approval_required: false
    approval_triggers: []
    notes: >
      Required when the task references current external docs. The
      router adds browser-research as a sidecar (role=researcher) for
      any category that needs fresh external context.

  - id: supabase-worker
    provider: supabase
    surface: mcp
    strengths:
      - Supabase schema and migration
      - row-level security policies
      - edge function deployment
      - typed client generation
    best_for:
      - deployment
      - backend_data_layer
    categories:
      - deployment
      - backend-orchestration
      - remote-execution
    detection:
      mcp: supabase
      any_of:
        - env: SUPABASE_ACCESS_TOKEN
        - file: ~/.supabase/access-token
    run_mode:
      mcp: true
      server: supabase
    quality: high
    speed: medium
    cost: medium
    privacy: cloud
    risk: high
    validation:
      dry_run_migration: true
      reads_diff: true
    fallbacks:
      - hermes-local
    approval_required: true
    approval_triggers:
      - schema
      - deployment
    notes: >
      The Supabase worker only runs after schema and/or deployment
      approval has been granted. The router holds it back from the
      candidate set until the relevant approval tag is present.

  - id: vercel-worker
    provider: vercel
    surface: mcp
    strengths:
      - Vercel deployment
      - preview environments
      - edge config and rewrites
      - rollback control
    best_for:
      - deployment
      - preview_environment
    categories:
      - deployment
      - remote-execution
    detection:
      mcp: vercel
      any_of:
        - env: VERCEL_TOKEN
        - command: vercel
    run_mode:
      mcp: true
      server: vercel
    quality: high
    speed: fast
    cost: medium
    privacy: cloud
    risk: high
    validation:
      preview_build: true
      reads_diff: true
    fallbacks:
      - hermes-local
    approval_required: true
    approval_triggers:
      - deployment
    notes: >
      The Vercel worker only runs after deployment approval has been
      granted. The router holds it back from the candidate set until
      the deployment approval tag is present.

  - id: android-builder
    provider: hermes
    surface: local
    strengths:
      - Android Gradle build
      - Termux runtime
      - Jetpack / Compose
      - instrumentation tests on attached device
    best_for:
      - mobile-android
      - apk_build
    categories:
      - mobile-android
      - deployment
    detection:
      any_of:
        - command: gradle
        - command: ./gradlew
        - env: ANDROID_HOME
        - env: ANDROID_SDK_ROOT
    run_mode:
      gradle: true
      invocation: "./gradlew :app:assembleDebug"
    quality: high
    speed: medium
    cost: free
    privacy: local
    risk: medium
    validation:
      runs_tests: optional
      apk_lints: true
    fallbacks:
      - hermes-local
    approval_required: false
    approval_triggers: []
    notes: >
      Owns Android build and packaging. Pairs with claude-code-local
      or codex for the actual source changes; the android-builder
      worker is the surface that runs gradle on the host.

  - id: human-approval
    provider: user
    surface: user-driven
    strengths:
      - explicit consent for destructive actions
      - approval for remote execution
      - policy gate for secrets / publish / continuous listening
    best_for:
      - approval_gate
    categories:
      - secrets-management
      - deployment
      - remote-execution
      - github-pr
      - security
    detection:
      internal: true
      always_available: true
    run_mode:
      internal: true
      prompt_user: true
    quality: critical
    speed: slow
    cost: free
    privacy: local
    risk: low
    validation:
      requires_explicit_confirmation: true
    fallbacks: []
    approval_required: true
    approval_triggers:
      - secrets
      - destructive
      - publish
      - remote-tunnel-setup
      - continuous-listening
    notes: >
      Human approval is required for secrets, destructive commands,
      publish, remote-tunnel setup, and continuous-listening mode.
      The router always includes human-approval in the selected
      worker list when any of those triggers apply.

# Routing knobs the model-router skill reads from config.yaml.
# These are documented here so the registry, the policy doc, and the
# capability matrix all reference the same option names.
config_keys:
  - model_router.preferred_workers
  - model_router.prefer_local
  - model_router.allow_manual_handoff
  - model_router.cost_ceiling          # low | medium | high | unlimited
  - model_router.quality_floor         # draft | standard | high | critical
  - model_router.max_fallbacks
