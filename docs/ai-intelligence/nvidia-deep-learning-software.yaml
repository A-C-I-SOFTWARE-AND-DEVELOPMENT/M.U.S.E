# NVIDIA Deep Learning Software registry.
#
# Machine-readable source of truth behind
# docs/ai-intelligence/nvidia-deep-learning-software.md. Loaded by
# hermes_cli/jarvis_prime/nvidia_dl_software.py and bridged into the Research
# Vault so the JARVIS pipeline can cite NVIDIA's deep-learning software stack
# (frameworks, inference, libraries, and developer/devops tools) with provenance.
#
# MUSE is hardware-agnostic and local-first: nothing here is downloaded, built,
# or executed. We store provenance cards only (purpose, capabilities, canonical
# URIs, license posture). Several of these are proprietary NVIDIA components
# under the NVIDIA Software License / EULA.
#
# Capture note: the live page https://developer.nvidia.com/deep-learning-software
# returned HTTP 403 to every available fetcher on 2026-06-15, so entries were
# reconstructed from NVIDIA's official sub-pages plus web search. Every entry is
# therefore evidence_strength: vendor_reported and its license_notes asks the
# reader to re-verify the URI/details at ingest.
#
# Field reference:
#   rank              ordering across the page (unique)
#   key               stable slug used by the CLI and code (unique)
#   name              human name
#   section           page grouping: Frameworks | Inference | Libraries |
#                     Developer and DevOps Tools
#   category          framework | inference-sdk | inference-server |
#                     inference-integration | library | profiler |
#                     orchestration | visualization
#   purpose           one-line description
#   capabilities      bullet capabilities (free-text list)
#   interfaces        gui | cli | both | library | sdk
#   requires_gpu      true if it needs an NVIDIA GPU to run
#   license           open-source | proprietary | mixed
#   official_uri      canonical NVIDIA product/landing page
#   source_uris       canonical URLs (first is used as the vault source_uri)
#   license_notes     licensing posture + capture caveat
#   evidence_strength primary | strong | moderate | weak | vendor_reported
#                     (matches research_vault.EvidenceStrength)

version: 1
