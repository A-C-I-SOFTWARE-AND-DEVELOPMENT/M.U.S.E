    why: "8B that matches far larger models on AIME — best local reasoner."
    sources:
      - "https://www.clarifai.com/blog/top-10-open-source-reasoning-models-in-2026"

  - id: qwen3-235b
    vendor: Alibaba
    license: Apache-2.0
    license_spdx: Apache-2.0
    open_weights: true
    tier: frontier
    current_variant: qwen3-235b-a22b
    context_window: 262000
    params: "235B total / ~22B active (MoE)"
    local: false
    best_for: [reasoning, math, coding]
    benchmarks:
      aime_2025: 89.2
      humaneval: 91.5
    providers:
      - {provider: qwen-oauth, model: qwen3-235b-a22b}
      - {provider: openrouter, model: qwen/qwen3-235b-a22b}
      - {provider: nvidia, model: qwen/qwen3-235b-a22b}
    why: "Top open reasoning+math (AIME 89%) under permissive Apache-2.0."
    sources:
      - "https://www.clarifai.com/blog/top-10-open-source-reasoning-models-in-2026"

  - id: gpt-oss-120b
    vendor: OpenAI (open weights)
    license: Apache-2.0
    license_spdx: Apache-2.0
    open_weights: true
    tier: strong
    current_variant: gpt-oss-120b
    context_window: 131000
    params: "117B total / 5.1B active (MoE)"
    local: false
    best_for: [reasoning, agentic_coding]
    benchmarks: {}
    providers:
      - {provider: openrouter, model: openai/gpt-oss-120b}
      - {provider: novita, model: openai/gpt-oss-120b}
      - {provider: nvidia, model: openai/gpt-oss-120b}
      - {provider: ollama-cloud, model: gpt-oss:120b}
    why: "Near o4-mini reasoning, Apache-2.0; pairs with the 20B local sibling."
    sources:
      - "https://www.clarifai.com/blog/top-10-open-source-reasoning-models-in-2026"

  - id: gpt-oss-20b
    vendor: OpenAI (open weights)
    license: Apache-2.0
    license_spdx: Apache-2.0
    open_weights: true
    tier: local
    current_variant: gpt-oss-20b
    context_window: 131000
    params: "21B total / 3.6B active (MoE) — runs on 16GB RAM"
    local: true
    local_runner: ollama
    best_for: [local_reasoning, local_coding, reasoning]
    benchmarks: {}
    providers:
      - {provider: ollama-cloud, model: gpt-oss:20b}
      - {provider: huggingface, model: openai/gpt-oss-20b}
      - {provider: openrouter, model: openai/gpt-oss-20b}
    why: "Capable reasoning on a 16GB laptop — the everyday local default."
    sources:
      - "https://www.clarifai.com/blog/top-10-open-source-reasoning-models-in-2026"

# Task category -> ordered family ids (preference first, then fallbacks).
# Tasks prefixed local_ bias toward families with local:true.
routing:
  coding:          [deepseek-v4, glm-5, kimi-k2, minimax-m2, qwen3-coder]
  agentic_coding:  [glm-5, deepseek-v4, kimi-k2, minimax-m2, qwen3-coder]
  bug_fix:         [glm-5, deepseek-v4, kimi-k2, qwen3-coder, devstral-small]
  code_edit:       [qwen3-coder, kimi-k2, glm-5, devstral-small, deepseek-v4]
  reasoning:       [deepseek-r1, qwen3-235b, glm-5, gpt-oss-120b, deepseek-v4]
  math:            [deepseek-r1, qwen3-235b, deepseek-r1-distill-8b]
  local_coding:    [qwen3-coder, qwen3-27b, devstral-small, gpt-oss-20b]
  local_reasoning: [deepseek-r1-distill-8b, gpt-oss-20b, qwen3-27b]
