# Task category -> ordered family ids (preference first, then fallbacks).
# Tasks prefixed local_ bias toward families with local:true. Gemma 4 leads
# the local/mobile/memory/voice/summary/multimodal lanes, trails on
# local_coding, and is only a fallback for coding_review / deep_research.
#
# NOTE on variant + lane policy (enforced in task_router.py, not here): the
# local Gemma lanes are routed by job weight — fast-daily lanes use E2B, deeper
# reasoning/coding use E4B (load-gated, falling back to E2B), and 26B/31B are
# never an auto local default. `deep_research` / `citation` route OFF-local
# (hosted/worker/paid first) because the small local variants can't carry large
# autonomous research; Gemma here stays a last-ditch local fallback only.
routing:
  coding:          [deepseek-v4, glm-5, kimi-k2, minimax-m2, qwen3-coder]
  agentic_coding:  [glm-5, deepseek-v4, kimi-k2, minimax-m2, qwen3-coder]
  bug_fix:         [glm-5, deepseek-v4, kimi-k2, qwen3-coder, devstral-small]
  code_edit:       [qwen3-coder, kimi-k2, glm-5, devstral-small, deepseek-v4]
  reasoning:       [deepseek-r1, qwen3-235b, glm-5, gpt-oss-120b, deepseek-v4]
  math:            [deepseek-r1, qwen3-235b, deepseek-r1-distill-8b]
  local_coding:    [qwen3-coder, qwen3-27b, devstral-small, gpt-oss-20b, gemma4]
  local_reasoning: [gemma4, deepseek-r1-distill-8b, gpt-oss-20b, qwen3-27b]
  memory_curator:  [gemma4, deepseek-r1-distill-8b, gpt-oss-20b]
  mobile_chat:     [gemma4, gpt-oss-20b, deepseek-r1-distill-8b]
  voice_reply:     [gemma4, gpt-oss-20b]
  summarization:   [gemma4, deepseek-r1-distill-8b, gpt-oss-20b, qwen3-235b]
  multimodal_doc:  [qwen3-vl, gemma4]
  multimodal:      [qwen3-vl, qwen-omni, gemma4]
  embeddings:      [qwen3-embedding, bge-m3]
  rerank:          [qwen3-reranker, bge-reranker]
  coding_review:   [glm-5, deepseek-v4, qwen3-coder, gemma4]
  citation_verification: [deepseek-r1, qwen3-235b, glm-5, gemma4]
  deep_research:   [deepseek-r1, qwen3-235b, gemma4]
