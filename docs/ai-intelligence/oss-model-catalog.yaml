  - "https://www.bentoml.com/blog/multimodal-ai-a-guide-to-open-source-vision-language-models"
  - "https://github.com/qwenlm/qwen3-vl"
  - "https://arxiv.org/abs/2511.21631"
  - "https://awesomeagents.ai/leaderboards/embedding-model-leaderboard-mteb-march-2026/"
  - "https://arxiv.org/pdf/2601.04720"

