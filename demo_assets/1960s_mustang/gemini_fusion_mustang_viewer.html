<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gemini Fusion - Ultra-Realistic 1960s Mustang</title>
<style>
  html, body { 
    margin: 0; 
    padding: 0; 
    width: 100%; 
    height: 100%; 
    overflow: hidden; 
    background-color: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  canvas { display: block; }
  #info {
    position: absolute;
    top: 20px;
    left: 20px;
    padding: 15px 20px;
    background: rgba(0, 0, 0, 0.6);
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(10px);
    max-width: 450px;
  }
  h1 { font-size: 1.5em; margin: 0 0 10px; }
  p { font-size: 0.9em; margin: 5px 0; line-height: 1.4; color: #ccc; }
  #loader {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 1.2em;
  }
</style>
</head>
<body>
  <div id="info">
    <h1>Gemini Fusion Mustang</h1>
    <p>Ultra-realistic, beautifully lit 1960s Mustang-inspired fastback generated by Google's Gemini models.</p>
    <p>Drag to rotate, scroll to zoom.</p>
  </div>
  <div id="loader">Loading...</div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    let camera, scene, renderer, controls, composer;
    const loader = document.getElementById('loader');

    function init() {
      // Scene setup
      scene = new THREE.Scene();

      // Camera
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
      camera.position.set(8, 3, 8);

      // Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setAnimationLoop(animate);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      document.body.appendChild(renderer.domElement);

      // Controls
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.target.set(0, 1, 0);

      // Lighting & Environment
      new RGBELoader().load('studio_small_03_1k.hdr', (texture) => {
        texture.mapping = THREE.EquirectangularReflectionMapping;
        scene.background = texture;
        scene.environment = texture;
        loader.style.display = 'none';
      });

      const dirLight = new THREE.DirectionalLight(0xffffff, 2);
      dirLight.position.set(5, 10, 7.5);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 2048;
      dirLight.shadow.mapSize.height = 2048;
      scene.add(dirLight);
      
      const pointLight = new THREE.PointLight(0xffffff, 0.5);
      pointLight.position.set(-5, 5, 5);
      scene.add(pointLight);

      // Post-processing
      const renderPass = new RenderPass(scene, camera);
      const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
      bloomPass.threshold = 0;
      bloomPass.strength = 0.4;
      bloomPass.radius = 0;

      composer = new EffectComposer(renderer);
      composer.addPass(renderPass);
      composer.addPass(bloomPass);

      // Materials
      const paint = new THREE.MeshPhysicalMaterial({
        color: 0x0a3d22,
        metalness: 0.8,
        roughness: 0.2,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1
      });

      const chrome = new THREE.MeshPhysicalMaterial({
        color: 0xffffff,
        metalness: 1.0,
        roughness: 0.1
      });

      const glass = new THREE.MeshPhysicalMaterial({
        color: 0xffffff,
        metalness: 0,
        roughness: 0,
        transmission: 1.0,
        ior: 1.5
      });
      
      const rubber = new THREE.MeshPhysicalMaterial({ color: 0x020202, roughness: 0.8 });
      
      const emissiveRed = new THREE.MeshPhysicalMaterial({ color: 0xff0000, emissive: 0xff0000, emissiveIntensity: 1 });

      // Geometry
      createCar(paint, chrome, glass, rubber, emissiveRed);
      
      // Floor
      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(50, 50),
        new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.5, metalness: 0.5 })
      );
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      scene.add(floor);

      window.addEventListener('resize', onWindowResize);
    }

    function createCar(paint, chrome, glass, rubber, emissiveRed) {
        const car = new THREE.Group();
        scene.add(car);

        // Body
        const bodyShape = new THREE.Shape();
        bodyShape.moveTo(-2.3, 0.5);
        bodyShape.bezierCurveTo(-2.2, 1.5, -1, 1.6, 0, 1.6);
        bodyShape.bezierCurveTo(1.5, 1.6, 2.4, 1.2, 2.5, 0.5);
        bodyShape.lineTo(2.5, 0.2);
        bodyShape.lineTo(-2.3, 0.2);
        const extrudeSettings = { depth: 1.8, bevelEnabled: true, bevelThickness: 0.1, bevelSize: 0.1, bevelSegments: 2 };
        const body = new THREE.Mesh(new THREE.ExtrudeGeometry(bodyShape, extrudeSettings), paint);
        body.position.set(0, 0.5, -0.9);
        body.castShadow = true;
        car.add(body);
        
        // Roof
        const roof = new THREE.Mesh(new THREE.BoxGeometry(2, 0.8, 1.6), paint);
        roof.position.set(0.2, 1.9, 0);
        car.add(roof);

        // Wheels
        for (let i = 0; i < 4; i++) {
            const wheel = new THREE.Group();
            const tire = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.3, 64), rubber);
            tire.rotation.z = Math.PI / 2;
            const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.35, 64), chrome);
            rim.rotation.z = Math.PI / 2;
            wheel.add(tire);
            wheel.add(rim);
            wheel.position.set(i < 2 ? -1.5 : 1.5, 0.5, i % 2 === 0 ? -1 : 1);
            car.add(wheel);
        }

        // Windows
        const windshield = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 0.7), glass);
        windshield.position.set(-1.1, 1.7, 0);
        windshield.rotation.y = -Math.PI / 6;
        car.add(windshield);
        
        // Grill and lights
        const grill = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 0.5), chrome);
        grill.position.set(-2.35, 0.9, 0);
        grill.rotation.y = Math.PI / 2;
        car.add(grill);
        
        const headlight = new THREE.Mesh(new THREE.SphereGeometry(0.15), emissiveRed);
        headlight.position.set(-2.4, 1, 0.5);
        car.add(headlight);
        const headlight2 = headlight.clone();
        headlight2.position.z = -0.5;
        car.add(headlight2);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      controls.update();
      composer.render();
    }

    init();
  </script>
</body>
</html>
